<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>CRM 에이전틱 워크플로우 스윔레인</title>
<style>
  html,body{overflow-x:hidden}
  td{white-space:nowrap}
  body{margin:0;background:#fff;font-family:'Pretendard Variable','Noto Sans KR',-apple-system,sans-serif}
  svg{display:block}
  .lane-label{font-size:14px;font-weight:800;fill:#18181b}
  .lane-sub{font-size:11px;fill:#71717a}
  .phase{font-size:12px;font-weight:700;fill:#52525b;letter-spacing:.5px}
  .box{fill:#fff;stroke:#d4d4d8;stroke-width:1.5}
  .box.agent{fill:#eff6ff;stroke:#93c5fd}
  .box.tool{fill:#f4f4f5;stroke:#d4d4d8}
  .gate{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
  .t{font-size:12.5px;font-weight:700;fill:#18181b}
  .s{font-size:10.5px;fill:#52525b}
  .arrow{stroke:#a1a1aa;stroke-width:1.5;fill:none;marker-end:url(#ah)}
  .arrow.strong{stroke:#2563eb}
  .num{font-size:11px;font-weight:800;fill:#b45309}
  .title{font-size:17px;font-weight:800;fill:#18181b}
  .sub{font-size:11.5px;fill:#71717a}
</style></head>
<body>
<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a1a1aa"/></marker></defs>
  <text x="40" y="38" class="title">CRM 캠페인 에이전틱 워크플로우</text>
  <text x="40" y="58" class="sub">아이디어 한 줄에서 발송·성과분석까지. 사람은 네 개의 게이트에서만 결정하고, 나머지는 에이전트가 도구를 호출해 처리한다.</text>

  <!-- phase header -->
  <g class="phase">
    <rect x="200" y="80" width="1160" height="26" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="330" y="98" text-anchor="middle">1 · 실험 설계</text>
    <text x="620" y="98" text-anchor="middle">2 · 제작</text>
    <text x="910" y="98" text-anchor="middle">3 · 발송</text>
    <text x="1200" y="98" text-anchor="middle">4 · 저장 · 분석</text>
    <line x1="490" y1="80" x2="490" y2="740" stroke="#e4e4e7" stroke-dasharray="4 4"/>
    <line x1="780" y1="80" x2="780" y2="740" stroke="#e4e4e7" stroke-dasharray="4 4"/>
    <line x1="1070" y1="80" x2="1070" y2="740" stroke="#e4e4e7" stroke-dasharray="4 4"/>
  </g>

  <!-- lanes -->
  <g>
    <rect x="40" y="120" width="1320" height="170" fill="#fffdf5" stroke="#e4e4e7"/>
    <rect x="40" y="290" width="1320" height="240" fill="#fff" stroke="#e4e4e7"/>
    <rect x="40" y="530" width="1320" height="210" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="58" y="150" class="lane-label">마케터</text><text x="58" y="168" class="lane-sub">결정만 한다</text>
    <text x="58" y="320" class="lane-label">CRM 에이전트</text><text x="58" y="338" class="lane-sub">Claude Code 스킬</text>
    <text x="58" y="560" class="lane-label">데이터 · 도구</text><text x="58" y="578" class="lane-sub">MCP 호출</text>
  </g>

  <!-- Phase 1 -->
  <g>
    <rect x="215" y="170" width="120" height="48" rx="10" class="gate"/><text x="275" y="190" text-anchor="middle" class="t">게이트 ① 방향</text><text x="275" y="206" text-anchor="middle" class="s">목표·타겟·혜택 확정</text>
    <rect x="360" y="170" width="120" height="48" rx="10" class="gate"/><text x="420" y="190" text-anchor="middle" class="t">게이트 ② 기획안</text><text x="420" y="206" text-anchor="middle" class="s">실험 설계·팀장 승인</text>
    <rect x="215" y="330" width="120" height="52" rx="8" class="box agent"/><text x="275" y="352" text-anchor="middle" class="t">실험 설계</text><text x="275" y="368" text-anchor="middle" class="s">실험안 2~3개 · 대조군 비율</text>
    <rect x="360" y="330" width="120" height="52" rx="8" class="box agent"/><text x="420" y="352" text-anchor="middle" class="t">기획서 작성</text><text x="420" y="368" text-anchor="middle" class="s">목적·KPI·타겟 조건</text>
    <rect x="215" y="430" width="120" height="52" rx="8" class="box agent"/><text x="275" y="452" text-anchor="middle" class="t">모수 확인</text><text x="275" y="468" text-anchor="middle" class="s">발송 대상 규모 산정</text>
    <rect x="215" y="600" width="120" height="52" rx="8" class="box tool"/><text x="275" y="622" text-anchor="middle" class="t">BigQuery</text><text x="275" y="638" text-anchor="middle" class="s">세그먼트 쿼리 실행</text>
  </g>
  <!-- Phase 2 -->
  <g>
    <rect x="505" y="330" width="120" height="52" rx="8" class="box agent"/><text x="565" y="352" text-anchor="middle" class="t">세그먼트 추출</text><text x="565" y="368" text-anchor="middle" class="s">CSV · 그룹 필드</text>
    <rect x="650" y="330" width="120" height="52" rx="8" class="box agent"/><text x="710" y="352" text-anchor="middle" class="t">카피 · 미리보기</text><text x="710" y="368" text-anchor="middle" class="s">iOS · AOS 잠금화면</text>
    <rect x="505" y="430" width="120" height="52" rx="8" class="box agent"/><text x="565" y="452" text-anchor="middle" class="t">딥링크 · 세팅 가이드</text><text x="565" y="468" text-anchor="middle" class="s">클릭 단위 Braze 안내</text>
    <rect x="505" y="600" width="120" height="52" rx="8" class="box tool"/><text x="565" y="622" text-anchor="middle" class="t">Playwright · Figma</text><text x="565" y="638" text-anchor="middle" class="s">미리보기 PNG · 랜딩 화면</text>
    <rect x="650" y="600" width="120" height="52" rx="8" class="box tool"/><text x="710" y="622" text-anchor="middle" class="t">Braze</text><text x="710" y="638" text-anchor="middle" class="s">캔버스 세팅 (사람 실행)</text>
  </g>
  <!-- Phase 3 -->
  <g>
    <rect x="795" y="170" width="120" height="48" rx="10" class="gate"/><text x="855" y="190" text-anchor="middle" class="t">게이트 ③ 공지글</text><text x="855" y="206" text-anchor="middle" class="s">DM 미리보기 확인</text>
    <rect x="940" y="170" width="120" height="48" rx="10" class="gate"/><text x="1000" y="190" text-anchor="middle" class="t">게이트 ④ 발송</text><text x="1000" y="206" text-anchor="middle" class="s">"발송 GO" 한마디</text>
    <rect x="795" y="330" width="120" height="52" rx="8" class="box agent"/><text x="855" y="352" text-anchor="middle" class="t">공지 초안</text><text x="855" y="368" text-anchor="middle" class="s">전사 · CS 채널용</text>
    <rect x="940" y="330" width="120" height="52" rx="8" class="box agent"/><text x="1000" y="352" text-anchor="middle" class="t">예약 발송</text><text x="1000" y="368" text-anchor="middle" class="s">클라우드에서 시각 맞춰</text>
    <rect x="795" y="600" width="120" height="52" rx="8" class="box tool"/><text x="855" y="622" text-anchor="middle" class="t">Slack</text><text x="855" y="638" text-anchor="middle" class="s">공지 게시 · 이미지 첨부</text>
    <rect x="940" y="600" width="120" height="52" rx="8" class="box tool"/><text x="1000" y="622" text-anchor="middle" class="t">Cloud Run</text><text x="1000" y="638" text-anchor="middle" class="s">예약 발송 · 상태 갱신</text>
  </g>
  <!-- Phase 4 -->
  <g>
    <rect x="1085" y="330" width="120" height="52" rx="8" class="box agent"/><text x="1145" y="352" text-anchor="middle" class="t">자산 저장 · 등록</text><text x="1145" y="368" text-anchor="middle" class="s">기획서·가이드·미리보기</text>
    <rect x="1230" y="330" width="120" height="52" rx="8" class="box agent"/><text x="1290" y="352" text-anchor="middle" class="t">성과 분석</text><text x="1290" y="368" text-anchor="middle" class="s">실험군 − 대조군 (%p)</text>
    <rect x="1230" y="430" width="120" height="52" rx="8" class="box agent"/><text x="1290" y="452" text-anchor="middle" class="t">주간 종합 리포트</text><text x="1290" y="468" text-anchor="middle" class="s">매일 08:00 자동 집계</text>
    <rect x="1085" y="600" width="120" height="52" rx="8" class="box tool"/><text x="1145" y="622" text-anchor="middle" class="t">GCS 저장소</text><text x="1145" y="638" text-anchor="middle" class="s">캠페인 폴더 · meta.json</text>
    <rect x="1230" y="600" width="120" height="52" rx="8" class="box tool"/><text x="1290" y="622" text-anchor="middle" class="t">대시보드 · 슬랙봇</text><text x="1290" y="638" text-anchor="middle" class="s">자동 등록 · 질의응답</text>
  </g>

  <!-- arrows -->
  <g class="arrow">
    <path d="M275,218 L275,330"/>
    <path d="M275,382 L275,430"/>
    <path d="M275,482 L275,600"/>
    <path d="M335,356 L360,356"/>
    <path d="M420,330 L420,218"/>
    <path d="M480,356 L505,356"/>
    <path d="M625,356 L650,356"/>
    <path d="M565,382 L565,430"/>
    <path d="M565,482 L565,600"/>
    <path d="M710,382 L710,600"/>
    <path d="M770,356 L795,356"/>
    <path d="M855,330 L855,218"/>
    <path d="M855,382 L855,600"/>
    <path d="M915,356 L940,356"/>
    <path d="M1000,330 L1000,218"/>
    <path d="M1000,382 L1000,600"/>
    <path d="M1060,356 L1085,356"/>
    <path d="M1145,382 L1145,600"/>
    <path d="M1205,356 L1230,356"/>
    <path d="M1290,382 L1290,430"/>
    <path d="M1290,482 L1290,600"/>
  </g>
  <!-- legend -->
  <g transform="translate(40,700)">
    <rect x="0" y="12" width="14" height="14" rx="3" class="gate"/><text x="20" y="24" class="s">사람 컨펌 게이트 (4곳)</text>
    <rect x="170" y="12" width="14" height="14" rx="3" class="box agent"/><text x="190" y="24" class="s">에이전트 자동 처리</text>
    <rect x="320" y="12" width="14" height="14" rx="3" class="box tool"/><text x="340" y="24" class="s">MCP · 외부 도구</text>
  </g>
</svg>
</body></html>
