<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>모케터 체험 데모</title>
<style>
  :root{--top:#350d36;--side:#19171d;--side-txt:#d1d2d3;--side-active:#1164a3;--text:#1d1c1d;--sub:#616061;--muted:#868686;--border:#dddddd;--link:#1264a3;--green:#007a5a;--hl:#f8f8f8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overflow-x:hidden}
  body{font-family:'Lato','Noto Sans KR','Apple SD Gothic Neo','Pretendard Variable',-apple-system,sans-serif;font-size:15px;color:var(--text);background:#fff;line-height:1.46;-webkit-font-smoothing:antialiased}
  td{white-space:nowrap}
  .app{display:flex;flex-direction:column;height:100%;min-height:520px}
  /* 상단 바 */
  .topbar{height:40px;background:var(--top);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;position:relative}
  .topbar .search{width:min(560px,60%);height:26px;border-radius:6px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;display:flex;align-items:center;padding:0 10px;gap:8px}
  .topbar .nav{position:absolute;left:14px;display:flex;gap:6px;color:rgba(255,255,255,.7);font-size:14px}
  .topbar .demo-tag{position:absolute;right:12px;font-size:11px;color:#fff;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:100px;white-space:nowrap}
  .body{display:flex;flex:1;min-height:0}
  /* 사이드바 */
  .side{width:232px;flex-shrink:0;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;overflow:hidden}
  .ws{padding:12px 16px;font-weight:900;font-size:17px;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
  .ws small{font-weight:600;font-size:11px;color:rgba(255,255,255,.6);display:block}
  .side-sec{padding:14px 16px 4px;font-size:13px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px}
  .side-sec::before{content:'▾';font-size:10px}
  .ch{padding:4px 16px 4px 26px;font-size:15px;color:var(--side-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;cursor:default}
  .ch::before{content:'#';position:absolute;left:14px;opacity:.7}
  .ch.lock::before{content:'🔒';font-size:10px;left:12px;top:8px}
  .ch.dm::before{content:'';width:8px;height:8px;border-radius:50%;background:#2bac76;left:14px;top:11px;position:absolute}
  .ch.dm.off::before{background:transparent;border:1px solid var(--side-txt)}
  .ch.active{background:var(--side-active);color:#fff;border-radius:6px;margin:0 8px;padding-left:18px}
  .ch.active::before{left:6px}

  .msg.user .av{background:#4a154b;border:none;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .msg .b{min-width:0;flex:1}
  .msg .name{font-weight:900;font-size:15px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .msg .name .badge{font-size:10px;font-weight:700;background:#e8e8e8;color:#5a5a5a;padding:0 4px;border-radius:3px;line-height:16px}
  .msg .name .t{font-weight:400;font-size:12px;color:var(--muted)}
  .msg .txt{font-size:15px;word-break:break-word}
  .msg .txt b{font-weight:900}
  .msg .txt p{margin:0}
  .msg .txt ul{margin:2px 0 2px 22px}
  .nm{filter:blur(4px);user-select:none}
  .msg .txt .mention{background:#e8f5fa;color:var(--link);padding:0 3px;border-radius:3px;font-weight:600}
  .msg .txt a{color:var(--link);text-decoration:none}
  .msg .txt .warn{display:block;margin:4px 0}
  .react{display:inline-flex;gap:4px;margin-top:6px}
  .mail{border-left:4px solid #c9c9c9;padding:2px 0 2px 12px;margin-top:4px;transition:border-color .2s}
  .mail.done{border-left-color:#2bac76}.mail.drop{border-left-color:#9a9a9a}
  .mail .st{font-size:13px;color:#616061;margin-top:6px}
  .rx{display:inline-flex;gap:4px;margin-top:6px}
  .rx button{font-family:inherit;font-size:12px;border:1px solid #d0d0d0;border-radius:12px;padding:1px 9px;background:#fff;cursor:pointer}
  .rx button:not(.on){filter:grayscale(1);opacity:.7}
  .rx button.on{background:#eef5fb;border-color:#1264a3;color:#1264a3;font-weight:700}
  .rx .hint{font-size:11px;color:#868686;align-self:center;margin-left:4px}
  .react span{font-size:12px;border:1px solid #cfd8e0;border-radius:12px;padding:1px 8px;background:#eef5fb;color:#1264a3;font-weight:700}
  .typing{display:inline-flex;gap:3px;padding:8px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
  .tblw{overflow-x:auto;max-width:100%;margin:8px 0 4px}
  table.bk{border-collapse:collapse;font-size:14px;border:1px solid #ddd}
  table.bk th{background:#f6f6f6;text-align:left;padding:6px 12px;font-weight:900;border:1px solid #ddd}
  table.bk td{padding:6px 12px;border:1px solid #e5e5e5}
  table.bk td.n{text-align:right;font-variant-numeric:tabular-nums}
  table.bk td.l{color:var(--link)}
  .img{margin:8px 0 2px;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;background:#fff;max-width:560px}
  .img .cap{font-size:12px;color:var(--muted);padding:4px 10px;border-bottom:1px solid #eee}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px}
  .cal .h{background:#f8f8f8;color:#777;text-align:center;padding:4px 0;border-bottom:1px solid #eee}
  .cal .d{min-height:54px;padding:3px 5px;border-right:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0}
  .cal .d em{font-style:normal;font-weight:700;color:#555;display:block;margin-bottom:2px}
  .cal .d.today em{color:#fff;background:#1a56db;border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;font-size:10px}
  .cal .d i{font-style:normal;display:block;font-size:10px;line-height:1.3;color:#333}
  .cal .d i b{font-weight:400}
  .cal .d i::before{content:'●';color:#1a56db;font-size:7px;margin-right:3px;vertical-align:1px}
  .cal .d i.in::before{color:#0f9d58}
  .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btns button{font-family:inherit;font-size:13px;padding:6px 14px;border-radius:4px;border:1px solid #bbb;background:#fff;cursor:pointer;font-weight:700}
  .btns button.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btns button.danger{color:#e01e5a;border-color:#e01e5a}
  .btns button:hover{filter:brightness(.96)}
  .src{font-size:12px;color:var(--muted);margin-top:6px}
  /* 입력창 */
  .compose{padding:0 20px 14px;background:#fff;flex-shrink:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chips button{font-family:inherit;font-size:12px;padding:4px 10px;border-radius:100px;border:1px solid #cfcfcf;background:#fff;cursor:pointer;color:var(--sub)}
  .chips button:hover{border-color:var(--text);color:var(--text)}
  .chips button.hi{border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#7b5cff,#2f80ed,#21b8a6) border-box;color:#1d1c1d;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .chips button.hi svg{width:11px;height:11px;flex-shrink:0}
  .chips button.hi:hover{background:linear-gradient(#f6f5ff,#f6f5ff) padding-box,linear-gradient(120deg,#7b5cff,#2f80ed,#21b8a6) border-box}
  .box{border:1px solid #8d8d8d;border-radius:8px;overflow:hidden}
  .box .tools{display:flex;gap:10px;padding:6px 10px;background:#f8f8f8;color:#616061;font-size:13px;border-bottom:1px solid #eee}
  .box .row{display:flex}
  .box input{flex:1;border:none;outline:none;padding:10px 12px;font-family:inherit;font-size:15px;min-width:0}
  .box button{border:none;background:var(--green);color:#fff;padding:0 14px;cursor:pointer;font-family:inherit;font-weight:700;margin:6px 8px;border-radius:4px}
  .box button:disabled{background:#ccc}
  @media(max-width:700px){.cal .d{min-height:40px;padding:3px 4px}.cal .d i{display:inline-block;margin-right:4px}.cal .d i span{display:none}.cal .d i b{font-weight:700}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}.chips::-webkit-scrollbar{display:none}.chips button{flex-shrink:0}.topbar .demo-tag{display:none}.topbar .search{width:calc(100% - 24px)}.side{display:none}.topbar .nav{display:none}.msg{padding:6px 12px}.compose{padding:0 12px 10px}}

.tblw th{white-space:nowrap}

const el=h=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const scroll=()=>{log.scrollTop=log.scrollHeight};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function day(t){log.appendChild(el(`<div class="day"><span>${t}</span></div>`))}
function userMsg(t){const m=el(`<div class="msg user"><div class="av me"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5z"/></svg></div><div class="b"><div class="name">나 <span class="you">체험 중</span> <span class="t">${now()}</span></div><div class="txt"></div></div></div>`);m.querySelector('.txt').textContent=t;log.appendChild(m);scroll();return m}
function botMsg(html,time){const m=el(`<div class="msg bot"><div class="av"></div><div class="b"><div class="name">Moketer <span class="badge">앱</span><span class="t">${time||now()}</span></div><div class="txt">${html}</div></div></div>`);log.appendChild(m);scroll();return m}
function typing(){const m=el(`<div class="msg bot"><div class="av"></div><div class="b"><div class="typing"><i></i><i></i><i></i></div></div></div>`);log.appendChild(m);scroll();return m}
function tbl(head,rows){return `<div class="tblw"><table class="bk"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>{const s=String(c);const cls=/^[\d,.%+\-]+(명|개|원)?$/.test(s)?'n':(s==='열기'?'l':'');return `<td class="${cls}">${s}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function react(m,list){m.querySelector('.b').appendChild(el(`<div class="react">${list.map(r=>`<span>${r}</span>`).join('')}</div>`))}

 ['1','[10월드로우] 응모권 보유 미사용 리마인드','2026-10-21','앱푸시','발송예정','열기'],
 ['2','세차 탐색자 리마인드','2026-10-23','앱푸시','발송예정','열기'],
 ['3','[10월드로우] 미참여 리마인드','2026-10-24','앱푸시','발송예정','열기'],
 ['4','[10월드로우] 10월 미접속 회원 회수','2026-10-26','앱푸시','발송예정','열기'],
 ['5','[10월드로우] 마감 D-0 전체','2026-10-31','앱푸시','발송예정','열기'],
 ['6','주차 구매 직후, 1km 안 세차장을 인앱으로 잇는다','2026-10-21','인앱','발송예정','열기']]);
const ANALYSIS=()=>`<p><b>[CRM 분석 현황 보고]</b></p><p>10월 20일(화) 기준 · 오늘 9건 분석했습니다. 11건은 내일 이어서 봅니다.</p><p>정규화 캠페인 4건은 스레드에 있습니다.</p>
<p class="warn">⚠️ 드로우 참여 기록(2026-10-19)이 4분 안에 안 생겨 응모·미션 집계 없이 분석했습니다. 드로우 캠페인 최종 확정은 보류하고 내일 다시 봅니다.</p>`+tbl(['번호','캠페인명','라이브일','상태','분석결과'],[
 ['1','[10월드로우] 동의 이탈 회수','2026-10-19','분석 진행중','열기'],
 ['2','[10월드로우] 세션 후 미참여 회수','2026-10-19','분석 진행중','열기'],

 ['5','서울숲 주차 인앱','2026-05-14','분석 진행중','열기']]);
const PERF=()=>`<p><b>지난주(W42) 발송·종료 캠페인 3건</b>의 순증입니다. 순증은 실험군 인원 × (실험군 비율 − 대조군 비율)로 계산했고, 앱푸시는 발송 후 3시간, 인앱은 24시간 기준입니다.</p>`+tbl(['캠페인','채널','실험군','세션 증분','주차핀 클릭','구매'],[
 ['세차 탐색자 리마인드','앱푸시','12.4만','+1,820','+364','+52'],
 ['[10월드로우] 미참여 리마인드','앱푸시','48.7만','+5,410','+1,090','+138'],
 ['주차 구매 직후 세차장 인앱','인앱','1.6만','+930','+412','+97']])+`<p>세 건 모두 세션 증분이 95% 신뢰수준에서 유의합니다. 구매 증분은 인앱이 발송 규모 대비 가장 큽니다.</p><p class="src">출처: CRM 캠페인 저장소 analysis 탭 · 대조군은 사일런트 웹훅 배정</p>`;
const COUPON=q=>`<p>쿠폰현황 <b>세차</b> 검색 결과 3건입니다. 운영 중인 쿠폰만 보여드립니다.</p>`+tbl(['쿠폰명','운영기간','발행','등록','등록률','사용','사용률'],[
 ['세차 첫 이용 3,000원','10/01~10/31','8,000','1,940','24.3%','612','7.7%'],
 ['세차 앱접속 50% 쿠폰','10/13~10/26','20,000','5,260','26.3%','1,384','6.9%'],
 ['주말 세차 2,000원','10/18~10/19','5,000','1,215','24.3%','438','8.8%']])+`<p class="src">쿠폰현황은 LLM을 거치지 않고 데이터베이스 조회 결과를 그대로 조립합니다 · 기준 10/23 06:00</p>`;
const REQUEST=()=>`<p><b>[CRM 요청 인입]</b> <span class="mention">@지우</span> <span class="mention">@하린</span></p><ul><li>접수: 10/12(월) 16:29</li><li>유형: 앱푸시</li><li>요청자: 세차TF 하린</li><li>캠페인명: 세차 전국최저가 안내</li><li>발송 희망일: 2026-10-15 오후 14-18시 <b>(D-3)</b></li></ul><p>📄 <a href="javascript:void(0)">요청 상세 보기</a></p>`;
const ISSUE=()=>`<p><b>[CRM 이슈 알림]</b></p><p>11:20 새로 확인된 수정사항 1건입니다. 남은 수정사항은 모두 1건입니다.</p><p>지우님 수정사항 1개 조치 부탁드립니다.</p>`+tbl(['번호','구분','대상','문제','할 일','바로가기'],[
 ['1','권장 · 카드','🆕 [10월드로우] 오픈 안내','대시보드 카드와 세팅 가이드에 적힌 Braze 캔버스 ID가 서로 다릅니다','카드를 열어 값이 갈린 항목에서 실제 발송과 맞는 쪽을 골라 주세요','열기']]);
const BANNER=()=>`<p><b>[배너] 하단·메인 1순위 구좌 충돌 확인 요청</b> <span class="mention">@지우</span></p><p>10/15~10/31 하단배너와 메인 홈 팝업 1순위에 배너 두 개가 겹칩니다.</p><p>드로우 프로모션 2차가 1순위로 계획되어 있지만, 어드민 배너가 10/31까지 1순위로 남아 있습니다.</p><p>10/15 전까지 1순위를 쓸 배너를 정해 주세요. 배경은 스레드에 남깁니다.</p>`+tbl(['지면','어드민 1순위','계획 1순위'],[['하단배너','토스페이 무이자 할부 프로모션 #838','드로우 프로모션 2차'],['메인 홈 팝업','토스페이 결제 론칭 프로모션 #1123','드로우 프로모션 2차']]);
const PLAN=()=>`<p><b>[기획안 검토 요청]</b> 세차 탐색자 리마인드 · 앱푸시 · 10/23(금) 15:00</p>`+tbl(['항목','내용'],[['목적','최근 14일 세차장 탐색 후 미구매 유저의 첫 세차 구매 전환'],['타겟','세차 탭 진입 2회 이상 · 결제 0회 · 푸시 수신동의 (예상 모수 약 9.2만)'],['혜택','세차 첫 이용 3,000원 쿠폰 자동 지급'],['측정','대조군 10% 사일런트 배정 · 24시간 구매 전환 Z-test']])+`<p>기획서와 세팅 가이드를 저장소에 올렸습니다. 승인하면 Braze 세팅 가이드가 담당자에게 전달됩니다.</p><div class="btns"><button class="primary" data-act="ok">승인</button><button data-act="edit">수정 요청</button><button class="danger" data-act="no">반려</button></div>`;
const MAIL=()=>`<p><b>📫 [제휴사] 주차 금액권 제휴 문의</b></p><div class="mail"><p>신규 카드상품에 탑재할 앱 연동 주차 금액권 제휴 제안: 제안가·유효기간·정산 조건 회신 요청</p><div class="st">⏳ 응답 대기 · 2026-10-23 14:03 수신</div></div><div class="rx"><button data-rx="done">✅</button><button data-rx="drop">🗑️</button><span class="hint">반응을 눌러 보세요</span></div>`;
const OOS=()=>`<p>이 질문은 마케팅 범위 밖이라 답하지 않습니다. 영업전략 · 재무 · 인사 관련 질문은 담당 채널로 문의해 주세요.</p>`;
const HELP=()=>`<p>이렇게 물어보실 수 있어요.</p><ul><li>지난주 캠페인 성과 알려줘</li><li>분석 현황 보고</li><li>쿠폰현황 세차</li><li>세차 탐색자 리마인드 기획안 보여줘</li></ul>`;

function route(q){const s=q.toLowerCase();
  if(/일정|라이브|오늘/.test(s))return LIVE;
  if(/분석 현황|분석 보고|진행/.test(s))return ANALYSIS;
  if(/쿠폰/.test(s))return COUPON;
  if(/기획안|기획서|승인/.test(s))return PLAN;
  if(/성과|실적|순증|지난주|주간/.test(s))return PERF;
  if(/요청/.test(s))return REQUEST;
  if(/이슈|불일치/.test(s))return ISSUE;
  if(/배너|구좌/.test(s))return BANNER;
  if(/메일|광고 문의|제휴 문의/.test(s))return MAIL;
  if(/영업|재무|연봉|인사|주가/.test(s))return OOS;
  return HELP}
async function ask(q){if(!q.trim())return;send.disabled=true;inp.value='';
  userMsg(q);await wait(400);
  const t=typing();await wait(900+Math.random()*600);t.remove();
  const m=botMsg(route(q)(q));
  m.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;m.querySelector('.btns').remove();
    if(a==='ok')botMsg(`✅ <b>세차 탐색자 리마인드</b> 기획안을 승인했습니다. 세팅 가이드를 담당자 DM으로 보냈고, 발송 당일 08:10 라이브 일정 안내에 포함됩니다.`);
    else if(a==='edit')botMsg(`어느 부분을 고칠까요? 예: "타겟에서 최근 7일 결제자 제외", "발송 시각 12시로 변경"`);
    else botMsg(`기획안을 반려했습니다. 사유를 남기면 다음 추천에 반영합니다.`)}));
  bindMail(m);send.disabled=false;inp.focus()}
function bindMail(m){m.querySelectorAll('[data-rx]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.rx,box=m.querySelector('.mail'),st=m.querySelector('.st');m.querySelectorAll('[data-rx]').forEach(x=>x.classList.toggle('on',x===b));box.classList.remove('done','drop');box.classList.add(k);const t=new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});st.innerHTML=(k==='done'?'✅ 응답완료 · 나 · ':'🗑️ 드랍 · 나 · ')+t+' · 2026-10-23 14:03 수신';const h=m.querySelector('.hint');if(h)h.remove()}))}
// 분석가 업무 예시를 앞에 강조하고, 첫 화면에 이미 나온 알림 예시는 뒤로 둔다
[['지난주 캠페인 성과 알려줘',1],['분석 현황 보고',1],['쿠폰현황 세차',1],['배너 구좌 충돌 있어?',0],['세차 탐색자 리마인드 기획안 보여줘',0],['오늘 라이브 일정',0],['광고 제휴 문의 메일',0]].forEach(([q,hi])=>{const b=document.createElement('button');b.textContent=q;if(hi){b.className='hi';b.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 12 12"><path d="M6 0l1.4 4.6L12 6 7.4 7.4 6 12 4.6 7.4 0 6l4.6-1.4z" fill="url(#mkSpark)"/></svg>')}b.onclick=()=>ask(q);chips.appendChild(b)});
send.addEventListener('click',()=>ask(inp.value));
inp.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter'){e.preventDefault();ask(inp.value)}});

day('어제');
botMsg(REQUEST(),'오후 4:29');
day('오늘');
botMsg(LIVE(),'오전 8:10');

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&window.parent!==window)window.parent.postMessage('close-demo','*')});
