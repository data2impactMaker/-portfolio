  html,body{overflow-x:hidden}
  td{white-space:nowrap}
  .demo-ribbon{position:fixed;right:14px;bottom:14px;z-index:50;font-size:11px;font-weight:600;color:#71717a;background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 12px;box-shadow:var(--shadow)}

  .svgchart{width:100%;height:240px;display:block}

function derive(r){const o=Object.assign({},r);o.ctr=o.imp?o.clk/o.imp*100:null;o.cpi=o.install?o.cost/o.install:null;o.cpaSignup=o.signup?o.cost/o.signup:null;o.cpaPurchase=o.purchase?o.cost/o.purchase:null;o.roas=o.cost?o.revenue/o.cost*100:null;o.roasNet=o.cost?o.revenue*0.2/o.cost*100:null;return o}
function delta(cur,prev,opt){opt=opt||{};if(cur==null||prev==null||!prev)return '<span style="font-size:11px;color:#a1a1aa">직전 기간 없음</span>';const diff=opt.pp?(cur-prev):((cur-prev)/prev*100);const up=diff>0;const good=opt.invert?!up:up;const txt=(up?'+':'')+(opt.pp?diff.toFixed(1)+'%p':diff.toFixed(1)+'%');return `<span style="font-size:11px;font-weight:600;color:${good?'#059669':'#dc2626'}">${txt} <span style="color:#a1a1aa;font-weight:500">vs 직전</span></span>`}
function heatTable(host,cols,rows,heat){const maxs={};heat.forEach(k=>maxs[k]=Math.max(...rows.map(r=>+r[k]||0)));host.innerHTML=`<div class="tl-table-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.type==='text'?'':'num'}">${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>{const v=r[c.key];const isH=heat.includes(c.key)&&maxs[c.key];const txt=c.type==='num'?fmtN(v):v;return `<td class="${c.type==='text'?'':'num'} ${isH?'heat':''}">${isH?`<i style="width:${(v/maxs[c.key]*100).toFixed(0)}%"></i><b>${txt}</b>`:txt}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderPmView(){const d=PM;const s=derive(d.summary),p=derive(d.summaryPrev);const root=$('view-pm');
  root.innerHTML=`<div class="bn-topbar"><span class="vx-chip gray">기간 ${d.from} - ${d.to} · 14일</span><span style="flex:1"></span><span class="vx-chip gray">🔒 열람 전용 (체험판)</span></div><div id="pm-body"></div>`;
  $('pm-body').innerHTML=`<div class="pm-kpis" id="pm-kpis"></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">전환 퍼널</div><div class="vx-sub">${d.from} - ${d.to} · 과금 채널 합계 · 에어브릿지 터치포인트 귀속 기준</div></div></div><div class="pm-fu-layout"><div class="pm-fu" id="pm-funnel"></div><div class="pm-fu-rail" id="pm-funnel-rail"></div></div></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">일별 추이</div><div class="vx-sub">비용(막대, 좌축) · 설치·가입·결제(선, 우축)</div></div></div><div class="tl-chart" id="pm-daily" style="min-height:250px"></div></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">광고 성격별 성과</div><div class="vx-sub">검색광고(SA) · 디스플레이(DA) · 브랜드검색(BSA)</div></div></div><div id="pm-types"></div></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">채널별 성과</div><div class="vx-sub">행을 클릭하면 캠페인 → 소재·키워드로 드릴다운</div></div></div><div id="pm-channels"></div><div id="pm-drill" style="margin-top:14px"></div></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">캠페인·광고그룹 상세 성과</div><div class="vx-sub">에어브릿지 Actuals 기준 캠페인·채널·광고그룹 단위 (원문 코드명은 명명 규칙으로 한글 변환)</div></div></div><div id="pm-creatives"></div></div>
  <div class="vx-card"><div class="vx-card-head"><div><div class="vx-title">무과금·기타 채널 참고</div><div class="vx-sub">자사·제휴·바이럴·미귀속 · 설치 기준 상위</div></div><div class="vx-actions"><button class="vx-btn sm" id="pm-org-toggle">펼치기</button></div></div><div id="pm-organic" style="display:none"></div></div>`;
  const kpis=[{k:'ROAS (거래액)',v:fmtP(s.roas,0),d:delta(s.roas,p.roas,{pp:true}),sub:'순매출 기준 '+fmtP(s.roasNet,0),hero:true},{k:'광고비',v:fmtWM(s.cost),d:delta(s.cost,p.cost,{invert:true})},{k:'클릭',v:fmtN(s.clk),d:delta(s.clk,p.clk)},{k:'설치',v:fmtN(s.install),d:delta(s.install,p.install),sub:'CPI '+fmtW(s.cpi)},{k:'가입',v:fmtN(s.signup),d:delta(s.signup,p.signup),sub:'가입 CPA '+fmtW(s.cpaSignup)},{k:'결제',v:fmtN(s.purchase),d:delta(s.purchase,p.purchase),sub:'결제 CPA '+fmtW(s.cpaPurchase)},{k:'구매액',v:fmtWM(s.revenue),d:delta(s.revenue,p.revenue)}];
  $('pm-kpis').innerHTML=kpis.map(x=>`<div class="pm-kpi${x.hero?' hero':''}"><div class="k">${x.k}</div><div class="v">${x.v}</div><div>${x.d}</div>${x.sub?`<div class="sub2">${x.sub}</div>`:''}</div>`).join('');
  const stages=[{l:'노출',v:s.imp},{l:'클릭',v:s.clk,r:s.clk/s.imp*100,rl:'CTR'},{l:'설치',v:s.install,r:s.install/s.clk*100,rl:'클릭 → 설치'},{l:'가입',v:s.signup,r:s.signup/s.install*100,rl:'설치 → 가입'},{l:'결제',v:s.purchase,r:s.purchase/s.signup*100,rl:'가입 → 결제'}];const widths=[100,78,58,42,30],shades=['#3D638F','#4E79A7','#6C8FB7','#8BA6C7','#AABDD7'];
  $('pm-funnel').innerHTML=stages.map((x,i)=>`<div class="pm-fu-row"><div class="pm-fu-meta"><span class="fl">${x.l}</span><span class="fv">${fmtN(x.v)}</span></div><div class="pm-fu-barzone"><div class="pm-fu-bar" style="width:${widths[i]}%;background:${shades[i]};transition-delay:${i*110}ms"></div></div><div class="pm-fu-cvr">${x.r!=null?`<span class="cv">${fmtP(x.r,x.r<10?1:0)}</span><span class="cl">${x.rl}</span>`:''}</div></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('pm-funnel').classList.add('in')));
  $('pm-funnel-rail').innerHTML=`<div class="pm-fu-stat"><span class="k">투입 광고비</span><span class="v">${fmtW(s.cost)}</span></div><div class="pm-fu-stat"><span class="k">귀속 구매액</span><span class="v">${fmtW(s.revenue)}</span></div><div class="pm-fu-stat hero"><span class="k">ROAS (거래액)</span><span class="v">${fmtP(s.roas,0)}</span><span class="s">순매출 기준 ${fmtP(s.roasNet,0)}</span></div>`;
  (()=>{const W=900,H=240,pl=56,pr=48,pt=14,pb=26;const rows=d.daily;const maxC=Math.max(...rows.map(r=>r.cost))*1.1,maxV=Math.max(...rows.map(r=>r.install))*1.1;const bw=(W-pl-pr)/rows.length;const x=i=>pl+i*bw+bw/2;const yC=v=>H-pb-(v/maxC)*(H-pb-pt),yV=v=>H-pb-(v/maxV)*(H-pb-pt);const bars=rows.map((r,i)=>`<rect x="${pl+i*bw+3}" y="${yC(r.cost)}" width="${bw-6}" height="${H-pb-yC(r.cost)}" fill="#4E79A7" opacity=".25"><title>${r.date} 비용 ${fmtN(r.cost)}원</title></rect>`).join('');const line=(key,col,lab)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${rows.map((r,i)=>`${x(i)},${yV(r[key])}`).join(' ')}"/>`+rows.map((r,i)=>`<circle cx="${x(i)}" cy="${yV(r[key])}" r="3" fill="${col}"><title>${r.date} ${lab} ${fmtN(r[key])}</title></circle>`).join('');const grid=[0,.5,1].map(t=>{const y=H-pb-t*(H-pb-pt);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${pl-6}" y="${y+4}" font-size="10" fill="#71717a" text-anchor="end">${fmtWM(maxC*t)}</text><text x="${W-pr+6}" y="${y+4}" font-size="10" fill="#71717a">${fmtN(Math.round(maxV*t))}</text>`}).join('');const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#71717a" text-anchor="middle">${r.date.slice(5).replace('-','/')}</text>`).join('');const legend=`<g font-size="11" fill="#52525b"><rect x="${pl}" y="0" width="10" height="10" fill="#4E79A7" opacity=".25"/><text x="${pl+14}" y="9">비용</text><circle cx="${pl+60}" cy="5" r="4" fill="#F28E2B"/><text x="${pl+68}" y="9">설치</text><circle cx="${pl+110}" cy="5" r="4" fill="#59A14F"/><text x="${pl+118}" y="9">가입</text><circle cx="${pl+160}" cy="5" r="4" fill="#E15759"/><text x="${pl+168}" y="9">결제</text></g>`;$('pm-daily').innerHTML=`<svg class="svgchart" style="height:250px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}${line('install','#F28E2B','설치')}${line('signup','#59A14F','가입')}${line('purchase','#E15759','결제')}${labels}${legend}</svg>`})();
  const tcols=[{key:'성격',label:'광고 성격',type:'text'},{key:'cost',label:'비용',type:'num'},{key:'imp',label:'노출',type:'num'},{key:'clk',label:'클릭',type:'num'},{key:'CTR',label:'CTR',type:'rtx'},{key:'install',label:'설치',type:'num'},{key:'CPI',label:'CPI',type:'rtx'},{key:'signup',label:'가입',type:'num'},{key:'가입CPA',label:'가입 CPA',type:'rtx'},{key:'purchase',label:'결제',type:'num'},{key:'결제CPA',label:'결제 CPA',type:'rtx'},{key:'revenue',label:'구매액',type:'num'},{key:'ROAS',label:'ROAS',type:'rtx'}];
  const trow=t=>{const o=derive(t);return Object.assign(o,{'성격':`${t.typeLabel} (${t.type})`,CTR:fmtP(o.ctr,2),CPI:fmtW(o.cpi),'가입CPA':fmtW(o.cpaSignup),'결제CPA':fmtW(o.cpaPurchase),ROAS:fmtP(o.roas,0)})};
  heatTable($('pm-types'),tcols,d.types.map(trow),['cost','install','revenue']);
  const ccols=[{key:'채널',label:'채널',type:'text'},{key:'성격',label:'성격',type:'text'},{key:'cost',label:'비용',type:'num'},{key:'clk',label:'클릭',type:'num'},{key:'install',label:'설치',type:'num'},{key:'CPI',label:'CPI',type:'rtx'},{key:'signup',label:'가입',type:'num'},{key:'purchase',label:'결제',type:'num'},{key:'revenue',label:'구매액',type:'num'},{key:'ROAS',label:'ROAS',type:'rtx'}];
  const crows=d.channels.map(c=>{const o=derive(c);return Object.assign(o,{'채널':c.label,'성격':c.typeLabel,CPI:fmtW(o.cpi),ROAS:fmtP(o.roas,0)})});
  heatTable($('pm-channels'),ccols,crows,['cost','install']);
  $('pm-channels').querySelectorAll('tbody tr').forEach((tr,i)=>{tr.classList.add('clickable');tr.onclick=()=>{const ch=d.channels[i];const rows=(d.drill[ch.channel]||[]).map(r=>{const o=derive(Object.assign({imp:0,clk:0,signup:0},r));return Object.assign(o,{'캠페인':r.campaign,CPI:fmtW(o.cpi),ROAS:fmtP(o.roas,0)})});$('pm-drill').innerHTML=`<div class="vx-sub" style="margin-bottom:8px">${ch.label} › 캠페인 단위 <button class="vx-btn sm" onclick="document.getElementById('pm-drill').innerHTML=''" style="margin-left:8px">닫기</button></div>`;const host=document.createElement('div');$('pm-drill').appendChild(host);heatTable(host,[{key:'캠페인',label:'캠페인',type:'text'},{key:'cost',label:'비용',type:'num'},{key:'install',label:'설치',type:'num'},{key:'CPI',label:'CPI',type:'rtx'},{key:'purchase',label:'결제',type:'num'},{key:'revenue',label:'구매액',type:'num'},{key:'ROAS',label:'ROAS',type:'rtx'}],rows,['cost','install'])}});
  const crcols=[{key:'캠페인',label:'캠페인',type:'text'},{key:'채널',label:'채널',type:'text'},{key:'광고그룹',label:'광고그룹',type:'text'},{key:'cost',label:'비용',type:'num'},{key:'imp',label:'노출',type:'num'},{key:'clk',label:'클릭',type:'num'},{key:'CTR',label:'CTR',type:'rtx'},{key:'install',label:'설치',type:'num'},{key:'CPI',label:'CPI',type:'rtx'},{key:'signup',label:'가입',type:'num'},{key:'purchase',label:'결제',type:'num'},{key:'revenue',label:'구매액',type:'num'},{key:'ROAS',label:'ROAS',type:'rtx'}];
  heatTable($('pm-creatives'),crcols,d.creatives.map(r=>{const o=derive(r);return Object.assign(o,{'캠페인':r.campaign,'채널':r.channel,'광고그룹':r.adGroup,CTR:fmtP(o.ctr,2),CPI:fmtW(o.cpi),ROAS:fmtP(o.roas,0)})}),['cost','install']);
  $('pm-org-toggle').onclick=function(){const el=$('pm-organic');const open=el.style.display!=='none';el.style.display=open?'none':'';this.textContent=open?'펼치기':'접기';if(!open&&!el.innerHTML)heatTable(el,[{key:'채널',label:'채널',type:'text'},{key:'install',label:'설치',type:'num'},{key:'signup',label:'가입',type:'num'},{key:'purchase',label:'결제',type:'num'},{key:'revenue',label:'구매액',type:'num'}],d.organic.map(o=>Object.assign({'채널':o.label},o)),['install'])};
}

// ═══════════ 뷰 전환·초기화 ═══════════
const VIEW_TITLES={crm:'CRM 캠페인 대시보드',banner:'앱 배너 운영',pm:'퍼포먼스 마케팅 성과',msgreq:'CRM 요청'};
const VIEW_SUBS={banner:'구좌 배정 · 정책 검증 · 클릭 성과',pm:'채널 · 소재 퍼널 · ROAS',msgreq:'푸시·인앱 요청 접수 · 요청 관리'};
const loaded={};
function switchTopView(v){document.querySelectorAll('.side-nav-tile').forEach(b=>b.classList.toggle('active',b.dataset.vt===v));['crm','banner','pm','msgreq'].forEach(k=>{$('view-'+k).style.display=(k===v)?'':'none'});$('view-title').textContent=VIEW_TITLES[v];const tl=$('today-label');if(VIEW_SUBS[v]){if(tl.dataset.orig==null)tl.dataset.orig=tl.textContent;tl.textContent=VIEW_SUBS[v]}else if(tl.dataset.orig!=null){tl.textContent=tl.dataset.orig;delete tl.dataset.orig}
  if(v==='banner'&&!loaded.banner){loaded.banner=true;renderBannerView()}if(v==='pm'&&!loaded.pm){loaded.pm=true;renderPmView()}if(v==='msgreq'&&!loaded.msgreq){loaded.msgreq=true;$('view-msgreq').innerHTML='<div class="vx-locked"><div class="lk-ic">📨</div><div class="lk-t">CRM 요청 접수 화면</div><div class="lk-s">현업 부서가 푸시·인앱 요청을 접수하고 진행 상태를 확인하는 화면입니다. 체험판에서는 폼을 제공하지 않습니다.</div></div>'}
  document.querySelector('.sidebar').classList.remove('open')}
document.querySelectorAll('.side-nav-tile').forEach(b=>b.addEventListener('click',()=>switchTopView(b.dataset.vt)));
document.querySelectorAll('.cal-toggle-btn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
$('cal-prev').addEventListener('click',()=>{if(viewMode==='week')calAnchor.setDate(calAnchor.getDate()-7);else calAnchor.setMonth(calAnchor.getMonth()-1);renderCalendar()});
$('cal-next').addEventListener('click',()=>{if(viewMode==='week')calAnchor.setDate(calAnchor.getDate()+7);else calAnchor.setMonth(calAnchor.getMonth()+1);renderCalendar()});
$('cal-today').addEventListener('click',()=>{calAnchor=new Date(TODAY);renderCalendar()});
$('search-input-cal').addEventListener('input',e=>{currentSearch=e.target.value;renderCalendar()});
$('sidebar-collapse').addEventListener('click',()=>document.body.classList.add('sidebar-collapsed'));
$('sidebar-expand').addEventListener('click',()=>document.body.classList.remove('sidebar-collapsed'));
$('search-input').addEventListener('input',e=>{currentSearch=e.target.value;$('search-clear').classList.toggle('visible',currentSearch.length>0);renderWeekGrid()});
$('search-clear').addEventListener('click',()=>{$('search-input').value='';currentSearch='';$('search-clear').classList.remove('visible');renderWeekGrid()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal-overlay').classList.contains('open')){closeModal();return}const m=$('wr-reason-modal');if(m&&m.style.display==='flex'){m.style.display='none';return}if(window.parent!==window)window.parent.postMessage('close-demo','*')}});
renderTodayLabel();renderHeroCard();renderKpi2x2();renderCategoryBoard();renderYearFilter();renderMediumFilter();renderWeekGrid();renderSidebar();initReco();
if(['banner','pm','msgreq'].includes(location.hash.slice(1)))switchTopView(location.hash.slice(1));
</script>
