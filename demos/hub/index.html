    : `<tr><td>${e(x.label)} <span class="bz">${x.id}</span></td><td class="cnt">${num(x.reg)}</td><td class="cnt">${num(x.use)}</td><td class="rtc">${r(x.use, x.reg)}</td></tr>`).join('');
  const head = held ? '<th>쿠폰</th><th class="cnt">사용</th>'
    : '<th>쿠폰</th><th class="cnt">발급</th><th class="cnt">사용</th><th class="rtc">사용률</th>';
  const by = rows ? `<div style="margin-top:8px;font-size:13px;font-weight:700;color:#374151">${e(g.group_label || '자치구별')}</div><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>` : '';
  // 화면에는 한 줄 기준만. 산출 근거(원장·필드·시각 보정)는 결과 파일 basis_detail 에만 둔다 —
  // 이 구분이 없던 예전 결과 파일의 긴 basis 는 그리지 않는다
  const basisNote = (g.basis && g.basis_detail) ? `<div class="subnote">${e(g.basis)}</div>` : '';
  const srcNote = (j._meta && j._meta.sources) ? '' : '<div class="subnote">출처: 자사 쿠폰·결제 DB</div>';
  return `<h4>${n}. 목표 행동 전환 (${held ? '보유 쿠폰 사용' : '쿠폰 발급·사용'})</h4>${fn}${ppNote}${by}${basisNote}${srcNote}`;
}

// 외부 워크스페이스(쏘카 Braze 등) 집행분 — 발송·노출은 못 보고 유입 이후만 본다.
function renderExternalPanel(c, conv){
  const m = conv._meta || {};
  const rows = (conv.channels || []).map(function(x){
    return `<tr><td>${esc(x.name)}</td><td>${(x.installs||0).toLocaleString()}</td>` +
      `<td>${(x.signups||0).toLocaleString()}</td><td>${(x.purchases||0).toLocaleString()}</td>` +
      `<td>${(x.revenue||0).toLocaleString()}원</td></tr>`;
  }).join('');
  const t = conv.total || {};
  const totalRow = `<tr><td><b>합계</b></td><td><b>${(t.installs||0).toLocaleString()}</b></td>` +
    `<td><b>${(t.signups||0).toLocaleString()}</b></td><td><b>${(t.purchases||0).toLocaleString()}</b></td>` +
    `<td><b>${(t.revenue||0).toLocaleString()}원</b></td></tr>`;
  const notes = (conv.notes || []).map(function(n){ return `<li>${esc(n)}</li>`; }).join('');
  return `
    <h4>1. 전환 성과</h4>
    <div class="ext-note"><b>우리 브레이즈가 아니라 볼 수 없습니다</b>
      <span>${esc(m.unavailable || '발송·노출 데이터가 우리 쪽에 없습니다.')}</span>
      ${m.externalWorkspace ? `<span>세팅 위치: ${esc(m.externalWorkspace)}</span>` : ''}</div>
    <h4>2. 유입 이후 성과${m.window ? ` <span class="h4cap">${esc(m.window)}</span>` : ''}</h4>
    <div class="tablewrap"><table>
      <thead><tr><th>채널</th><th>설치</th><th>가입</th><th>구매</th><th>매출</th></tr></thead>
      <tbody>${rows}${totalRow}</tbody>
    </table></div>
    ${notes ? `<h4>3. 읽는 법</h4><ul class="ext-notes">${notes}</ul>` : ''}
    ${m.source ? `<div class="subnote">출처: ${esc(m.source)}</div>` : ''}`;
}
async function loadConversion(c, path, slotId) {
  const slot = document.getElementById(slotId);
  if (!slot) return;
  // 경로 세그먼트별 인코딩 (한글·괄호 등 안전 처리)
  const encoded = path.split('/').map(encodeURIComponent).join('/');
  try {
    if (false) {
      throw new Error('file:// 로컬 열기 — Cloud Run URL로 접속해야 분석 데이터 로드 가능');
    }
    // 전환(conversion.json) + 발송 메트릭(dispatch.json) 동시 로드
    const [convRes, dispRes] = await Promise.all([
      fetch(`/data/${encoded}/analysis/conversion.json`, {cache: 'no-store'}),
      fetch(`/data/${encoded}/analysis/dispatch.json`, {cache: 'no-store'})
    ]);
    const dispatch = dispRes.ok ? await dispRes.json() : null;
    if (convRes.ok) {
      const conv = await convRes.json();
      // 우리 브레이즈가 아닌 곳에서 집행된 캠페인은 발송·노출이 없다.
      // 빈 퍼널을 0건·100%로 그리면 성과가 없었던 것처럼 읽히므로 따로 그린다.
      if (conv.channels && conv.channels.length) {
        slot.innerHTML = analysisHeader(c, conv) + renderExternalPanel(c, conv);
        return;
      }
      const isInapp = (conv._meta && conv._meta.medium === 'inapp') || (c.medium && c.medium.indexOf('인앱') >= 0);
      slot.innerHTML = analysisHeader(c, conv) + (isInapp ? renderInappPanel(c, conv) : renderConversionPanel(c, conv, dispatch));
      return;
    }
    if (dispatch) { slot.innerHTML = analysisHeader(c, null) + renderDispatchPanel(c, dispatch); return; }
    throw new Error(`HTTP ${convRes.status} — 분석 데이터 없음`);
  } catch (e) {
    slot.innerHTML = c.hasAnalysis
      ? `<div class="placeholder">분석 데이터를 불러오지 못했습니다.<br><small>${e.message}</small></div>${renderCampaignSnippet(c)}`
      : analysisPendingMsg(c);
  }
}

/* ──────────────────────────────────────────
   renderConversionPanelV2  (schema_version 2.0)
   발송 메트릭 (OS별) → 전환 퍼널 차트 → 실험군/대조군 비교표 → 리포트 링크
   ────────────────────────────────────────── */
function renderConversionPanelV2(c, j) {
  const send = j.send || {};
  const audience = j.audience || {};
  const funnel = j.funnel || [];
  const path = CONVERSION_PATHS[c.id] || c.gcsPath || '';

  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const pct = v => (v == null) ? '—' : (v * 100).toFixed(1) + '%';
  const ppHtml = v => {
    if (v == null) return '—';
    const cls = v > 0.01 ? 'pp-pos' : v < -0.01 ? 'pp-neg' : 'pp-zero';
    return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%p</span>`;
  };

  /* §1 발송 메트릭 */
  let sendHtml = '<div class="placeholder">발송 데이터 없음</div>';
  if (send.total) {
    const t = send.total, ios = send.ios || {}, aos = send.android || {};
    const tot = t.sent || 1;
    const iosFrac = ios.sent ? ios.sent / tot : 0;
    const aosFrac = aos.sent ? aos.sent / tot : 0;
    sendHtml = `<div class="an-send-row">
      <div class="an-send-card">
        <div class="sc-num">${fmt(t.sent)}</div>
        <div class="sc-label">발송</div>
        <div class="sc-bar">
          <div class="sc-bar-ios" style="width:${(iosFrac*100).toFixed(1)}%"></div>
          <div class="sc-bar-aos" style="width:${(aosFrac*100).toFixed(1)}%"></div>
        </div>
        <div class="sc-os-row">
          <span class="os-ios">iOS ${fmt(ios.sent)} (${(iosFrac*100).toFixed(0)}%)</span>
          <span class="os-aos">Android ${fmt(aos.sent)} (${(aosFrac*100).toFixed(0)}%)</span>
        </div>
      </div>
      <div class="an-send-arr">→</div>
      <div class="an-send-card">
        <div class="sc-num">${fmt(t.delivered)}</div>
        <div class="sc-label">도달</div>
        <div class="sc-sub">${pct(t.delivered_rate)}</div>
        ${(ios.delivered_rate != null) ? `<div class="sc-os-row"><span class="os-ios">iOS ${pct(ios.delivered_rate)}</span><span class="os-aos">Android ${pct(aos.delivered_rate)}</span></div>` : ''}
      </div>
      <div class="an-send-arr">→</div>
      <div class="an-send-card">
        <div class="sc-num">${fmt(t.clicks)}</div>
        <div class="sc-label">클릭</div>
        <div class="sc-sub">${pct(t.click_rate)}</div>
        ${(ios.click_rate != null) ? `<div class="sc-os-row"><span class="os-ios">iOS ${pct(ios.click_rate)}</span><span class="os-aos">Android ${pct(aos.click_rate)}</span></div>` : ''}
      </div>
    </div>`;
  }

  /* §2 전환 퍼널 차트 */
  let funnelHtml = '<div class="placeholder">전환 데이터 없음</div>';
  const tgEntry = audience.tg_entry || 0;
  if (funnel.length && tgEntry) {
    const entryRow = `<div class="fn-row">
      <div class="fn-label">${String(audience.entry_label || '진입자').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</div>
      <div class="fn-bar-wrap"><div class="fn-bar fn-bar-entry" style="width:100%"></div></div>
      <div class="fn-nums"><span class="fn-abs">${fmt(tgEntry)}</span><span class="fn-rel">(100%)</span></div>
    </div>`;
    const rows = funnel.map(f => {
      const w = tgEntry ? Math.min(((f.tg_count || 0) / tgEntry * 100), 100).toFixed(1) : 0;
      const sig = f.significant ? `<span class="fn-sig">★</span>` : '';
      return `<div class="fn-connector"></div>
      <div class="fn-row">
        <div class="fn-label">${f.label || f.event}${sig}</div>
        <div class="fn-bar-wrap"><div class="fn-bar fn-bar-tg" style="width:${w}%"></div></div>
        <div class="fn-nums"><span class="fn-abs">${fmt(f.tg_count)}</span><span class="fn-rel">(${pct(f.tg_rate)})</span></div>
      </div>`;
    }).join('');
    funnelHtml = `<div class="fn-chart">${entryRow}${rows}</div>`;
  }

  /* §3 실험군 vs 대조군 비교표 */
  let compHtml = '';
  const cgEntry = audience.cg_entry || 0;
  if (cgEntry > 0 && funnel.some(f => f.cg_count != null)) {
    const rows = funnel.map(f => {
      if (f.cg_count == null) return '';
      const ppDiff = f.pp_diff != null ? f.pp_diff
        : (f.tg_rate != null && f.cg_rate != null ? (f.tg_rate - f.cg_rate) * 100 : null);
      const sig = f.significant ? ' ★' : '';
      return `<tr>
        <td>${f.label || f.event}${sig}</td>
        <td>${fmt(f.tg_count)}<small>(${pct(f.tg_rate)})</small></td>
        <td>${fmt(f.cg_count)}<small>(${pct(f.cg_rate)})</small></td>
        <td>${ppHtml(ppDiff)}</td>
      </tr>`;
    }).join('');
    compHtml = `<h4>실험군 vs 대조군<span class="h4-sub">실험군 ${fmt(tgEntry)}명 / 대조군 ${fmt(cgEntry)}명</span></h4>
    <table class="an-comp-table">
      <thead><tr><th>단계</th><th>실험군 (비율)</th><th>대조군 (비율)</th><th>%p 차이</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  /* §4 리포트 링크 */
  let reportHtml = '';
  if (path && c.assets && c.assets.analysis_report) {
    const enc = (path + '/analysis/report.md').split('/').map(encodeURIComponent).join('/');
    reportHtml = `<p class="an-report-link"><a href="/doc/${enc}" target="_blank" rel="noopener">📄 상세 분석 리포트 보기 →</a></p>`;
  }

  return `
    <h4>발송 메트릭<span class="h4-sub">Direct Opens 기준 · OS별 구분</span></h4>
    ${sendHtml}
    <h4>전환 퍼널<span class="h4-sub">실험군 기준 / ★ p&lt;0.05 유의</span></h4>
    ${funnelHtml}
    ${compHtml}
    ${reportHtml}`;
}

function reportLinkSection(c, num) {
  if (c.assets && c.assets.analysis_report && campaignPath(c)) {
    const href = c.assets.analysis_report_html ? gcsHref(c, 'analysis/report.html') : docHref(c, 'analysis/report.md');
    return `<h4>${num}. 상세 분석</h4><p><a href="${href}" target="_blank" rel="noopener">📄 상세 분석 리포트 보기 →</a></p>`;
  }
  return `<h4>${num}. 상세 분석</h4><div class="placeholder">개별 분석 리포트 준비 중</div>`;
}

/* 발송 성과 표 (발송/도달/오픈 OS별) — 광고·전환 캠페인 공용. <h4> 제외, 표+주석만 */
function sendPerfTable(disp) {
  // 문자(LMS) — 웹훅 발송 + 링크 클릭(에어브릿지, 있을 때)
  if (disp && disp.medium === 'lms') {
    const t = (disp.dispatch && disp.dispatch.total) || {};
    if (t.recipients == null) return '';
    const fmtL = v => (v == null) ? '—' : Number(v).toLocaleString();
    const rateL = (n, base) => (n == null || !base) ? '' : ` <small style="color:#71717a">(${(n / base * 100).toFixed(2)}%)</small>`;
    const ctrlRow = (t.control != null) ? `<tr><td>대조군</td><td class="cnt">${fmtL(t.control)}</td></tr>` : '';
    let clickRows = '';
    if (t.link_clicks != null) {
      clickRows = `<tr><td>오픈</td><td class="cnt">${fmtL(t.link_clicks)}${rateL(t.link_clicks, t.recipients)}</td></tr>`;
      clickRows += (t.link_clicks_by || []).map(b =>
        `<tr><td class="sub"><span class="brc">└</span>${b.label}</td><td class="cnt">${fmtL(b.clicks)}${rateL(b.clicks, b.base)}</td></tr>`).join('');
    }
    const src = (t.link_clicks != null) ? '출처: 발송 = Braze · 오픈 = 에어브릿지' : '출처: 발송 = Braze';
    return `<table><thead><tr><th>구분</th><th class="cnt">유저수</th></tr></thead><tbody>` +
      `<tr><td>발송</td><td class="cnt">${fmtL(t.recipients)}</td></tr>` + clickRows + ctrlRow +
      `</tbody></table><div class="subnote">${src}</div>`;
  }
  const d = (disp && disp.dispatch) || {}, t = d.total || {};
  let ios = (d.by_platform && d.by_platform.ios) || {}, aos = (d.by_platform && d.by_platform.android) || {};
  // 2026-09-16~10-02 결과 파일은 OS 를 못 갈라 iOS·Android 오픈·바운스가 0 으로 적혔다. 전체 오픈이 있는데
  // OS별이 모두 0 이면 실제 0 이 아니라 집계가 안 된 것이라 '—'로 그린다(다시 분석하면 채워진다)
  if (t.direct_opens > 0 && !ios.direct_opens && !aos.direct_opens) {
    ios = {...ios, delivered: null, direct_opens: null};
    aos = {...aos, delivered: null, direct_opens: null};
  }
  // 고유 유저 필드 우선, 구 스키마(이벤트 건수) 폴백
  const gRec = g => (g.recipients != null) ? g.recipients : ((g.unique_recipients != null) ? g.unique_recipients : g.sent);
  const gDlv = g => (g.delivered != null) ? g.delivered : g.success;
  const gOpen = g => (g.direct_opens != null) ? g.direct_opens : g.opens;
  if (gRec(t) == null) return '';
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const bz = id => `<span class="bz">${esc(id)}</span>`;
  const rate = (n, base) => (n == null || !base) ? '—' : (n / base * 100).toFixed(1) + '%';
  const num = n => (n == null) ? '—' : fmt(n);
  // 반송·오픈 기록이 발송과 맞지 않는 OS 보정(2026-10-05). 반송 인원이 Braze 수신자보다 많으면 도달이 음수가 되고
  // (롯데면세점 9/20 iOS 도달 -2,991), 기기가 여러 대인 회원은 반송과 오픈에 함께 잡혀 오픈이 도달보다 많다
  // (정기권 대체 안내 iOS 도달 18·오픈 34 → 188.9%). 도달은 '—'로 두고 오픈율은 발송 대비로 그린다.
  let adjusted = false;
  const guard = g => {
    const rec = gRec(g), dlv = gDlv(g), op = gOpen(g);
    if (rec == null) return g;
    const o = {...g};
    if (dlv != null && dlv < 0) { o.delivered = null; o.success = null; adjusted = true; }
    const d2 = gDlv(o);
    o._openBase = (d2 == null || (op != null && op > d2)) ? rec : d2;
    if (d2 != null && op != null && op > d2) adjusted = true;
    return o;
  };
  ios = guard(ios); aos = guard(aos);
  const tt = guard(t);
  // 플랫폼별 [유저수][비율] 별도 열 (동일위계 폭 통일). 전부 고유 유저
  const cells = (get, base) => [ios, aos, tt].map(g => `<td class="cnt">${num(get(g))}</td><td class="rtc">${rate(get(g), base(g))}</td>`).join('');
  const row = (label, id, get, base) => `<tr><td>${label}${bz(id)}</td>${cells(get, base)}</tr>`;
  // 오픈 = 직접 탭한 고유 유저만 (간접/영향 오픈은 고유 유저 환산 불가 → 발송 성과에서 제외, 푸시 유도 앱 진입은 전환 성과의 세션 시작으로 확인)
  const rows = row('발송', 'unique_recipients', gRec, gRec) + row('도달', 'delivered', gDlv, gRec) + row('오픈', 'opens', gOpen, g => g._openBase);
  const note = `출처: Braze 발송·오픈 로그 (고유 유저 기준)` + (adjusted ? ' · 반송 기록이 발송과 맞지 않는 OS는 도달을 비우고 오픈율을 발송 대비로 표시' : '');
  const head = `<thead><tr><th rowspan="2">단계</th><th colspan="2">iOS</th><th colspan="2">Android</th><th colspan="2">전체</th></tr>` +
    `<tr><th class="cnt">유저수</th><th class="rtc">비율</th><th class="cnt">유저수</th><th class="rtc">비율</th><th class="cnt">유저수</th><th class="rtc">비율</th></tr></thead>`;
  return `<table>${head}<tbody>${rows}</tbody></table><div class="subnote">${note}</div>`;
}

/* 분기별 성과 (conversion.json branches[] — 세그먼트·발송 시각 분기 실험) */
function branchSection(c, j, n) {
  const brs = j.branches || [];
  if (!brs.length) return '';
  const KOR = { draw_consent:'수집 동의 완료', draw_mission:'미션 받기', draw_reward:'응모권 지급', draw_entry:'응모 완료', session_start:'세션 시작', map_zone_click:'주차핀 클릭', ticket_payment_click:'구매하기 버튼 클릭', order_complete:'구매 완료' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const pct2 = v => (v == null) ? '—' : (v * 100).toFixed(2) + '%';
  const events = (brs[0].funnel || []).map(f => f.event);
  const ppCell = f => {
    if (!f || f.tg_rate == null || f.cg_rate == null) return '<td><span class="pp-flat">—</span></td>';
    const dd = (f.tg_rate - f.cg_rate) * 100, s = dd > 0 ? '+' : '', txt = `${s}${dd.toFixed(2)}%p`;
    const tip = `실험군 ${fmt(f.tg_users)} (${pct2(f.tg_rate)}) · 대조군 ${fmt(f.cg_users)} (${pct2(f.cg_rate)})`;
    const cls = (f.significant_95 || f.significant) ? (dd > 0 ? 'pp-up' : 'pp-down') : 'pp-flat';
    return `<td title="${esc(tip)}"><span class="${cls}">${txt}</span></td>`;
  };
  const rows = brs.map(b => {
    const byEv = {}; (b.funnel || []).forEach(f => { byEv[f.event] = f; });
    return `<tr><td>${esc(b.label || b.key)}</td><td class="cnt">${fmt(b.tg_send)}</td><td class="cnt">${fmt(b.cg_send)}</td>` +
      events.map(ev => ppCell(byEv[ev])).join('') + `</tr>`;
  }).join('');
  const head = `<thead><tr><th rowspan="2">분기</th><th colspan="2">발송 유저수</th><th colspan="${events.length}">증분 %p (실험군 − 대조군)</th></tr>` +
    `<tr><th class="cnt">실험군</th><th class="cnt">대조군</th>` + events.map(ev => `<th>${KOR[ev] || ev}</th>`).join('') + `</tr></thead>`;
  const axis = (j._meta && j._meta.branch_axis) ? `<span class="h4cap">${esc(j._meta.branch_axis)}</span>` : '';
  return `<h4>${n}. 분기별 실험군 vs 대조군${axis}</h4><table>${head}<tbody>${rows}</tbody></table>` +
    `<div class="subnote">색상 = 통계적으로 유의한 차이만 (+ 빨강 / − 파랑) · 셀에 마우스를 올리면 유저수·비율 · 출처: 발송·세션 = Braze · 핀 클릭·구매 = 자사 결제 DB</div>`;
}

/* 드립 스텝별 성과 (conversion.json steps[] — 진입 후 1h→1d→3d 등 다단계) */
function dripSection(c, j, n) {
  const sts = j.steps || [];
  if (!sts.length) return '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const pct2 = v => (v == null) ? '—' : (v * 100).toFixed(2) + '%';
  const rows = sts.map(s => {
    let pp = '<span class="pp-flat">—</span>';
    if (s.tg_send && s.cg_send) {
      const dd = (s.tg_rate - s.cg_rate) * 100, sg = dd > 0 ? '+' : '', txt = `${sg}${dd.toFixed(2)}%p`;
      const cls = (s.significant_95 || s.significant) ? (dd > 0 ? 'pp-up' : 'pp-down') : 'pp-flat';
      pp = `<span class="${cls}">${txt}</span>`;
    }
    return `<tr><td>${esc(s.label || s.key)}</td><td class="rtc">${s.window_hours != null ? s.window_hours + '시간' : '—'}</td>` +
      `<td class="cnt">${fmt(s.tg_send)}</td><td class="cnt">${fmt(s.tg_conv)}<small style="color:#71717a"> (${pct2(s.tg_rate)})</small></td>` +
      `<td class="cnt">${fmt(s.cg_send)}</td><td class="cnt">${fmt(s.cg_conv)}<small style="color:#71717a"> (${pct2(s.cg_rate)})</small></td>` +
      `<td>${pp}</td></tr>`;
  }).join('');
  const head = `<thead><tr><th rowspan="2">스텝</th><th rowspan="2">전환 윈도우</th><th colspan="2">실험군</th><th colspan="2">대조군</th><th rowspan="2">증분 %p</th></tr>` +
    `<tr><th class="cnt">발송</th><th class="cnt">구매 (비율)</th><th class="cnt">발송</th><th class="cnt">구매 (비율)</th></tr></thead>`;
  const axis = (j._meta && j._meta.branch_axis) ? `<span class="h4cap">${esc(j._meta.branch_axis)}</span>` : '';
  return `<h4>${n}. 드립 스텝별 성과${axis}</h4><table>${head}<tbody>${rows}</tbody></table>` +
    `<div class="subnote">구매 = 스텝 발송 후 전환 윈도우 내 첫 결제 · 출처: 발송 = Braze · 구매 = 자사 결제 DB</div>`;
}

function renderConversionPanel(c, j, dispatch) {
  const schemaVer = (j._meta && j._meta.schema_version) || '1.0';
  if (schemaVer === '2.0') return renderConversionPanelV2(c, j);

  const a = j.audience || {};
  // 양쪽(실험군·대조군) 모두 0/미집계 = 추적 안 된 전환 이벤트 → 행 자체 제외(공란 방지)
  // 단 measured=true 는 '집계했는데 0'이라 남긴다 — 목적 지표가 0인 것 자체가 결과이고,
  // 행이 사라지면 퍼널이 앞 단계에서 끝난 것처럼 보인다(정기권형 구매 완료).
  const funnel = (j.funnel || []).filter(f => {
    if (f.measured) return true;
    const u = (f.tg_users != null) ? f.tg_users : f.tg_count;
    const cu = (f.cg_users != null) ? f.cg_users : f.cg_count;
    return (u || 0) > 0 || (cu || 0) > 0;
  });
  const tgEntry = a.tg_entry || a.tg_count || a.tg_entries || 0;
  const cgEntry = a.cg_entry || a.cg_count || a.cg_entries || 0;
  const hasCG = cgEntry > 0;
  const KOR = { draw_consent:'수집 동의 완료', draw_mission:'미션 받기', draw_reward:'응모권 지급', draw_entry:'응모 완료', session_start:'세션 시작', map_zone_click:'주차핀 클릭', ticket_payment_click:'구매하기 버튼 클릭', order_complete:'구매 완료' };
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const pct1 = v => (v == null) ? '—' : (v * 100).toFixed(1) + '%';
  const pct2 = v => (v == null) ? '—' : (v * 100).toFixed(2) + '%';  // 비교표: 증분 %p와 자릿수 일치
  const bz = id => id ? `<span class="bz">${esc(id)}</span>` : '';
  const lbl = f => f.label || KOR[f.event] || f.event || '-';
  const uOf = f => (f.tg_users != null) ? f.tg_users : f.tg_count;
  const cOf = f => (f.cg_users != null) ? f.cg_users : f.cg_count;
  const entriesLabel = a.entry_label || (hasCG ? '진입자' : '발송 모수');
  const sections = []; let n = 0;

  // 0. 요약 — 성과 결론이 맨 위에 먼저 보인다
  if (j._meta && j._meta.summary) {
    sections.push(`<h4>${++n}. 요약</h4>` +
      `<div style="padding:10px 14px;border-left:3px solid #0067DB;background:#f0f6ff;border-radius:0 8px 8px 0;font-weight:700;font-size:13.5px">${esc(j._meta.summary)}</div>`);
  }

  // 1. 발송 성과 (발송 메트릭 dispatch 있을 때만 — 광고·전환 공통 양식)
  const sp = dispatch ? sendPerfTable(dispatch) : '';
  if (sp) sections.push(`<h4>${++n}. 발송 성과<span class="h4cap">고유 유저 기준</span></h4>` + sp);

  // 목표 행동 전환 (쿠폰·액션 목적 캠페인) — 전환 성과 위(순번 A)
  // 그릴 게 없으면(자동 감지 쿠폰이 전부 0) 번호를 건너뛰지 않게 그려 본 뒤에만 번호를 올린다
  if (j.goal) { const gs = renderGoalSection(c, j, n + 1); if (gs) { n++; sections.push(gs); } }

  // 2. 전환 성과 (진입자 100% → 전환 단계)
  const rows2 = `<tr><td>${entriesLabel}${bz('entries')}</td><td class="cnt">${fmt(tgEntry)}</td><td class="rtc">100.0%</td></tr>` +
    funnel.map(f => {
      const u = uOf(f);
      const rate = (f.tg_rate != null) ? f.tg_rate : (tgEntry && u != null ? u / tgEntry : null);
      return `<tr><td>${lbl(f)}${bz(f.event)}</td><td class="cnt">${fmt(u)}</td><td class="rtc">${pct1(rate)}</td></tr>`;
    }).join('');
  const hasBottomSrc = !!(j._meta && j._meta.sources);   // 출처는 최하단 요약에서 한 번만
  sections.push(`<h4>${++n}. 전환 성과</h4><table><thead><tr><th>단계</th><th class="cnt">유저수</th><th class="rtc">전환율</th></tr></thead><tbody>${rows2}</tbody></table>` +
    (hasBottomSrc ? '' : `<div class="subnote">출처: 세션 시작 = Braze · 주차핀 클릭·구매 완료 = 자사 결제 DB</div>`));

  // 3. 실험군 vs 대조군 (대조군 있을 때만 — 광고 등 대조군 없으면 생략)
  // ITT: 비율·증분 모두 '진입자(전체 배정 유저)' 단일 분모 → 증분 %p = 실험군 비율 − 대조군 비율 로 일치
  if (hasCG) {
    const ppHtml = (tg, cg, sig) => {
      if (tg == null || cg == null) return '<span class="pp-flat">—</span>';
      const dd = (tg - cg) * 100, s = dd > 0 ? '+' : '', txt = `${s}${dd.toFixed(2)}%p`;
      if (!sig) return `<span class="pp-flat">${txt}</span>`;
      return `<span class="${dd > 0 ? 'pp-up' : 'pp-down'}">${txt}</span>`;
    };
    // ITT 기준선: 맨 위에 진입자(배정 유저) 100% 행 → 이후 단계는 모두 이 분모 대비
    const entryRow = `<tr><td>${entriesLabel}${bz('entries')}</td><td class="cnt">${fmt(tgEntry)}</td><td class="rtc">100.00%</td>` +
      `<td class="cnt">${fmt(cgEntry)}</td><td class="rtc">100.00%</td><td><span class="pp-flat">—</span></td></tr>`;
    const cmpFunnel = funnel.filter(f => f.compare !== false);   // 처치 산물(대조군이 받을 수 없는 행)은 비교에서 제외
    const rows3 = entryRow + cmpFunnel.map(f => {
      const u = uOf(f), cu = cOf(f);
      const tgR = (f.tg_rate != null) ? f.tg_rate : (tgEntry ? u / tgEntry : null);
      const cgR = (f.cg_rate != null) ? f.cg_rate : (cgEntry ? cu / cgEntry : null);
      const sig = f.significant_95 || f.significant;
      return `<tr><td>${lbl(f)}${bz(f.event)}</td><td class="cnt">${fmt(u)}</td><td class="rtc">${pct2(tgR)}</td>` +
        `<td class="cnt">${fmt(cu)}</td><td class="rtc">${pct2(cgR)}</td><td>${ppHtml(tgR, cgR, sig)}</td></tr>`;
    }).join('');
    const head3 = `<thead><tr><th rowspan="2">단계</th><th colspan="2">실험군</th><th colspan="2">대조군</th><th rowspan="2">증분 %p</th></tr>` +
      `<tr><th class="cnt">유저수</th><th class="rtc">비율</th><th class="cnt">유저수</th><th class="rtc">비율</th></tr></thead>`;
    const excluded = funnel.length - cmpFunnel.length;
    sections.push(`<h4>${++n}. 실험군 vs 대조군</h4><table>${head3}` +
      `<tbody>${rows3}</tbody></table><div class="subnote">색상 = 통계적으로 유의한 차이만 (+ 빨강 / − 파랑)` +
      (excluded ? ` · 쿠폰 등록·사용은 대조군이 받지 않아 비교하지 않음` : '') +
      (hasBottomSrc ? '' : ` · 출처: 세션 시작 = Braze · 핀 클릭·구매 = 자사 결제 DB`) + `</div>`);
  }

  // 분기(세그먼트·발송 시각)별 실험군 vs 대조군 — conversion.json branches[]
  if (j.branches && j.branches.length) sections.push(branchSection(c, j, ++n));
  // 드립 스텝별 성과 — conversion.json steps[]
  if (j.steps && j.steps.length) sections.push(dripSection(c, j, ++n));

  if (j._meta && (j._meta.criteria || j._meta.sources)) {
    const crit = [].concat(j._meta.criteria || []).map(x => `<div class="subnote">${esc(x)}</div>`).join('');
    sections.push(`<h4>${++n}. 집계 기준·출처</h4>` + crit +
      (j._meta.sources ? `<div class="subnote">${esc(j._meta.sources)}</div>` : ''));
  }
  sections.push(reportLinkSection(c, ++n));
  return sections.join('');
}

/* 인앱 메시지 전용 패널 — 실험군=노출(메시지를 본) 유저 / 대조군=동일 기간 앱 접속 홀드아웃 유저 */
function renderInappPanel(c, j) {
  const a = j.audience || {};
  const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const fmt = v => (v == null) ? '—' : Number(v).toLocaleString();
  const pct1 = v => (v == null) ? '—' : (v * 100).toFixed(1) + '%';
  const bz = id => id ? `<span class="bz">${esc(id)}</span>` : '';
  const KOR = { draw_consent:'수집 동의 완료', draw_mission:'미션 받기', draw_reward:'응모권 지급', draw_entry:'응모 완료', inapp_click:'인앱 클릭', order_complete:'구매 완료', session_start:'세션 시작', map_zone_click:'주차핀 클릭', ticket_payment_click:'구매하기 버튼 클릭' };
  const lbl = f => f.label || KOR[f.event] || f.event || '-';
  const funnel = j.funnel || [];
  const impUsers = a.tg_entry || 0;
  const cgEntry = a.cg_entry || 0;
  const hasCG = cgEntry > 0;
  const entryLabel = a.entry_label || '노출 유저';
  const entryEvent = a.entry_event || 'impression';
  const sections = []; let n = 0;

  // 1. 전환 성과 (노출 유저 100% → 클릭 → 구매)
  let rows = `<tr><td>${entryLabel}${bz(entryEvent)}</td><td class="cnt">${fmt(impUsers)}</td><td class="rtc">100.0%</td></tr>`;
  // 노출 행은 위에서 이미 깔았다 — funnel 의 impression 단계를 다시 그리면 같은 줄이 두 번 나온다
  funnel.filter(f => f.event !== 'inapp_impression' && f.event !== entryEvent).forEach(f => {
    const r = (f.tg_rate != null) ? f.tg_rate : (impUsers ? f.tg_users / impUsers : null);
    rows += `<tr><td>${lbl(f)}${bz(f.event)}</td><td class="cnt">${fmt(f.tg_users)}</td><td class="rtc">${pct1(r)}</td></tr>`;
  });
  const armCnt = Array.isArray(j.groups) ? j.groups.filter(g => g.role === 'tg').length : 1;
  sections.push(`<h4>${++n}. 전환 성과</h4><table><thead><tr><th>단계</th><th class="cnt">유저수</th><th class="rtc">전환율</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<div class="subnote">실험군 = 인앱 메시지를 실제로 본(노출) 유저 · 전환율 = 노출 유저 대비` +
    (armCnt > 1 ? ` · 실험군 ${armCnt}개 합산치이며, 소재별 수치는 아래 그룹별 비교 참조` : '') + `</div>`);

  // 2. 그룹별 비교 — conversion.groups[] 가 있으면 N열(실험군 여러 개 + 대조군).
  //    실험군이 2개 이상인 A/B 캠페인을 한 열로 합치면 소재 차이가 통째로 사라져서, 그룹 수만큼 열을 편다.
  //    구 스키마(groups 없음)는 아래 2열 렌더로 폴백.
  const groups = Array.isArray(j.groups) ? j.groups : null;
  const ppTxt = (v, sig) => {
    if (v == null) return '<span class="pp-flat">—</span>';
    const txt = `${v > 0 ? '+' : ''}${v.toFixed(3)}%p`;
    return sig ? `<span class="${v > 0 ? 'pp-up' : 'pp-down'}">${txt}</span>` : `<span class="pp-flat">${txt}</span>`;
  };
  const cgRows = funnel.filter(f => f.cg_users != null);
  if (groups && groups.length > 2) {
    const pct3 = v => (v == null) ? '—' : (v * 100).toFixed(3) + '%';
    const evs = [];
    groups.forEach(g => (g.steps || []).forEach(s => { if (!evs.includes(s.event)) evs.push(s.event); }));
    const head = `<thead><tr><th rowspan="2">단계</th>` +
      groups.map(g => `<th colspan="2">${esc(g.key)}<span class="h4cap">${esc(g.denom_label || '')} ${fmt(g.denom)}</span></th>`).join('') +
      `</tr><tr>` + groups.map(() => `<th class="cnt">유저수</th><th class="rtc">비율</th>`).join('') + `</tr></thead>`;
    const body = evs.map(e => {
      // 같은 단계라도 그룹마다 이름이 다를 수 있다(실험군=인앱 노출 / 대조군=앱 접속) — 다르면 합쳐 적는다
      const labs = [];
      groups.forEach(g => {
        const s = (g.steps || []).find(x => x.event === e);
        if (s && s.label && !labs.includes(s.label)) labs.push(s.label);
      });
      const cells = groups.map(g => {
        const s = (g.steps || []).find(x => x.event === e);
        return s ? `<td class="cnt">${fmt(s.users)}</td><td class="rtc">${pct3(s.rate)}</td>`
                 : `<td class="cnt">—</td><td class="rtc">—</td>`;
      }).join('');
      return `<tr><td>${esc(labs.join(' · ') || KOR[e] || e)}${bz(e)}</td>${cells}</tr>`;
    }).join('');
    const incRow = `<tr><td>증분 %p<span class="h4cap">대조군 대비</span></td>` +
      groups.map(g => `<td class="rtc" colspan="2">${g.delta_pp == null ? '<span class="pp-flat">기준</span>' : ppTxt(g.delta_pp, g.significant_95)}</td>`).join('') + `</tr>`;
    const incUsers = `<tr><td>증분 유저수<span class="h4cap">전환율 차이 × 분모</span></td>` +
      groups.map(g => `<td class="rtc" colspan="2">${g.incremental_users == null ? '—' : fmt(g.incremental_users) + '명'}</td>`).join('') + `</tr>`;
    const cu = (j._meta || {}).cuped;
    const cuTxt = cu ? ` · CUPED 보정 증분 ` +
      groups.filter(g => g.delta_pp_cuped != null)
            .map(g => `${esc(g.key)} ${g.delta_pp_cuped > 0 ? '+' : ''}${g.delta_pp_cuped.toFixed(3)}%p`).join(' · ') +
      ` (공변량 ${esc(cu.covariate)}, 분산감소 ${cu.var_reduction_pct}%) — 방법론·해석은 상세분석 리포트 참조` : '';
    sections.push(`<h4>${++n}. 그룹별 전환 비교</h4><table>${head}<tbody>${body}${incRow}${incUsers}</tbody></table>` +
      `<div class="subnote">각 그룹 비율 = 그 그룹 분모 대비 · 증분 %p = 실험군 − 대조군 · 색상은 통계적으로 유의한 차이만 (+ 빨강 / − 파랑)${cuTxt}</div>`);
    const pairs = Array.isArray(j.arm_comparisons) ? j.arm_comparisons : [];
    if (pairs.length) {
      const prows = pairs.map(p => `<tr><td>${esc(p.a)} vs ${esc(p.b)}</td>` +
        `<td class="rtc">${ppTxt(p.delta_pp, p.significant_95)}</td><td class="rtc">${p.z}</td>` +
        `<td class="rtc">${p.significant_95 ? '유의' : '미유의'}</td></tr>`).join('');
      sections.push(`<h4>${++n}. 실험군 간 비교</h4>` +
        `<table><thead><tr><th>비교</th><th class="rtc">차이 %p</th><th class="rtc">z</th><th class="rtc">95% 유의성</th></tr></thead><tbody>${prows}</tbody></table>` +
        `<div class="subnote">소재끼리의 직접 비교 · 2-비율 z-검정 · 대조군 대비 증분과 별개로 어느 소재가 더 나은지를 본다</div>`);
    }
  } else if (hasCG && cgRows.length) {
    const ppHtml = (tg, cg, sig) => {
      if (tg == null || cg == null) return '<span class="pp-flat">—</span>';
      const dd = (tg - cg) * 100, s = dd > 0 ? '+' : '', txt = `${s}${dd.toFixed(2)}%p`;
      if (!sig) return `<span class="pp-flat">${txt}</span>`;
      return `<span class="${dd > 0 ? 'pp-up' : 'pp-down'}">${txt}</span>`;
    };
    const head3 = `<thead><tr><th rowspan="2">단계</th><th colspan="2">실험군 (노출 ${fmt(impUsers)})</th><th colspan="2">대조군 (컨트롤 ${fmt(cgEntry)})</th><th rowspan="2">증분 %p</th></tr>` +
      `<tr><th class="cnt">유저수</th><th class="rtc">비율</th><th class="cnt">유저수</th><th class="rtc">비율</th></tr></thead>`;
    const rows3 = cgRows.map(f => `<tr><td>${lbl(f)}${bz(f.event)}</td><td class="cnt">${fmt(f.tg_users)}</td><td class="rtc">${pct1(f.tg_rate)}</td>` +
      `<td class="cnt">${fmt(f.cg_users)}</td><td class="rtc">${pct1(f.cg_rate)}</td><td>${ppHtml(f.tg_rate, f.cg_rate, f.significant_95)}</td></tr>`).join('');
    sections.push(`<h4>${++n}. 실험군 vs 대조군</h4><table>${head3}<tbody>${rows3}</tbody></table>` +
      `<div class="subnote">실험군 비율 = 노출 유저 대비 · 대조군 비율 = Braze 컨트롤 그룹(미노출 홀드아웃) 대비 · 증분 %p = 실험군 − 대조군 · 색상은 통계적으로 유의한 차이만 (+ 빨강 / − 파랑)</div>`);
  }

  sections.push(reportLinkSection(c, ++n));
  const basisTxt = (j._meta && j._meta.conversion_basis) ? `※ 전환 기준: ${esc(j._meta.conversion_basis)}` : '';
  const cgLabelTxt = (groups && groups.length > 2)
    ? (groups.find(g => g.role === 'cg') || {}).denom_label || '대조군 분모'
    : 'Braze 컨트롤 그룹(미노출)';
  const methodTxt = (groups && groups.length > 2)
    ? `※ 실험군 = 인앱 노출 유저 · 대조군 = ${esc(cgLabelTxt)}(배너 미노출) · 유의 = 2-비율 z-검정 · ` +
      `대조군은 노출 로그가 없어 같은 기간 앱을 연 유저로 분모를 맞춤 — 진입 전원 기준으로 잡으면 휴면까지 분모에 들어가 증분이 과대추정됨`
    : (hasCG && cgRows.length)
      ? `※ 실험군 = 인앱 노출 유저 · 대조군 = Braze 컨트롤 그룹(미노출) · 유의 = 2-비율 z-검정 · 노출 유저 자기선택 편향 잔존(엄밀 증분은 동시간 접속 매칭 리포트)`
      : `※ 단독 인앱(홀드아웃 없음) — 대조군 비교 생략`;
  const foot = `<div class="footer-note">${[basisTxt, methodTxt].filter(Boolean).join('<br>')}</div>`;
  return sections.join('') + foot;
}

// dashboard.html은 기존에 ~120개 캠페인을 하드코딩해서 보유.
// `gs://moduparking-crm/_meta/campaign_index.json`은 Phase 4 GCS 업로드 이후
// 추가된 신규 캠페인 entry만 누적 — 페이지 로드 시 fetch해서 merge.
function mergeIndexCampaigns(idx) {
  const knownIds = new Set(CAMPAIGNS.map(c => c.id));
  // GCS 인덱스 빌더가 짧은 폴더명에서 type/medium/owner 등 못 채운 entry를 만들 수 있음.
  // inline 캠페인과 동일한 것(name+sendDate 일치)이면 push 금지, status/assets/gcsPath만 보완.
  const fpKey = (n, d) => (n || '').replace(/\s+/g, '').toLowerCase() + '|' + (d || '');
  const fpToInline = {};
  for (const ic of CAMPAIGNS) {
    fpToInline[fpKey(ic.name, ic.sendDate)] = ic;
    // 풀네임에서 추출한 concept 기반 fingerprint도 등록 (이름이 약간 다른 경우 대비)
    if (ic.concept) fpToInline[fpKey(ic.concept, ic.sendDate)] = ic;
  }
  let added = 0;
  for (const c of (idx.campaigns || [])) {
    if (knownIds.has(c.id)) continue;
    const inlineMatch = fpToInline[fpKey(c.name, c.sendDate)]
                       || fpToInline[fpKey(c.seriesKey, c.sendDate)];
    if (inlineMatch) {
      // 인덱스로부터 보완만 — inline 데이터를 빈 값으로 덮어쓰지 않음.
      if (c.status && !inlineMatch.status) inlineMatch.status = c.status;
      if (c.assets) inlineMatch.assets = c.assets;
      if (c.lensDocs) inlineMatch.lensDocs = c.lensDocs;
      if (c.gcsPath && !CONVERSION_PATHS[inlineMatch.id]) {
        CONVERSION_PATHS[inlineMatch.id] = c.gcsPath;
      }
      continue;
    }
    CAMPAIGNS.push(c);
    if (c.gcsPath) CONVERSION_PATHS[c.id] = c.gcsPath;
    if (c.detail) EXEC_DETAIL[c.id] = c.detail;
    added++;
  }
  if (added > 0) enrichCampaigns(CAMPAIGNS);
  return added;
}

(async function loadIndexAndInit() {
  try {
    const resp = await fetch('/data/_meta/campaign_index.json', {cache: 'no-store'});
    if (resp.ok) {
      const idx = await resp.json();
      const added = mergeIndexCampaigns(idx);
      renderOrphanDocs(idx._meta);
      renderDupSuspects(idx._meta);
      // 수정 필요 칩은 페이지 로드 직후 그려진다 — 인덱스에서 늦게 병합된 카드는
      // 그 시점에 없어 담당자가 "미지정"으로 나온다. 병합이 끝나면 다시 그린다.
      if (window.CampaignRules && CampaignRules.summary) CampaignRules.summary();
      console.log(`[campaign_index] merged ${added} new campaign(s)`);
    } else {
      console.warn('[campaign_index] fetch non-ok:', resp.status);
    }
  } catch (e) {
    console.warn('[campaign_index] fetch failed:', e);
  }
  try {
    const ar = await fetch('/data/_meta/braze_audit.json', {cache: 'no-store'});
    if (ar.ok) renderBrazeAudit(await ar.json());
  } catch (e) {
    console.warn('[braze_audit] fetch failed:', e);
  }
  initRenderAll();
  _autoOpenFromUrl();  // 딥링크(cid) 재시도 — 인덱스 병합 이후여야 신규 캠페인도 열림 (200ms 타이머는 레이스)
})();

  function enhanceDocCopy(container){

  function enhanceDocCallouts(container){

  function highlightQuote(quote){
    var body=document.getElementById('pgDocBody');
    body.querySelectorAll('.pg-hl').forEach(function(e){ e.classList.remove('pg-hl'); });
    var norm=(quote||'').replace(/\s+/g,' ').trim().toLowerCase();
    if(!norm) return false;
    var blocks=body.querySelectorAll('p,li,td,th,h1,h2,h3,h4,pre,code,blockquote');
    var needles=[norm.slice(0,60), norm.slice(0,40), norm.slice(0,25)].filter(function(n){ return n.length>=6; });
    for(var n=0;n<needles.length;n++){
      for(var i=0;i<blocks.length;i++){
        if((blocks[i].textContent||'').replace(/\s+/g,' ').toLowerCase().indexOf(needles[n])>-1){
          blocks[i].classList.add('pg-hl');
          blocks[i].scrollIntoView({block:'center'});
          return true;  // 유지 — 다음 openDoc/하이라이트까지 표시
        }
      }
    }
    return false;
  }

      t.addEventListener('click', function(){
        if(t.getAttribute('data-kind')==='doc'){ openDoc(t.getAttribute('data-id'), t.getAttribute('data-title')); }
        else { window.open(t.getAttribute('data-target'), '_blank', 'noopener'); }
      });
    });
  }
  searchEl.addEventListener('input', function(){
    var term = this.value.trim().toLowerCase();
    if(!term){ renderCards(cards); return; }
    renderCards(cards.filter(function(c){ return (c.title+' '+(c.desc||'')).toLowerCase().indexOf(term)>-1; }));
  });

  function bubble(role, html){
    var b=document.createElement('div'); b.className='pg-bub '+role; b.innerHTML=html;
    conv.appendChild(b); conv.scrollTop=conv.scrollHeight; return b;
  }
  function addFbButton(b, q, a){
    var fb=document.createElement('div'); fb.className='pg-bfb';
    fb.innerHTML='<button class="pg-fblink" type="button">'+IC.flag+'잘못됐어요</button>';
    b.appendChild(fb);
    fb.querySelector('.pg-fblink').addEventListener('click', function(){ openReport({source:'chatbot', doc_title:'챗봇 답변', question:q, answer:a}); });
  }
  function greet(){
    bubble('b','안녕하세요. 마케팅 기본 정책에 대해 물어보거나, 위 카드를 눌러 문서를 바로 열어볼 수 있어요.');
    var h=''; CHIPS.forEach(function(c){ h+='<span class="pg-chip" data-q="'+esc(c)+'">'+esc(c)+'</span>'; });
    hints.innerHTML=h;
    hints.querySelectorAll('.pg-chip').forEach(function(ch){
      ch.addEventListener('click', function(){ ask(ch.getAttribute('data-q')); });
    });
  }
  function restoreChat(){
    conv.innerHTML=''; history=[]; hints.innerHTML='';
    _msgs.forEach(function(m){
      if(m.r==='u'){ bubble('u', esc(m.t||'')); history.push({role:'user', content:m.t||''}); }
      else { var b=bubble('b', m.h||''); if(m.q!=null) addFbButton(b, m.q, m.a||''); history.push({role:'assistant', content:m.a||''}); }
    });
    conv.scrollTop=conv.scrollHeight;
  }
  function initChat(){ if(_msgs.length){ restoreChat(); } else { greet(); } updateChatTop(); setCards(_msgs.length>0); }
  function clearChat(){
    if(_msgs.length && !confirm('이 대화를 모두 지울까요?')) return;
    _msgs=[]; history=[];
    try{ localStorage.removeItem(PG_CHAT_KEY); }catch(e){}
    conv.innerHTML=''; greet(); updateChatTop(); setCards(false);
  }
  function ask(q){
    q = (q!=null?q:input.value).trim();
    if(!q || busy) return;
    if(hints.innerHTML){ hints.innerHTML=''; }
    bubble('u', esc(q));
    history.push({role:'user', content:q});
    _msgs.push({r:'u', t:q}); saveChat(); updateChatTop(); setCards(true);
    input.value=''; autogrow();
    busy=true; sendBtn.disabled=true;
    var typing = bubble('b', '<span class="pg-typing">답변 작성 중…</span>');
    fetch('/api/policy-qa', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, history:history.slice(-6)})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.ok){
        var ans=d.answer||''; var html=d.answer_html || esc(ans);
        typing.innerHTML = html;
        history.push({role:'assistant', content:ans});
        addFbButton(typing, q, ans);
        _msgs.push({r:'b', h:html, q:q, a:ans}); saveChat();
      }
      else { typing.innerHTML = '답변 생성에 실패했어요. 잠시 후 다시 시도해주세요.'; }
    }).catch(function(){ typing.innerHTML = '네트워크 오류가 발생했어요.'; })
    .finally(function(){ busy=false; sendBtn.disabled=false; conv.scrollTop=conv.scrollHeight; input.focus(); });
  }
  sendBtn.addEventListener('click', function(){ ask(); });
  $('pgClearChat').addEventListener('click', clearChat);
  function autogrow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,96)+'px'; }
  input.addEventListener('input', autogrow);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(); } });
  restoreView();
})();
</script>
