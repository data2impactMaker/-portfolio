<script>
// ============== DATA ==============
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let CAMPAIGNS = [
];

// ============== HOSTING ENVIRONMENT DETECTION ==============
// GCS-직접 호스팅 (storage.cloud.google.com 등)에서는 /gcs/... 상대 경로가 안 되므로
// 절대 storage.cloud.google.com URL로 자동 변환
const IS_GCS_HOSTED = window.location.hostname.includes('storage') ||
                       window.location.hostname.includes('googleusercontent');
function linkifyDeeplink(text) {
  // parkingshare:// 스킴 + http(s) URL을 클릭 가능한 anchor로 변환
  if (!text) return '';
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(
    /(parkingshare:\/\/[^\s)]+|https?:\/\/[^\s)]+)/g,
    '<a href="$1" target="_blank" style="font-family:monospace;color:var(--accent);text-decoration:underline">$1</a>'
  );
}
function resolveAssetUrl(path) {
  if (!path || !path.startsWith('/gcs/')) return path;
  if (IS_GCS_HOSTED) {
    return 'https://storage.cloud.google.com/moduparking-crm-public' + path.substring(4);
  }
  return (window.__MOCK && window.__MOCK[decodeURIComponent(path)]) || path;
}
// ===== 위치 딥링크(maps/partner-maps) 정규화 — 좌표 + iOS·AOS 쌍 추출 =====
function _coordFrom(ios) {
  const m = (ios || '').match(/[?&]lat=([\d.]+)&lng=([\d.]+)/);
  return m ? `${m[1]}, ${m[2]}` : '';
}
function _deriveAos(ios) {
  return (ios || '').replace(/([?&])lat=/, '$1latitude=').replace(/([?&])lng=/, '$1longitude=');
}
// 위치 스킴 딥링크 문자열 → {ios, aos, coord}. 위치(maps/partner-maps) 아니면 null(=notice·coupon·텍스트).
function parseLocationDeeplink(str) {
  if (!str) return null;
  const urls = str.match(/parkingshare:\/\/[^\s)]+/g) || [];
  const loc = urls.filter(u => /(maps|partner-maps)\?/.test(u) && /(lat=|latitude=)/.test(u));
  if (!loc.length) return null;
  let ios = loc.find(u => /[?&]lat=/.test(u));
  let aos = loc.find(u => /[?&]latitude=/.test(u));
  if (ios && !aos) aos = _deriveAos(ios);
  if (aos && !ios) ios = aos.replace(/([?&])latitude=/, '$1lat=').replace(/([?&])longitude=/, '$1lng=');
  return { ios, aos, coord: _coordFrom(ios) };
}
// ex → 딥링크 표 rows([{zone?, ios, aos, coord}]) 또는 null(표 아님 → 기존 링크 폴백)
// 카드가 원천이므로 화면에서 고친 값이 곧 저장 값이다. 행 추가·삭제도 여기서 한다.
function _dlItems(ex){
  if (ex.deeplinks && ex.deeplinks.length) {
    return ex.deeplinks.map(z => ({ label: z.zone || z.label || '', url: z.ios || z.url || '' }));
  }
  return ex.deeplink ? [{ label: '', url: ex.deeplink }] : [];
}
function _dlComplete(u){
  return /(parkingshare|https?):\/\//.test(u || '')
    && !/\[[^\]]*\]|<[^>]*>|확정|예정|미정|추후|TBD|tbd/.test(u || '');
}
function _deeplinkBlock(c, ex){
  const items = _dlItems(ex);

  // 주소가 아직 확정 아니면(자리표시자가 남아 있으면) 비어 있는 자리와 같은 표시를 준다.
  // cr-missing 과 달리 cr-todo 는 눌러도 기존 값을 지우지 않는다 — 고쳐 쓰는 자리이기 때문이다.
  const cell = (v, field, i, wide) => {

       data-cid="${c.id}" data-wide="${wide ? 1 : 0}" data-value="${(v || '').replace(/"/g, '&quot;')}">${
       wide ? `<code>${v || '주소 입력'}</code>` : (v || '구분')}</span>`;

  if (items.length <= 1) {

        : `${cell(u, 'dl.url', 0, true)}${u ? ' <span class="cr-todo-tag">(미확정)</span>' : ''}`
    }</li></ul>`;
  }
  const rows = items.map((it, i) => `<tr>
      <td>${cell(it.label, 'dl.label', i, false)}</td>
      <td>${cell(it.url, 'dl.url', i, true)}${_dlComplete(it.url) ? '' : ' <span class="cr-todo-tag">(미확정)</span>'}</td>
      <td align="right">${editable ? `<span class="dl-del" data-dldel="${c.id}" data-i="${i}">삭제</span>` : ''}</td>
    </tr>`).join('');
  return `<table class="dl-table"><tr><th class="k">구분</th><th>주소</th><th class="a"></th></tr>${rows}</table>`;

function deeplinkRows(ex) {

function isoWeek(d) {
  const dt = new Date(d);
  const target = new Date(dt.valueOf());
  const dayNr = (dt.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}
function isoYear(d) {
  const dt = new Date(d);
  const target = new Date(dt.valueOf());
  target.setDate(target.getDate() + 3 - ((dt.getDay() + 6) % 7));
  return target.getFullYear();
}
function pad2(n) { return String(n).padStart(2, '0'); }
function weekRange(y, w) {
  const jan4 = new Date(y, 0, 4);
  const jan4Day = (jan4.getDay() + 6) % 7;
  const mon = new Date(jan4);
  mon.setDate(jan4.getDate() - jan4Day + (w - 1) * 7);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return { mon, sun };
}
function fmt(d) { return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtFull(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

// Enrich campaigns (idempotent — fetch 후 신규 entry에도 재호출 가능)
function enrichCampaigns(arr) {
  arr.forEach(c => {
    if (c.sendDateObj) return; // already enriched
    // status 는 아래에서 시점 기준 표시값(진행중·완료 등)으로 덮인다. 저장된 원래 상태를 남겨 둔다 —
    // 카드 수정 폼이 표시값을 그대로 저장하면 meta 에 "진행중" 같은 계산값이 들어가 원본이 오염된다.
    if (c.statusRaw === undefined) c.statusRaw = c.status;
    const sd = new Date(c.sendDate + "T00:00:00");
    const ed = new Date(c.endDate + "T00:00:00");
    c.sendDateObj = sd;
    c.endDateObj = ed;
    c.year = isoYear(sd);
    c.week = isoWeek(sd);
    c.weekLabel = `${c.year}-W${pad2(c.week)}`;
    const isLong = c.sendDate !== c.endDate;
    c.isLong = isLong;
    // 운영 창(KST) — detail.sendTime 시작·종료. 기간 운영(종료일이 뒤)의 운영중 판정과 정렬에만 쓴다.
    // 단회 발송의 발송중·완료는 시계가 아니라 Braze 로 정한다(아래 oneShot, send_status 상태 정의).
    const tm = ((c.detail && c.detail.sendTime) || '').match(/(\d{1,2}):(\d{2})(?:\s*[-~–]\s*(\d{1,2}):(\d{2}))?/);
    const endDay = isLong ? c.endDate : c.sendDate;
    const sendStart = tm ? new Date(`${c.sendDate}T${tm[1].padStart(2,'0')}:${tm[2]}:00+09:00`)
                         : new Date(`${c.sendDate}T00:00:00+09:00`);
    const sendEnd = (tm && tm[3]) ? new Date(`${endDay}T${tm[3].padStart(2,'0')}:${tm[4]}:00+09:00`)
                                  : new Date(`${endDay}T23:59:59+09:00`);
    c.sendStartObj = sendStart; c.sendEndObj = sendEnd;
    const now = Date.now();
    // ongoing 은 "종료일이 없다"는 뜻일 뿐 "지금 돌고 있다"는 뜻이 아니다.
    // 시작 시각 판정을 항상 먼저 해야 기획·예정 단계의 상시 캠페인이 운영중으로 새지 않는다.
    const started = now >= sendStart.getTime();
    const isPlanning = (c.status === '기획' || c.status === '기획중');
    // 카드에 저장된 값. 아래에서 c.status 를 날짜로 덮어쓰므로 여기서 붙들어 둔다.
    c.storedStatus = c.status;
    // 종료일이 실제로 잡혀 있으면(시작일과 다름) 기간 운영이다. ongoing 플래그가 붙어 있어도
    // 종료일이 우선 — 안 그러면 기간이 끝나도 영영 운영중으로 남는다(데이터 계약상 상시는 endDate 가 빈 값).
    const hasRealEnd = !!(c.endDate && c.sendDate && c.endDate !== c.sendDate);
    // 단회 발송의 발송중·완료는 시계가 아니라 Braze 로 정한다(2026-10-14 민지 확정). 발송 감시가 시작을 잡으면
    // sendDetectedAt 이 생겨 발송중이 되고, 발송량이 멈추면 저장 상태가 발송완료가 된다. 발송 시각이 지나도 잡히기
    // 전까지는 예정이다. 창(시작 후 1시간)으로 정하던 때는 11:00:42 에 다 나간 발송이 12시까지 발송중으로 보였다.
    const oneShot = !hasRealEnd && !c.ongoing && c.structure !== '상시';
    const todayIso = new Date(now + 9 * 3600 * 1000).toISOString().slice(0, 10);
    if (isPlanning && !(c.ongoing && started)) c.status = '기획중';  // 기획 보존 — 미래 발송일이어도 날짜로 예정/완료 재분류 안 함(발송예정 승격 전까지)
    else if (oneShot && (c.storedStatus === '발송완료' || c.storedStatus === '운영완료')) c.status = '완료';
    else if (oneShot && c.sendDetectedAt) c.status = '진행중';
    else if (oneShot && c.sendDate >= todayIso) c.status = '예정';
    else if (!started) c.status = '예정';
    else if (c.ongoing && !hasRealEnd) c.status = '진행중';  // 상시(종료일 없음) = 운영중, 종료 처리(/terminate) 전까지
    else if (!oneShot && now <= sendEnd.getTime()) c.status = '진행중';  // 기간 운영의 운영 창 내
    // 발송일이 지났다고 곧 완료는 아니다. 카드가 아직 '발송예정'이면 실제로 나갔는지
    // 아무도 확인하지 않은 것이다 — 완료로 덮으면 화면에서는 끝난 일이 되고, 분석·스윕은
    // 안 나간 것으로 읽어 둘이 조용히 갈린다(2026-08-31 여의도 D-7: 화면 완료·저장 발송예정,
    // 분석은 canvas_id 해석 실패로 한 번도 안 돌았다).
    // 다만 재빌드·대사가 Braze 집계로 발송을 확인했으면(brazeSentCheck.sent) 저장 상태가 아직 발송예정이라도 완료로 본다.
    // 카드에 적힌 종료 시각은 가이드가 미리 계산한 예상값이라 근거가 아니다(2026-10-14 상태 정의 — send_status 와 같다).
    else if (c.storedStatus === '발송예정' && !((c.brazeSentCheck || {}).sent === true)) c.status = '확인필요';
    else c.status = '완료';
  });
}

// 인앱은 보내는 게 아니라 조건이 맞을 때 노출된다. 상시면 기간 중 반복 노출이라는 사실도 적는다.
function _scheduleRow(c){
  const inApp = /인앱/.test(c.medium || '');
  const label = inApp ? '노출 기간' : '발송 일정';
  const note = c.structure === '상시'
    ? (inApp ? ' · 기간 중 조건 충족 시 반복 노출' : ' · 기간 중 조건 충족 시 반복 발송') : '';
  const day = (v, field) => `<span class="cr-editable ${v ? '' : 'cr-missing'}" data-edit="${field}"
      data-fmt="date" data-cid="${c.id}" data-value="${v || ''}">${v || '미기재'}</span>`;
  // 하루짜리는 시작일만 보인다. 종료일이 따로 잡혀 있을 때만 두 칸으로 적는다 —
  // 상시(무기한)는 종료일이 없다는 사실 자체가 값이라 빈 칸을 만들지 않는다.
  const hasEnd = c.endDate && c.sendDate && c.endDate !== c.sendDate;
  // 기간이 있는 방식(분할·기간 내 상시)은 종료일 칸을 늘 열어 둔다. 안 그러면 채울 자리가 없다.
  const needsEnd = hasEnd || c.structure === '분할' || (c.structure === '상시' && !!c.endDate);
  const period = needsEnd ? `${day(c.sendDate, 'sendDate')} - ${day(c.endDate, 'endDate')}`
                          : day(c.sendDate, 'sendDate');
  return `<li><b>${label}</b>: ${period}${note}</li>`;
}
function _coreTime(v){
  const t = String(v || '').match(/\d{1,2}:\d{2}(?:\s*[-~–]\s*\d{1,2}:\d{2})?/);
  if (t) return t[0].replace(/\s*[-~–]\s*/, ' - ');
  if (/트리거|상시/.test(String(v || ''))) return '트리거 노출 (시각 없음)';
  return '<span style="color:#b45309">미기재</span>';
}
// 문장 자체가 내용인 값(목적·타겟)은 자르지 않는다. 너무 길 때만 화면에서 줄이고 원문은 툴팁으로 남긴다.
function _coreText(v, limit = 90){
  const t = String(v || '').trim();
  if (!t) return '<span style="color:#b45309">미기재</span>';
  if (t.length <= limit) return esc(t);
  return `<span title="${esc(t)}">${esc(t.slice(0, limit))}…</span>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 상태 한글 표기 — 목록과 상세가 다른 단어를 쓰면 같은 카드가 다른 상태처럼 보인다.
// 진행중은 발송 방식에 따라 발송중(단회·분할) / 운영중(상시)으로 부른다.
function statusLabel(c){
  if (c.status !== '진행중') return c.status;
  if (c.structure === '상시' || c.ongoing) return '운영중';
  if (c.structure === '단회' || c.structure === '분할') return '발송중';
  return _isOneShotSend(c) ? '발송중' : '운영중';
}

function _liveTag(c){
  if (!_isOneShotSend(c)) return _dayTag(c);
  // 발송중 태그도 Braze 가 시작을 잡았을 때만(enrichCampaigns 가 정한 진행중) — 시계 창으로 붙이지 않는다
  return c.status === '진행중' ? statusLabel(c) : _dayTag(c);
}

// ════ v8 α 영역 렌더링 ════
// 발송(단발) vs 라이브(인앱·기획전·다일 운영) 구분
function _campIsLive(c){
  if (/인앱/.test(c.medium||'')) return true;
  if (/기획전/.test((c.type||'')+'|'+(c.kind||'')+'|'+(c.medium||''))) return true;
  if (c.endDate && c.sendDate && c.endDate !== c.sendDate) return true; // 다일 운영
  return false;
}
// 정확한 발송/라이브 시각 (meta detail.sendTime, 예: "18:00" 또는 "00:00 - 11:00")
function _campTimeStr(c){
  var d = (typeof EXEC_DETAIL !== 'undefined' && EXEC_DETAIL[c.id]) || c.detail || {};
  return (d.sendTime || '').trim();
}
// 시작 시각만 (범위면 앞부분) — 예 "18:00 - 18:46" → "18:00"
function _startTime(c){
  var s = _campTimeStr(c);
  if (!s) return '';
  return s.split(/[-~–]/)[0].trim();
}
function renderHeroCard() {
  const root = $('hero-card');
  if (!root) return;
  // 미래 발송 (예정) 가장 가까운 1개, 없으면 오늘 발송, 없으면 empty
  const future = CAMPAIGNS.filter(c => c.status === '예정')
    .sort((a,b) => a.sendDateObj - b.sendDateObj);
  const c = future[0];
  if (!c) {
    root.innerHTML = `
      <div class="A-hero-top"><span class="status-tag">다음 발송</span></div>
      <h1 style="color:var(--text-mute)">예정된 캠페인이 없습니다</h1>
      <div class="lede">새 캠페인이 등록되면 여기에 표시됩니다.</div>`;
    root.style.cursor = 'default';
    return;
  }
  const day = _dayKr(c.sendDateObj);
  const dateStr = `${_fmtShortDate(c.sendDateObj)} (${day})`;
  const tagline = `${c.type} · ${c.target} · ${c.medium}`;
  // 채널/기간별 문구: 푸시·SMS·이메일=발송 / 인앱·기획전·다일 운영=라이브
  const live = _campIsLive(c);
  const startT = _startTime(c);            // 시작 시각만
  const verbTag = live ? '다음 라이브' : '다음 발송';
  const dateLabel = live ? '운영일' : '발송일';
  const timeLabel = live ? '라이브 시작' : '발송 시각';
  const timeItem = startT ? `<div class="it"><strong>${startT}</strong>${timeLabel}</div>` : '';
  root.innerHTML = `
    <div class="A-hero-top">
      <span class="status-tag">${verbTag}</span>
      <span class="countdown">${_countdownLabel(c.sendDateObj)}</span>
    </div>
    <h1>${c.name}</h1>
    <div class="lede">${tagline}</div>
    <div class="A-hero-foot">
      <div class="it"><strong>${dateStr}</strong>${dateLabel}</div>
      ${timeItem}
      <div class="it"><strong>${c.owner}</strong>담당자</div>
      <div class="it"><strong>${c.medium}</strong>채널</div>
    </div>`;
  root.dataset.cid = c.id;
  root.onclick = () => openCampaign(c.id, 'planning');
}

function renderKpi2x2() {
  const total2026 = CAMPAIGNS.filter(c => c.year === 2026).length;

// 목록 전체를 넣고 넘치는 만큼만 카드 안에서 스크롤시킨다(높이는 5행 고정).
// 스크롤 가능할 때만 끝을 흐리게 — 위/아래 중 잘린 쪽에만 붙인다.
function _bindScrollFade(el) {
  if (!el) return;
  const sync = () => {
    const over = el.scrollHeight - el.clientHeight > 1;
    el.classList.toggle('fade-b', over && el.scrollTop + el.clientHeight < el.scrollHeight - 1);
    el.classList.toggle('fade-t', over && el.scrollTop > 1);
  };
  el.addEventListener('scroll', sync, { passive: true });
  sync();
}
function _renderMiniRows(list, getBadge) {
  if (list.length === 0) return `<div class="empty">캠페인이 없습니다</div>`;
  return list.map(c => `
    <div class="row" data-cid="${c.id}">
      <span class="n">${c.name}</span>
      <span class="b">${getBadge(c)}</span>
    </div>`).join('');
}

function renderCategoryBoard() {
  // 운영 — 경과일 오름차순(최근 시작한 것이 위). 시작 시각이 같으면 운영으로 바뀐 시각이 늦은 쪽을 위로.
  const _statusAt = c => c.statusAt ? new Date(c.statusAt).getTime() : 0;
  const live = CAMPAIGNS.filter(c => c.status === '진행중')
    .sort((a,b) => (b.sendStartObj - a.sendStartObj) || (_statusAt(b) - _statusAt(a)));
  // 예정 (미래 발송)
  const next = CAMPAIGNS.filter(c => c.status === '예정')
    .sort((a,b) => a.sendDateObj - b.sendDateObj);
  // 기획 (status === '기획중', 없으면 빈)
  const plan = CAMPAIGNS.filter(c => c.status === '기획중')
    .sort((a,b) => a.sendDateObj - b.sendDateObj);
  // 완료 (최근 7일)
  const sevenDaysAgo = new Date(TODAY); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  const done = CAMPAIGNS.filter(c =>
    isDoneish(c) && c.sendDateObj >= sevenDaysAgo && c.sendDateObj <= TODAY
  ).sort((a,b) => b.sendDateObj - a.sendDateObj);

  // 카운트는 전체 기준 — 상단 KPI(현재 운영중)와 숫자가 어긋나지 않게.
  // 목록도 전부 넣고, 5행을 넘는 만큼만 카드 안에서 스크롤된다.
  $('mini-live').innerHTML = `
    <div class="head"><span class="name">운영</span><span class="cnt">${live.length}</span></div>
    <div class="rows">${_renderMiniRows(live, _liveTag)}</div>
  `;
  $('mini-next').innerHTML = `
    <div class="head"><span class="name">예정</span><span class="cnt">${next.length}</span></div>
    <div class="rows">${_renderMiniRows(next, c => _countdownLabel(c.sendDateObj))}</div>
  `;
  $('mini-plan').innerHTML = `
    <div class="head"><span class="name">기획</span><span class="cnt">${plan.length}</span></div>
    <div class="rows">${_renderMiniRows(plan, c => '초안')}</div>
  `;
  $('mini-done').innerHTML = `
    <div class="head"><span class="name">완료</span><span class="meta">최근 7일</span></div>
    <div class="rows">${_renderMiniRows(done, c => _fmtShortDate(c.sendDateObj))}</div>
  `;
  // 클릭 이벤트
  document.querySelectorAll('.A-mini .row').forEach(el => {
    el.addEventListener('click', () => openCampaign(el.dataset.cid, 'planning'));
  });
  document.querySelectorAll('.A-mini .rows').forEach(_bindScrollFade);
}

function renderUpcomingStrip() {
  // 미래 발송 예정 캠페인만 (완료 제외)
  const list = CAMPAIGNS.filter(c =>
    c.status === '예정' ||
    (c.sendDateObj && c.sendDateObj.toDateString() === TODAY.toDateString())
  ).sort((a,b) => a.sendDateObj - b.sendDateObj).slice(0, 5);
  const root = $('upcoming-strip');
  if (list.length === 0) {
    root.outerHTML = `<div class="empty-strip" id="upcoming-strip">예정된 캠페인이 없습니다</div>`;
    return;
  }
  root.innerHTML = list.map((c, idx) => {
    const isFeat = idx === 0;
    const day = _dayKr(c.sendDateObj);
    const tagline = `${c.type} · ${c.target} · ${c.medium}`;
    const dateStr = `${_fmtShortDate(c.sendDateObj)} (${day})`;
    const isToday = c.sendDateObj.toDateString() === TODAY.toDateString();
    const statusLabel = isFeat
      ? (isToday ? '오늘 발송' : '다음 발송')
      : '예정';
    const footItems = [
      `<span class="item"><strong>${dateStr}</strong></span>`,
      `<span class="item">${c.owner}</span>`,
      `<span class="item">${c.medium}</span>`,
    ].join('');
    return `
      <div class="news-card ${isFeat ? 'featured dark' : 'upcoming'}" data-cid="${c.id}">
        <div class="news-top">
          <span class="news-status">${statusLabel}</span>
          <span class="news-countdown">${_countdownLabel(c.sendDateObj)}</span>
        </div>
        <div class="news-title">${c.name}</div>
        <div class="news-tagline">${tagline}</div>
        <div class="news-foot">${footItems}</div>
      </div>
    `;
  }).join('');
  root.querySelectorAll('.news-card').forEach(el => {
    el.addEventListener('click', () => openCampaign(el.dataset.cid, 'planning'));
  });
}

function renderActiveStrip() {
  const list = CAMPAIGNS.filter(c => c.status === '진행중')
    .sort((a,b) => b.sendDateObj - a.sendDateObj);
  const root = $('active-strip');
  if (list.length === 0) {
    root.outerHTML = `<div class="empty-strip" id="active-strip">현재 진행 중인 진행중 캠페인이 없습니다</div>`;
    return;
  }
  root.innerHTML = list.map(c => {
    const tagline = `${c.type} · ${c.target} · ${c.medium}`;
    const hasPeriod = c.endDate && c.endDate !== c.sendDate;
    const endObj = c.endDate ? new Date(c.endDate) : c.sendDateObj;
    const period = hasPeriod
      ? `${_fmtShortDate(c.sendDateObj)} - ${_fmtShortDate(endObj)}`
      : `${_fmtShortDate(c.sendDateObj)} (${_dayKr(c.sendDateObj)})`;
    // 진행 일차 = TODAY - sendDate + 1 (시작일 = 1일차)
    const daysIn = Math.max(1, Math.floor((TODAY - c.sendDateObj) / 86400000) + 1);
    const footItems = [
      `<span class="item"><strong>${period}</strong></span>`,
      `<span class="item">${c.owner}</span>`,
      `<span class="item">${c.medium}</span>`,
    ].join('');
    return `
      <div class="news-card live" data-cid="${c.id}">
        <div class="news-top">
          <span class="news-status">진행중</span>
          <span class="news-countdown">${daysIn}일차</span>
        </div>
        <div class="news-title">${c.name}</div>
        <div class="news-tagline">${tagline}</div>
        <div class="news-foot">${footItems}</div>
      </div>
    `;
  }).join('');
  root.querySelectorAll('.news-card').forEach(el => {
    el.addEventListener('click', () => openCampaign(el.dataset.cid, 'planning'));
  });
}

let currentYearFilter = TODAY_YEAR;
let currentMedium = null;
let currentSearch = '';
let viewMode = 'grid'; // 'grid' | 'week' | 'month'

function getYearWeeks(y) {
  const dec28 = new Date(y, 11, 28);
  const lastWeek = isoWeek(dec28);
  let maxWeek = lastWeek;
  if (y === TODAY_YEAR) maxWeek = Math.min(TODAY_WEEK, maxWeek);
  return Array.from({length: maxWeek}, (_, i) => i + 1);
}

// CRM 헤더 「확인 필요」 칩 — 카드 규칙·카드 없는 문서·Braze 불일치·중복 의심을 한 칩에 모은다.
// 갈래마다 칩을 세우면 헤더가 길어지고 같은 담당자가 칩마다 되풀이된다. 갈래는 칩을 눌러 고른다.
// 각 갈래는 setCrmIssue 로 건수·담당자·목록 열기만 넘기고, 칩은 여기서 한 번만 그린다.
window.CRM_ISSUES = window.CRM_ISSUES || {};
const CRM_ISSUE_ORDER = ['rules', 'orphan', 'braze', 'dup'];
function setCrmIssue(key, entry){ window.CRM_ISSUES[key] = entry; renderCrmIssues(); }
function crmIssueList(){
  return CRM_ISSUE_ORDER.map(function(k){ return window.CRM_ISSUES[k]; })
    .filter(function(e){ return e && e.count; });
}
function crmOwnerLine(owners){
  const cnt = {};
  owners.forEach(function(n){ n = n || '담당 미지정'; cnt[n] = (cnt[n] || 0) + 1; });
  const names = Object.keys(cnt).sort(function(a,b){ return cnt[b] - cnt[a]; });
  return names.slice(0, 3).join(' · ') + (names.length > 3 ? ' 외 ' + (names.length - 3) + '명' : '');
}
function renderCrmIssues(){
  const host = document.getElementById('crm-issues');
  if (!host) return;
  const list = crmIssueList();
  if (!list.length) { host.innerHTML = ''; return; }
  const total = list.reduce(function(s, e){ return s + e.count; }, 0);
  const owners = [].concat.apply([], list.map(function(e){ return e.owners; }));
  host.innerHTML = '<button class="cr-sum" id="crm-issues-btn"><i></i>' +
    '<b>확인 필요 ' + total + '건</b><span>' + esc(crmOwnerLine(owners)) + '</span></button>';
  // 갈래가 하나뿐이면 고를 것이 없다 — 바로 그 목록을 연다.
  document.getElementById('crm-issues-btn').onclick = list.length === 1 ? list[0].open : openCrmIssues;
}
window.setCrmIssue = setCrmIssue;
window.renderCrmIssues = renderCrmIssues;
function openCrmIssues(){
  const list = crmIssueList();
  const wrap = document.createElement('div');
  wrap.className = 'cr-modal cr-sum-modal';
  wrap.innerHTML = '<div class="cr-sheet"><div class="cr-sheet-head">' +
    '<b>확인 필요 ' + list.reduce(function(s, e){ return s + e.count; }, 0) + '건</b>' +
    '<span class="cr-hint">갈래를 누르면 해당 목록이 열립니다</span>' +
    '<button class="cr-x">닫기</button></div><div class="cr-sum-list">' +
    list.map(function(e, i){
      return '<div class="cr-sum-row rail-amber" data-crm-issue="' + i + '">' +
        '<div class="cr-sum-top"><span class="cr-sum-title">' + esc(e.label) + ' ' + e.count + e.unit + '</span>' +
        '<span class="cr-sum-meta">' + esc(crmOwnerLine(e.owners)) + '</span></div></div>';
    }).join('') + '</div></div>';
  document.body.appendChild(wrap);
  document.body.classList.add('cr-modal-open');
  function close(){
    wrap.remove();
    document.body.classList.remove('cr-modal-open');
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  wrap.querySelector('.cr-x').onclick = close;
  wrap.addEventListener('click', function(e){
    if (e.target === wrap) { close(); return; }
    const row = e.target.closest('[data-crm-issue]');
    if (row) { close(); list[Number(row.dataset.crmIssue)].open(); }
  });
}

// 렌즈에만 올라가고 캠페인 폴더에는 안 들어온 문서. 카드가 없어 카드 줄로 설 수는 없지만,
// 카드 규칙 위반은 카드를 고치는 일이고, 이 문서들은 파일 이름을 고치거나 카드를 새로 만드는 일이다.
// 하는 일이 달라 목록은 따로 연다 — 헤더에는 「확인 필요」 칩 하나로 모으고, 누르면 갈래를 고른다.
let ORPHAN_DOCS = [];
const LENS_BASE = '';
function renderOrphanDocs(meta){

// medium filter logic - "기획전" matches concept, "SMS" matches LMS medium
function matchesMedium(c, m) {
  if (!m) return true;
  if (m === '기획전') return (c.concept || '').includes('기획전');
  if (m === 'SMS') return c.medium === 'LMS' || c.medium === 'SMS' || c.medium === '문자';
  return c.medium === m;
}
function matchesCampaign(c) {
  if (!matchesMedium(c, currentMedium)) return false;
  if (!currentSearch) return true;
  const q = currentSearch.toLowerCase().trim();
  const fields = [c.name, c.concept, c.fullName, c.sendDate, c.endDate, c.owner, c.target, c.type, c.medium, c.weekLabel].join(' ').toLowerCase();
  if (fields.includes(q)) return true;
  // Date inputs: "M/D" or "YYYY-MM-DD" — match if query date falls within campaign range OR same ISO week
  let queryDate = null;
  const m = q.match(/^(\d{1,2})\/(\d{1,2})$/);
  const m2 = q.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) queryDate = new Date(c.year, parseInt(m[1]) - 1, parseInt(m[2]));
  else if (m2) queryDate = new Date(parseInt(m2[1]), parseInt(m2[2]) - 1, parseInt(m2[3]));
  if (queryDate) {
    if (queryDate >= c.sendDateObj && queryDate <= c.endDateObj) return true;
    if (isoYear(queryDate) === c.year && isoWeek(queryDate) === c.week) return true;
  }
  return false;
}

function startOfWeek(d) {
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7; // 월=0
  x.setHours(0,0,0,0);
  x.setDate(x.getDate() - day);
  return x;
}
function startOfMonth(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), 1);
  x.setHours(0,0,0,0);
  return x;
}
function endOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth() + 1, 0);
}
function sameDate(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function dateKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function campaignsOnDate(d) {
  // 캠페인 발송일에 해당하거나, 진행중 캠페인(범위) 이라면 그 기간 내에 포함
  return CAMPAIGNS.filter(c => {
    if (c.status === '진행중') {
      return d >= c.sendDateObj && d <= c.endDateObj;
    }
    return sameDate(d, c.sendDateObj);
  });
}

  });
}

// 지운 카드 보기 — 켜면 삭제 보관 목록을 불러와 그리드 위에 펼친다(그리드·캘린더 필터와는 따로 동작)
let showDeleted = false;
function renderDeletedCards() {
  const box = $('deleted-list'), tg = $('deleted-toggle');
  tg.classList.toggle('active', showDeleted);
  box.style.display = showDeleted ? '' : 'none';
  if (!showDeleted) return;
  box.innerHTML = '<div class="dl-empty">불러오는 중</div>';
  fetch('/api/deleted-campaigns', { credentials: 'same-origin' }).then(r => r.json()).then(d => {
    const items = (d && d.items) || [];
    if (!items.length) { box.innerHTML = '<div class="dl-empty">지운 카드가 없어요</div>'; return; }
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    box.innerHTML = '<div class="dl-row dl-head"><span>카드</span><span>발송일</span><span>사유</span><span>삭제</span></div>' + items.map(x =>
      `<div class="dl-row"><span><span class="dl-name">${esc(x.name || x.from.split('/').pop())}</span><span class="dl-sub dl-meta">${esc([x.medium, x.owner, x.requestId ? '요청 ' + x.requestId : ''].filter(Boolean).join(' · '))}</span></span>` +
      `<span class="dl-sub">${esc(x.sendDate)}</span><span>${esc(x.reason || '미기재')}</span>` +
      `<span class="dl-sub">${esc((x.at || '').slice(5, 16).replace('T', ' '))} · ${esc((x.by || '').split('@')[0])}</span></div>`).join('');
  }).catch(() => { box.innerHTML = '<div class="dl-empty">지운 카드를 불러오지 못했어요</div>'; });
}
document.addEventListener('DOMContentLoaded', () => {
  const tg = $('deleted-toggle');
  if (tg) tg.addEventListener('click', () => { showDeleted = !showDeleted; renderDeletedCards(); });
});

function renderCalendar() {
  const root = $('calendar');
  if (viewMode === 'week') {
    renderWeekCalendar(root);
  } else if (viewMode === 'month') {
    renderMonthCalendar(root);
  }
}

function renderWeekCalendar(root) {
  const monday = startOfWeek(calAnchor);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  $('cal-period-label').textContent = `${monday.getFullYear()}년 ${monday.getMonth()+1}월 ${monday.getDate()}일 - ${sunday.getMonth()+1}월 ${sunday.getDate()}일 · W${pad2(isoWeek(monday))}`;
  let html = '<div class="cal-weekdays">';
  const dayNames = ['월','화','수','목','금','토','일'];
  dayNames.forEach((n, i) => {
    const cls = i === 5 ? 'sat' : (i === 6 ? 'sun' : '');
    html += `<div class="cal-weekday ${cls}">${n}</div>`;
  });
  html += '</div><div class="cal-grid week">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    html += renderDayCell(d, true);
  }
  html += '</div>';
  root.innerHTML = html;
  bindDayEvents(root);
}

function renderMonthCalendar(root) {
  const firstOfMonth = startOfMonth(calAnchor);
  const lastOfMonth = endOfMonth(calAnchor);
  $('cal-period-label').textContent = `${firstOfMonth.getFullYear()}년 ${firstOfMonth.getMonth()+1}월`;
  let html = '<div class="cal-weekdays">';
  const dayNames = ['월','화','수','목','금','토','일'];
  dayNames.forEach((n, i) => {
    const cls = i === 5 ? 'sat' : (i === 6 ? 'sun' : '');
    html += `<div class="cal-weekday ${cls}">${n}</div>`;
  });
  html += '</div><div class="cal-grid month">';
  const gridStart = startOfWeek(firstOfMonth);
  const gridEnd = new Date(lastOfMonth);
  // 마지막 주 일요일까지
  const lastDayWeek = (lastOfMonth.getDay() + 6) % 7;
  gridEnd.setDate(lastOfMonth.getDate() + (6 - lastDayWeek));
  for (let d = new Date(gridStart); d <= gridEnd; d.setDate(d.getDate() + 1)) {
    const inMonth = d.getMonth() === firstOfMonth.getMonth();
    html += renderDayCell(new Date(d), inMonth, true);
  }
  html += '</div>';
  root.innerHTML = html;
  bindDayEvents(root);
}

function renderDayCell(d, inMonth, compact = false) {
  const isToday = sameDate(d, TODAY);
  const dow = (d.getDay() + 6) % 7;
  const dayNumCls = dow === 5 ? 'sat' : (dow === 6 ? 'sun' : '');
  const cellCls = `cal-day ${inMonth ? '' : 'other-month'} ${isToday ? 'today' : ''}`;
  const isFiltered = currentMedium !== null || currentSearch !== '';
  const list = campaignsOnDate(d).filter(c => isDoneish(c));
  const maxShow = compact ? 3 : 999;
  const events = list.slice(0, maxShow).map(c => {
    const dim = isFiltered && !matchesCampaign(c) ? 'dim' : '';
    return `<div class="cal-event medium-${c.medium} ${dim}" data-cid="${c.id}" title="${c.fullName}">${c.name}</div>`;
  }).join('');
  const more = list.length > maxShow ? `<div class="cal-event-more">+${list.length - maxShow}개</div>` : '';
  return `<div class="${cellCls}" data-date="${dateKey(d)}">
    <div class="cal-day-num ${dayNumCls}">${d.getDate()}</div>
    ${events}${more}
  </div>`;
}

function bindDayEvents(root) {
  root.querySelectorAll('.cal-event').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openCampaign(el.dataset.cid);
    });
  });
  root.querySelectorAll('.cal-day').forEach(el => {
    el.addEventListener('click', () => selectDate(el.dataset.date));
  });
}

function selectDate(dateStr) {
  const d = new Date(dateStr);
  let list = campaignsOnDate(d).filter(c => isDoneish(c));
  if (currentMedium !== null || currentSearch !== '') list = list.filter(matchesCampaign);
  list.sort((a,b) => a.sendDateObj - b.sendDateObj);
  const detail = $('week-detail');
  detail.classList.add('open');
  if (list.length === 0) {
    detail.innerHTML = `<h4>${dateStr}</h4><p style="color:var(--text-muted);font-size:13px">해당 날짜에 캠페인이 없거나 필터에 매치되는 캠페인이 없습니다.</p>`;
    return;
  }
  detail.innerHTML = `
    <h4>${dateStr} 캠페인 (${list.length}개)</h4>
    <div class="campaign-list">
      ${list.map(c => `
        <div class="campaign-item" data-cid="${c.id}">
          <div class="info">
            <div class="name">${c.name}</div>
            <div class="meta">${c.sendDate} (${_dayKr(c.sendDateObj)})${c.sendDate !== c.endDate ? ` - ${c.endDate} (${_dayKr(c.endDateObj)})` : ''} · ${c.type} · ${c.target} · ${c.medium} · ${c.owner}</div>
          </div>
          <span class="status-badge status-${c.status}">${c.status}</span>
        </div>
      `).join('')}
    </div>`;
  detail.querySelectorAll('.campaign-item').forEach(el => {
    el.addEventListener('click', () => openCampaign(el.dataset.cid));
  });
}

function selectWeek(key) {
  document.querySelectorAll('.week-cell').forEach(el => {
    el.classList.toggle('selected', el.dataset.week === key);
  });
  let list = CAMPAIGNS.filter(c => c.weekLabel === key && isDoneish(c));
  if (currentMedium !== null || currentSearch !== '') list = list.filter(matchesCampaign);
  list.sort((a,b) => a.sendDateObj - b.sendDateObj);
  const detail = $('week-detail');
  detail.classList.add('open');
  if (list.length === 0) {
    detail.innerHTML = `<h4>${key}</h4><p style="color:var(--text-muted);font-size:13px">해당 주차에 캠페인이 없거나 필터에 매치되는 캠페인이 없습니다.</p>`;
    return;
  }
  detail.innerHTML = `
    <h4>${key} 캠페인 목록 (${list.length}개)</h4>
    <div class="campaign-list">
      ${list.map(c => `
        <div class="campaign-item" data-cid="${c.id}">
          <div class="info">
            <div class="name">${c.name}</div>
            <div class="meta">${c.sendDate} (${_dayKr(c.sendDateObj)})${c.sendDate !== c.endDate ? ` - ${c.endDate} (${_dayKr(c.endDateObj)})` : ''} · ${c.type} · ${c.target} · ${c.medium} · ${c.owner}</div>
          </div>
          <span class="status-badge status-${c.status}">${c.status}</span>
        </div>
      `).join('')}
    </div>`;
  detail.querySelectorAll('.campaign-item').forEach(el => {
    el.addEventListener('click', () => openCampaign(el.dataset.cid));
  });
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderSidebar() {
  const byYear = {};
  CAMPAIGNS.forEach(c => {
    byYear[c.year] = byYear[c.year] || {};
    const wk = `W${pad2(c.week)}`;
    byYear[c.year][wk] = byYear[c.year][wk] || [];
    byYear[c.year][wk].push(c);
  });
  const years = Object.keys(byYear).sort((a,b) => b - a);
  const root = $('sidebar-tree');
  root.innerHTML = years.map(y => {
    const weeks = Object.keys(byYear[y]).sort((a,b) => b.localeCompare(a));
    const weekHtml = weeks.map(w => {
      const list = byYear[y][w].sort((a,b) => a.sendDateObj - b.sendDateObj);
      return `<div class="tree-week-wrap">
        <div class="tree-week" data-key="${y}-${w}"><span><span class="tree-arrow">▸</span> ${w}</span><span class="count">${list.length}</span></div>
        <div class="tree-campaigns" data-parent="${y}-${w}" style="display:none">
          ${list.map(c => `<div class="tree-campaign" data-cid="${c.id}" title="${c.fullName}">${c.name}</div>`).join('')}
        </div>
      </div>`;
    }).join('');
    return `<div class="tree-year-wrap">
      <div class="tree-year" data-y="${y}"><span class="tree-arrow">▾</span> ${y}년 (${Object.values(byYear[y]).flat().length}개)</div>
      <div class="tree-weeks" data-parent-year="${y}">${weekHtml}</div>
    </div>`;
  }).join('');

  root.querySelectorAll('.tree-year').forEach(el => {
    el.addEventListener('click', () => {
      const y = el.dataset.y;
      const weeks = root.querySelector(`.tree-weeks[data-parent-year="${y}"]`);
      const arrow = el.querySelector('.tree-arrow');
      if (weeks.style.display === 'none') { weeks.style.display = 'block'; arrow.textContent = '▾'; }
      else { weeks.style.display = 'none'; arrow.textContent = '▸'; }
    });
  });
  root.querySelectorAll('.tree-week').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      const ch = root.querySelector(`.tree-campaigns[data-parent="${key}"]`);
      const arrow = el.querySelector('.tree-arrow');
      if (ch.style.display === 'none') { ch.style.display = 'block'; arrow.textContent = '▾'; }
      else { ch.style.display = 'none'; arrow.textContent = '▸'; }
    });
  });
  root.querySelectorAll('.tree-campaign').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      root.querySelectorAll('.tree-campaign').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      openCampaign(el.dataset.cid);
    });
  });
}

// ============== MODAL ==============
// 캠페인의 GCS 폴더 경로 (인덱스 gcsPath 또는 conversion 경로)
function campaignPath(c) { return (c && (c.gcsPath || CONVERSION_PATHS[c.id])) || ''; }
// 마크다운 원본 뷰어 링크 (/doc 라우트가 렌더)
function docHref(c, rel) {
  const p = campaignPath(c);
  if (!p) return '';
  return '/doc/' + (p + '/' + rel).split('/').map(encodeURIComponent).join('/');
}
// GCS 원본 파일 직접 링크 (/gcs 프록시 — 업로드된 content-type 그대로 서빙)
function gcsHref(c, rel) {
  const p = campaignPath(c);
  if (!p) return '';
  return '/gcs/' + (p + '/' + rel).split('/').map(encodeURIComponent).join('/');
}
// HTML 원본이 GCS에 있으면 .html을 직접 링크, 없으면 /doc(md 렌더)로 폴백
function docOrHtmlHref(c, mdRel, htmlRel, hasHtml) {
  return hasHtml ? gcsHref(c, htmlRel) : docHref(c, mdRel);
}
// 카드 상세(detail)는 meta.json 이 원천이다. 문서에서 뽑아 둔 값(EXEC_DETAIL 초기값)은
// 카드가 없을 때만 쓰는 폴백이며, 카드 값이 오면 항상 그쪽이 이긴다 — 안 그러면 카드에서
// 고친 값이 문서 파싱 값에 가려 되돌아간 것처럼 보인다(2026-08-21 민지 지시: 카드가 원천).
async function ensureDetail(c) {
  if (!c || c._detailLoaded) return;
  const p = campaignPath(c);
  if (!p) return;
  try {
    const enc = (p + '/meta.json').split('/').map(encodeURIComponent).join('/');
    const res = await fetch('/data/' + enc, { cache: 'no-store' });
    if (!res.ok) return;
    const meta = await res.json();
    if (meta && meta.detail && Object.keys(meta.detail).length) {
      EXEC_DETAIL[c.id] = Object.assign({}, EXEC_DETAIL[c.id] || {}, meta.detail);
      c.detail = EXEC_DETAIL[c.id];
    }
    c._detailLoaded = true;
  } catch (e) { /* 실패 시 기존 placeholder 렌더로 폴백 */ }
}

let _openCid = null;
// 모달/탭 상태를 URL(?cid&tab)에 반영. push=true면 히스토리 항목 추가(뒤로가기로 모달 복원)
function _setUrlState(cid, tab, push) {
  const url = new URL(window.location.href);
  url.searchParams.set('cid', cid);
  if (tab) url.searchParams.set('tab', tab);
  const target = url.pathname + '?' + url.searchParams.toString();
  if (push) window.history.pushState({ cid, tab }, '', target);
  else window.history.replaceState({ cid, tab }, '', target);
}
async function openCampaign(cid, defaultTab='planning', push=true) {
  const c = CAMPAIGNS.find(x => x.id === cid);
  if (!c) return;
  if (c._reco) return; // 주간 추천 채택 항목(기획 미니카드) — 상세 모달 없음
  const crEdit = (window.CampaignRules && CampaignRules.editButton) ? CampaignRules.editButton(c.id) : '';
  const crChip = (window.CampaignRules && CampaignRules.badge) ? CampaignRules.badge(c.id) : '';
  const crMode = (window.CampaignRules && CampaignRules.editModeButton) ? CampaignRules.editModeButton() : '';
  const crNotice = (window.CampaignRules && CampaignRules.issueList) ? CampaignRules.issueList(c.id) : '';
  $('modal-title').innerHTML = `<span class="mt-name">${c.name}</span> <span class="status-badge status-${c.status}" style="vertical-align:middle;margin-left:8px;font-size:11px">${statusLabel(c)}</span>${crChip}${crMode}`;
  $('modal-meta').textContent = `${c.year} W${pad2(c.week)}`;
  await ensureDetail(c);
  renderTab(c, 'planning');
  renderTab(c, 'execution');
  renderTab(c, 'analysis');
  const noticeHost = document.getElementById('modal-issues');
  if (noticeHost) noticeHost.innerHTML = crNotice + _conflictHtml(c);
  // Default tab
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === defaultTab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === `tab-${defaultTab}`));
  if (window.CampaignRules && CampaignRules.setEditMode) CampaignRules.setEditMode(false);
  $('modal-overlay').classList.add('open');
  _openCid = cid;
  _setUrlState(cid, defaultTab, push);
}
// 열려 있는 카드를 현재 데이터로 다시 그린다 (조치 배지 갱신용)
// 값 클릭 → 그 자리 편집 · 딥링크 행 추가·삭제. 저장은 카드(meta.json)로 곧장 간다.
document.addEventListener('click', function(e){
  const CR = window.CampaignRules;
  if (!CR || !CR.canEdit || !CR.canEdit()) return;

  const del = e.target.closest && e.target.closest('[data-dldel]');
  if (del) {
    const c = findCampaign(del.getAttribute('data-dldel'));
    const items = _dlItems(EXEC_DETAIL[c.id] || c.detail || {});
    items.splice(+del.getAttribute('data-i'), 1);
    _saveDeeplinks(c, items);
    return;
  }
  // 미확정 꼬리표를 눌러도 바로 앞 값이 열리게 한다 — 붙어 있는 한 덩어리로 보이기 때문이다.
  const tag = e.target.closest && e.target.closest('.cr-todo-tag');
  const el = tag ? tag.previousElementSibling
                 : (e.target.closest && e.target.closest('.cr-editable'));
  if (!el || !el.classList.contains('cr-editable') || !el.dataset.edit) return;
  if (!document.body.classList.contains('cr-editmode')) {
    // 조치가 필요한 자리는 눌리면 그대로 수정 모드로 들어간다.
    // 다 채워진 값은 읽는 화면에서 건드리지 않는다 — 수정 모드를 켜고 고친다.
    if (!el.classList.contains('cr-missing') && !el.classList.contains('cr-todo')) return;
    CR.setEditMode(true);
  }
  const c = findCampaign(el.dataset.cid);
  if (!c) return;
  if (el.dataset.sel) {
    // 보이는 이름과 고르는 이름을 같게 둔다. 상시는 종료일 유무로 갈리므로 목록에서도 둘로 나눈다.
    const doc = (CR.doc && CR.doc()) || {};
    const structs = (doc.structures && doc.structures.length ? doc.structures : ['단회', '분할', '상시']);
    const opts = el.dataset.sel === 'structure'
      ? structs.reduce(function(a, v){
          // 상시는 종료일 유무로 성격이 갈린다. 값은 하나지만 고를 때는 둘로 나눠 보여 준다.
          return a.concat(v === '상시'
            ? [{ value: '상시|endless', label: '상시 · 무기한' }, { value: '상시|period', label: '상시 · 기간 내' }]
            : [{ value: v, label: v }]);
        }, [])
      : el.dataset.sel === 'status'
      ? ['기획', '발송예정', '발송완료', '운영중', '운영완료']
      : el.dataset.sel === 'type'
      ? (doc.types && doc.types.length ? doc.types : ['Promo', 'Activation', 'Notice', 'Retention', 'Ad'])
      : el.dataset.sel === 'target'
      ? (doc.targets && doc.targets.length ? doc.targets : ['전체', '타겟', '신규', '액티브'])
      : (doc.mediums && doc.mediums.length ? doc.mediums : ['푸시', '인앱메시지', '알림톡', '문자', '이메일']);
    const current = el.dataset.sel === 'structure' && c.structure === '상시'
      ? (c.endDate && c.endDate !== c.sendDate ? '상시|period' : '상시|endless')
      : (el.dataset.value || '');
    el.dataset.value = current;
    CR.inlineSelect(el, opts, function(v){
      if (v.indexOf('상시|') === 0) {
        const endless = v === '상시|endless';
        const patch = { structure: '상시' };
        if (endless) patch.endDate = '';               // 무기한은 종료일이 없다
        else if (!c.endDate || c.endDate === c.sendDate) patch.endDate = c.sendDate;
        CampaignRules.saveDetail(campaignPath(c), patch).then(function(d){
          if (!d) return;
          _applySavedCard(c, d);
        });
        return;
      }
      _saveField(c, el.dataset.edit, v);
    });
    return;
  }
  if (el.dataset.fmt === 'date' || el.dataset.fmt === 'number') {
    CR.inlineInput(el, { type: el.dataset.fmt, placeholder: el.dataset.fmt === 'number' ? '숫자만' : '' },
      function(v){ _saveField(c, el.dataset.edit, v); });
    return;
  }
  if (el.dataset.list === 'concept') {
    // 묶음은 새로 지어도 되지만, 있는 이름을 고르면 보고서에서 같은 기획과 한 블록이 된다.
    CR.inlineInput(el, { type: 'text', placeholder: '묶음 이름', list: _conceptChoices(c) },
      function(v){
        if (!v) { alert('묶음 이름은 비울 수 없습니다'); refreshOpenCampaign(); return; }
        _saveField(c, el.dataset.edit, v);
      });
    return;
  }
  CR.inlineEdit(el, {
    wide: el.dataset.wide === '1',
    placeholder: el.dataset.edit === 'dl.url' ? 'parkingshare://…' : '값 입력',
    onSave: function(v){
      if (el.dataset.edit.indexOf('dl.') === 0) {
        const items = _dlItems(EXEC_DETAIL[c.id] || c.detail || {});
        const i = +el.dataset.i;
        if (!items[i]) items[i] = { label: '', url: '' };
        items[i][el.dataset.edit === 'dl.url' ? 'url' : 'label'] = v;
        _saveDeeplinks(c, items);
      } else {
        _saveField(c, el.dataset.edit, v);
      }
    },
  });
});

// 다른 카드들이 쓰는 묶음 이름 — 많이 쓰인 순. 지금 카드의 값은 뺀다.
function _conceptChoices(c){
  const n = {};
  (typeof CAMPAIGNS !== 'undefined' ? CAMPAIGNS : []).forEach(function(x){
    if (!x || x === c || x._reco) return;
    const v = String(x.concept || '').trim();
    if (v) n[v] = (n[v] || 0) + 1;
  });

// ===== 확대/축소/이동 가능한 라이트박스 =====
let _lbScale = 1, _lbX = 0, _lbY = 0, _lbDrag = null;
function _lbApply() {
  const img = $('lightbox-img');
  if (!img) return;
  img.style.transform = `translate(${_lbX}px, ${_lbY}px) scale(${_lbScale})`;
  const lbl = $('lb-zoom-label');
  if (lbl) lbl.textContent = _lbScale <= 1.001 ? '맞춤' : Math.round(_lbScale * 100) + '%';
  img.style.cursor = _lbScale > 1 ? (_lbDrag ? 'grabbing' : 'grab') : 'zoom-in';
}
function openLightbox(src) {
  _lbScale = 1; _lbX = 0; _lbY = 0; _lbDrag = null;
  $('lightbox-img').src = src;
  _lbApply();
  $('lightbox').classList.add('open');
}
function closeLightbox() { $('lightbox').classList.remove('open'); }
function lbZoom(d) {
  _lbScale = Math.min(6, Math.max(0.5, +(_lbScale + d).toFixed(2)));
  if (_lbScale <= 1) { _lbX = 0; _lbY = 0; }
  _lbApply();
}
function lbZoomReset() { _lbScale = 1; _lbX = 0; _lbY = 0; _lbApply(); }
(function _lbInit() {
  const stage = $('lightbox-stage'), img = $('lightbox-img'), overlay = $('lightbox');
  if (!stage || !img || !overlay) return;
  let downPos = null, moved = false;
  // 빈 공간 클릭 시 닫기 (이미지·툴바 클릭은 제외)
  stage.addEventListener('click', e => { if (e.target === stage) closeLightbox(); });
  // 이미지 한 번 클릭: 맞춤 ↔ 확대 토글 (드래그한 경우는 토글 안 함)
  img.addEventListener('click', e => {
    e.preventDefault();
    if (moved) { moved = false; return; }
    _lbScale > 1 ? lbZoomReset() : lbZoom(1);
  });
  // 휠 줌
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    lbZoom(e.deltaY < 0 ? 0.2 : -0.2);
  }, { passive: false });
  // 드래그 이동 (확대 상태에서만) — 클릭과 구분
  img.addEventListener('mousedown', e => {
    downPos = { x: e.clientX, y: e.clientY };
    moved = false;
    if (_lbScale <= 1) return;
    e.preventDefault();
    _lbDrag = { x: e.clientX - _lbX, y: e.clientY - _lbY };
    _lbApply();
  });
  window.addEventListener('mousemove', e => {
    if (downPos && (Math.abs(e.clientX - downPos.x) > 4 || Math.abs(e.clientY - downPos.y) > 4)) moved = true;
    if (!_lbDrag) return;
    _lbX = e.clientX - _lbDrag.x; _lbY = e.clientY - _lbDrag.y;
    img.style.transition = 'none';
    _lbApply();
  });
  window.addEventListener('mouseup', () => {
    downPos = null;
    if (_lbDrag) { _lbDrag = null; img.style.transition = ''; _lbApply(); }
  });
})();

// URL 파라미터(?cid=xxx&tab=planning|execution|analysis) 기반 캠페인 모달 자동 오픈 (딥링크)
function _autoOpenFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const cid = params.get('cid');
  if (!cid) return;
  const validTabs = new Set(['planning', 'execution', 'analysis']);
  const tabRaw = (params.get('tab') || 'planning').toLowerCase();
  const tab = validTabs.has(tabRaw) ? tabRaw : 'planning';
  openCampaign(cid, tab, false);
}

window.addEventListener('popstate', () => {
  const p = new URLSearchParams(window.location.search);
  const cid = p.get('cid');
  if (cid) {
    const vt = new Set(['planning', 'execution', 'analysis']);
    const tb = (p.get('tab') || 'planning').toLowerCase();

    $('modal-overlay').classList.remove('open');
  }
});

// 스윕(crm-analyze /sweep)은 매일 아침 08시에 돈다. 월요일 주기가 아니다 —
// 안내문이 '매주 월요일'이면 매일 실패 중인 캠페인도 다음 주까지 정상처럼 보인다(2026-07-29 메리츠화재).
function _nextSweepKST(){
  const now=new Date();
  const m=new Date(now); if (now.getHours() >= 8) m.setDate(now.getDate()+1);
  const w=['일','월','화','수','목','금','토'][m.getDay()];
  return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}(${w})`;
}
function _daysSince(s){ const d=new Date(s); return isNaN(d)?9999:Math.floor((Date.now()-d.getTime())/86400000); }
function analysisPendingMsg(c){
  if (c.status === '예정' || c.status === '발송예정')
    return `<div class="placeholder">발송 전입니다 — 발송 후 분석이 진행됩니다.</div>`;
  if (_daysSince(c.sendDate) <= 14)

  return `<div class="placeholder">분석용 원천 데이터 보관 기간(약 38일)이 지나 분석할 수 없는 과거 캠페인입니다.</div>`;
}
function renderAnalysis(c) {
  const path = CONVERSION_PATHS[c.id] || c.gcsPath || '';
  if (!path) {
    return analysisPendingMsg(c);
  }
  if (!CONVERSION_PATHS[c.id]) CONVERSION_PATHS[c.id] = path;  // 폴백 경로 캐시(merge 레이스 대비)
  const slot = `analysis-${c.id}`;

  return `<div id="${slot}"><div class="placeholder">분석 데이터 로딩 중...</div></div>`;

/* 분석 헤더 — 우상단 배지(마지막 분석·최종 예정) + 전환 기준 강조 바 (구 analysisStamp 대체) */
function _kstShort(s){
  // "2026-07-01 09:00 KST" → "7/1 09:00"
  const m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);
  return m ? `${+m[2]}/${+m[3]} ${m[4]}` : String(s || '');
}
// 측정 시간(시간 단위) — 결과 파일의 window_hours 가 먼저, 없으면 기준 문장에서 읽는다.
// 기준 문장이 '+3h' 에서 '3시간 안'으로 바뀐 뒤 '+Nh' 만 찾아 측정 기간이 '—'로 비었다(2026-10-02)
function _windowHours(j, basisTxt){
  const wh = j && j._meta && +j._meta.window_hours;
  if (wh > 0) return wh;
  const t = String(basisTxt || '');
  const m = t.match(/\+(\d+)h/) || t.match(/(\d+)\s*시간\s*안/);
  return m ? +m[1] : 0;
}
function _estimateFinalSweep(c, basisTxt, j){
  // 최종 분석 예정 시각 추정: 발송 시각 + 전환 윈도우 마감 후 첫 09:00 스윕
  try {
    if (c.ongoing) return null;
    const wh = _windowHours(j, basisTxt);
    const wm = wh ? [null, wh] : null;
    if (!wm) return null;
    const st = (((c.detail || {}).sendTime) || '').split('-')[0].trim();
    const tm = st.match(/^(\d{1,2}):(\d{2})$/);
    const base = new Date(`${c.sendDate}T${tm ? `${tm[1].padStart(2,'0')}:${tm[2]}` : '00:00'}:00`);
    if (isNaN(base)) return null;
    const end = new Date(base.getTime() + (+wm[1]) * 3600000);
    const sweep = new Date(end);
    sweep.setHours(9, 0, 0, 0);
    if (sweep <= end) sweep.setDate(sweep.getDate() + 1);
    const wd = ['일','월','화','수','목','금','토'][sweep.getDay()];
    return `${sweep.getMonth()+1}/${sweep.getDate()}(${wd}) 09:00`;
  } catch (e) { return null; }
}
function analysisHeader(c, j){
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const d = c.detail || {};
  const cb = (j && j._meta && j._meta.conversion_basis) || '';
  // 발송 시각 = 집계창 시작점. 스탯·스테퍼가 함께 쓴다
  const sd = (c.sendDate || '').split('-');
  const st = ((d.sendTime || '').split('-')[0] || '').trim();
  const hhmm = /^\d{1,2}:\d{2}$/.test(st) ? st : '';
  const sendDate = (sd.length === 3 ? `${+sd[1]}/${+sd[2]}` : '') + (hhmm ? ` ${hhmm}` : '');

  // ① 데이터 기간 스탯 — 집계 대상 구간(발송 시각 ~ +집계창)이지 분석을 돌린 날짜가 아니다.
  //    과거 캠페인은 사후에 채우므로 둘이 몇 달 벌어진다(세부 산식은 호버 툴팁).
  let stat = '', dataEndTxt = '';
  if (cb) {
    const h = _windowHours(j, cb);
    const dur = h ? ((h % 24 === 0) ? `${h / 24}일` : `${h}시간`) : '';
    const src = /BigQuery|빅쿼리/i.test(cb) ? '빅쿼리 기준' : (/Braze/i.test(cb) ? 'Braze 기준' : '');
    // 날짜를 큰 줄에, 시·분은 아래 줄에 둔다 — 스탯의 큰 숫자 위계를 지키면서 구간을 다 보여준다
    let val = dur || '—', timeTxt = '';
    if (h && sd.length === 3) {
      const [Y, M, D] = sd.map(Number);
      const [sh, sm] = (hhmm || '00:00').split(':').map(Number);
      const t0 = new Date(Date.UTC(Y, M - 1, D, sh, sm));       // UTC 연산 — 보는 사람 TZ에 흔들리지 않게
      const t1 = new Date(t0.getTime() + h * 3600 * 1000);
      const md = t => `${t.getUTCMonth() + 1}/${t.getUTCDate()}`;
      const tm = t => `${String(t.getUTCHours()).padStart(2, '0')}:${String(t.getUTCMinutes()).padStart(2, '0')}`;
      const sameDay = md(t0) === md(t1);

      // 여러 날짜에 걸치면 시작·종료 시각이 같아 "18:00 – 18:00"이 오타처럼 보인다 → 시작 시각만
      timeTxt = sameDay ? `${tm(t0)} – ${tm(t1)}` : `${tm(t0)} 시작`;
      dataEndTxt = `${md(t1)} ${tm(t1)}`;
    }
    const sub = [dur ? `${dur} 집계` : '', src].filter(Boolean).join(' · ');
    stat = `<div class="ac-stat" title="${e(cb)}"><div class="acs-label">측정 기간</div>` +
      `<div class="acs-val">${e(val)}</div>` +
      `${timeTxt ? `<div class="acs-time">${e(timeTxt)}</div>` : ''}` +
      `${sub ? `<div class="acs-src">${e(sub)}</div>` : ''}</div>`;
  }
  // ② 분석 진행 스테퍼 — 발송 → (중간 집계/자동 갱신) → 최종 분석, 현재 단계 펄스
  // 마지막 분석일: 메타 스탬프 없으면 conversion.json generated_at 폴백(데이터 있으면 '분석 대기' 오표기 방지)
  const genAt = (j && j._meta && j._meta.generated_at) ? j._meta.generated_at : '';
  const last = d.analysisLastAt ? _kstShort(d.analysisLastAt) : (genAt ? _kstShort(genAt) : '');
  const isFinal = !!d.analysisFinal || d.analysisStage === '최종';
  // 상시/운영중(종료일이 발송일과 다른 진행 캠페인 or ongoing) → 최종 없이 '매일 갱신', 종료일 있으면 '종료 후 최종'
  const isLong = !!(c.endDate && c.endDate !== c.sendDate);
  const running = !!c.ongoing || c.status === '진행중' || c.status === '운영중';
  const ongoing = !!c.ongoing || (isLong && running);
  const steps = [{ name: '발송', date: sendDate, cls: 'done' }];
  if (ongoing) {
    steps.push({ name: '매일 자동 갱신', date: last, cls: 'done cur' });
    if (isLong) {  // 종료일 지정된 상시 → 종료 후 최종. 종료일 없으면 최종 단계 자체를 안 그림
      const ed = (c.endDate || '').split('-');
      const endTxt = ed.length === 3 ? `${+ed[1]}/${+ed[2]}` : '';
      steps.push({ name: '종료 후 최종', date: endTxt ? `${endTxt} 이후` : '', cls: 'todo' });
    }
  } else if (isFinal) {
    // 날짜는 '데이터가 어디까지 담겼나'(집계 종료)를 쓴다. 분석을 돌린 시각은 툴팁으로만 —
    // 사후 분석한 과거 캠페인에서 실행일을 그대로 쓰면 데이터가 최신인 것처럼 읽힌다.
    steps.push({ name: '최종 분석 완료', date: dataEndTxt || last, cls: 'fin', check: true,
                 title: last ? `분석 실행 ${last}` : '' });
  } else if (last) {
    steps.push({ name: '중간 집계', date: last, cls: 'done cur' });
    const fin = _estimateFinalSweep(c, cb, j);
    steps.push({ name: '최종 분석', date: fin ? `${fin} 예정` : '', cls: 'todo' });
  } else {
    steps.push({ name: '분석 대기', date: '', cls: 'todo cur' });
    const fin = _estimateFinalSweep(c, cb, j);
    steps.push({ name: '최종 분석', date: fin ? `${fin} 예정` : '', cls: 'todo' });
  }
  const stepHtml = steps.map((s, i) => {
    const dot = `<div class="dot">${s.check ? '✓' : ''}</div>`;
    const el = `<div class="acstep ${s.cls}"${s.title ? ` title="${e(s.title)}"` : ''}>${dot}<div class="s-name">${e(s.name)}</div><div class="s-date">${e(s.date)}</div></div>`;
    if (i === 0) return el;
    const lineDone = /done|fin/.test(s.cls) ? ' done' : '';
    return `<div class="acline${lineDone}"></div>` + el;
  }).join('');
  const stepper = steps.length > 1 ? `<div class="ac-steps">${stepHtml}</div>` : '';
  return (stat || stepper) ? `<div class="an-head">${stat}${stepper}</div>` : '';
}
function renderGoalSection(c, j, n){

  // (2026-10-02 이전 결과 파일에 무관한 쿠폰이 0 줄로 남아 있다)
  if (g.auto_detected) {
    const bc = (g.by_coupon || []).filter(x => x.reg || x.use);
    if (!bc.length) return '';
    g = {...g, by_coupon: bc};
  }
  const e = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const send = g.send || 0, sendCg = g.send_cg || 0, hasCg = !!g.has_cg;
  const tot = g.total || {reg:0, buy:0, buy_cg:0, use:0, use_cg:0};
  const r = (a, b) => b ? (100*a/b).toFixed(2)+'%' : '0.00%';

  // ── 공유 쿠폰 클러스터: 깨끗한 창 A/B — 실험군/대조군/증분 3열(발급·사용 유저별 실측) ──
  if (g.attribution === 'clean_window_ab'){

    const inc = (tg, cg) => Math.round(tg - (sendCg ? cg*send/sendCg : 0));            // 순증(절대)
    const incCell = (tg, cg) => `${sgn(inc(tg,cg))} <span class="bz">${sgn(pp(tg,cg).toFixed(3))}%p</span>`;
    const row = (label, tg, cg, showInc) =>
      `<tr><td>${label}</td><td class="cnt">${num(tg)}</td><td class="cnt">${num(cg)}</td><td class="rtc">${showInc ? incCell(tg,cg) : '—'}</td></tr>`;
    const fn = `<table><thead><tr><th>단계</th><th class="cnt">실험군</th><th class="cnt">대조군</th><th class="rtc">증분(순증·%p)</th></tr></thead><tbody>`
      + row('발송', send, sendCg, false)
      + row('발급', tot.reg||0, tot.reg_cg||0, true)
      + row('사용', tot.use||0, tot.use_cg||0, true)
      + `</tbody></table>`;
    const rows = (g.by_coupon || []).map(x =>
      `<tr><td>${e(x.label)} <span class="bz">${x.id}</span></td><td class="cnt">${num(x.reg)}</td><td class="cnt">${num(x.use)}</td><td class="rtc">${r(x.use, x.reg)}</td></tr>`).join('');
    const by = rows ? `<div style="margin-top:8px;font-size:13px;font-weight:700;color:#374151">${e(g.group_label || '자치구별')} (이 캠페인 발송 유저)</div><table><thead><tr><th>쿠폰</th><th class="cnt">발급</th><th class="cnt">사용</th><th class="rtc">사용률</th></tr></thead><tbody>${rows}</tbody></table>` : '';
    const note = `<div class="subnote">회원마다 다음 위클리 캠페인을 받기 전까지만 세어 실험군과 대조군을 같은 조건으로 비교</div>`;
    return `<h4>${n}. 목표 행동 전환 (쿠폰 발급·사용)</h4>${fn}${by}${note}<div class="subnote">출처: 자사 쿠폰·결제 DB</div>`;
  }

  // ── 단독/비공유 쿠폰: 발급=전체 카운터, 사용=발송 유저 필터 ──
  // 보유 쿠폰 사용 유도(신규 발급 없음)는 발급이 늘 0 이라 발급 줄·칸을 그리지 않는다(2026-10-02 명절 후 세차 독려)

  const usePp = pp(tot.use||0, tot.use_cg||0);
  const fn = `<table><thead><tr><th>단계</th><th class="cnt">유저수</th><th class="rtc">${e(g.send_label || '발송')} 대비</th></tr></thead><tbody>`

    + (held ? '' : `<tr><td>발급</td><td class="cnt">${regCell}</td><td class="rtc">${regRate}</td></tr>`)

    + `</tbody></table>`;
  const ppNote = hasCg
    ? `<div class="subnote">대조군(${num(sendCg)}명) 대비 <b>사용 증분 ${sgn(usePp)}%p</b></div>`
    : '';
  const rows = (g.by_coupon || []).map(x => held
