<script>
// 체험판: 서버 요청을 같은 폴더의 예시 데이터(mock.json)로 돌려준다. 저장·수정 요청은 저장하지 않고 성공만 응답한다.
(function () {
  var BASE = location.pathname.replace(/[^/]*$/, '');
  // 체험판은 매번 처음 화면에서 시작한다. 이전에 보던 화면·선택을 복원하지 않는다
  try { sessionStorage.clear(); localStorage.clear(); } catch (e) {}
  try {
    var x = new XMLHttpRequest();
    x.open('GET', BASE + 'mock.json?v=' + Date.now(), false);
    x.send(null);
    window.__MOCK = JSON.parse(x.responseText);
  } catch (e) { window.__MOCK = {}; }
  var M = window.__MOCK;
  var realFetch = window.fetch.bind(window);
  function resp(obj, status) {
    return Promise.resolve(new Response(typeof obj === 'string' ? obj : JSON.stringify(obj), {
      status: status || 200, headers: { 'Content-Type': 'application/json' }
    }));
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = ((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    var path = url;
    try { var u = new URL(url, location.href); if (u.origin === location.origin) path = u.pathname.replace(BASE, '/') + u.search; } catch (e) {}
    var p = path.split('?')[0];
    try { p = decodeURIComponent(p); } catch (e) {}
    if (p.indexOf('/api/') === 0 && method !== 'GET') return resp({ ok: true, demo: true, message: '체험판에서는 저장되지 않습니다' });
    if (p.indexOf('/data/') === 0) { return p in M ? resp(M[p]) : resp({ ok: false }, 404); }
    if (p.indexOf('/gcs/') === 0) { return p in M ? fetch(M[p]) : resp({ ok: false }, 404); }
    if (p.indexOf('/api/') === 0) { return p in M ? resp(M[p]) : resp({ ok: true, demo: true, items: [], rows: [], candidates: [] }); }
    if (p.indexOf('/doc/') === 0) return resp({ ok: false, demo: true }, 404);
    return realFetch(input, init);
  };
  var st = document.createElement('style');
  st.textContent = '@media(max-width:760px){#modal-title{flex-wrap:wrap!important;align-items:center;gap:8px 6px;padding-right:28px}#modal-title .mt-name{flex:0 0 100%;word-break:keep-all}#modal-title .status-badge{flex-shrink:0;margin-left:0!important;white-space:nowrap}#modal-title .cr-modebtn{flex-shrink:0;margin-left:0!important;white-space:nowrap}.modal table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}}[data-edit="detail.audience"],[data-edit="detail.plannedAudience"],#tab-analysis table td:not(:first-child),#tab-analysis .an-send-card b,#tab-analysis .an-send-card strong,#tab-analysis .an-head b{filter:blur(4.5px);user-select:none}';
  document.documentElement.appendChild(st);
  document.addEventListener('DOMContentLoaded', function () {
    // 하단 안내: 한 줄로 짧게, 몇 초 뒤 사라진다
    var b = document.createElement('div');
    b.textContent = '체험판 · 수치는 임의 값이며 저장·발송되지 않습니다';
    b.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99999;background:rgba(17,17,17,.86);color:#fff;font:600 12px/1.4 Pretendard,-apple-system,sans-serif;padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;transition:opacity .6s';
    document.body.appendChild(b);
    setTimeout(function () { b.style.opacity = '0'; }, 6000);
    // 체험판에 데이터가 없는 화면은 흐리게 두고 열지 않는다
    var OFF = ['앱 배너 운영', '쿠폰 운영', '퍼포먼스 마케팅'];
    var st2 = document.createElement('style');
    st2.textContent = '.demo-off{opacity:.42;cursor:not-allowed!important}.demo-off .desc{visibility:hidden}.demo-off-tag{position:absolute;left:16px;bottom:12px;font:700 10px/1 Pretendard,-apple-system,sans-serif;color:#9aa0a6;letter-spacing:.02em}';
    document.head.appendChild(st2);
    document.querySelectorAll('.nm').forEach(function (n) {
      if (OFF.indexOf(n.textContent.trim()) < 0) return;
      var card = n.parentElement;
      card.classList.add('demo-off');
      if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
      var t = document.createElement('span'); t.className = 'demo-off-tag'; t.textContent = '체험판 미제공'; card.appendChild(t);
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.demo-off')) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
  });
})();

</script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #fafafb;
  --bg-card: #ffffff;
  --bg-sidebar: #18181b;
  --bg-sidebar-hover: #27272a;
  --text-primary: #18181b;
  --text-secondary: #71717a;
  --text-muted: #a1a1aa;
  --text-sidebar: #a1a1aa;
  --text-sidebar-active: #fafafa;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --success: #059669;
  --success-soft: #d1fae5;
  --warning: #d97706;
  --warning-soft: #fef3c7;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --info: #0891b2;
  --info-soft: #cffafe;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --shadow: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.06);
  --radius: 8px;
}
html, body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  font-feature-settings: "tnum" 1, "lnum" 1;
  font-variant-numeric: tabular-nums;
}
body {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
  transition: grid-template-columns 0.25s ease;
}
body.sidebar-collapsed {
  grid-template-columns: 0 minmax(0, 1fr);
}
body.sidebar-collapsed .sidebar {
  transform: translateX(-260px);
}
.sidebar { transition: transform 0.25s ease; }

/* SIDEBAR */
.sidebar {
  background: var(--bg-sidebar);
  color: var(--text-sidebar);
  padding: 20px 0;
  overflow-y: auto;
  height: 100vh;
  position: sticky;
  top: 0;
}
.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid #27272a;
  position: relative;
}
.sidebar-header h1 {
  font-size: 15px;
  color: #fff;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.sidebar-collapse-btn {
  position: absolute;
  right: 14px;
  top: -4px;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.sidebar-collapse-btn:hover { background: var(--bg-sidebar-hover); color: #fff; }
.sidebar-expand-btn {
  position: fixed;
  left: 12px;
  top: 14px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 16px;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 30;
  box-shadow: var(--shadow);
}
.sidebar-expand-btn:hover { border-color: var(--text-primary); }
body.sidebar-collapsed .sidebar-expand-btn { display: flex; }
.sidebar-search {
  padding: 12px 16px 0;
}
.sidebar-search input {
  width: 100%;
  background: #27272a;
  border: 1px solid #3f3f46;
  color: #fff;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  outline: none;
}
.sidebar-search input::placeholder { color: #71717a; }
.sidebar-search input:focus { border-color: #52525b; }
.sidebar-tree { padding: 12px 0; }
.tree-month {
  padding: 4px 16px 4px 28px;
  font-size: 12px;
  color: var(--text-sidebar);
  cursor: pointer;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tree-month:hover { background: var(--bg-sidebar-hover); color: #fff; }
.tree-month .count {
  font-size: 10px;
  background: #27272a;
  padding: 1px 6px;
  border-radius: 8px;
  color: #71717a;
}
.tree-year {
  padding: 8px 16px;
  font-size: 11px;
  color: #71717a;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tree-year:hover { color: #fff; }
.tree-year .count {
  font-size: 10px;
  font-weight: 500;
  color: #71717a;
}
.tree-week {
  padding: 4px 16px 4px 40px;
  font-size: 12px;
  color: var(--text-sidebar);
  cursor: pointer;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tree-week:hover { background: var(--bg-sidebar-hover); color: #fff; }
.tree-week .count {
  font-size: 10px;
  background: #27272a;
  padding: 1px 6px;
  border-radius: 8px;
  color: #71717a;
}
.tree-campaign {
  padding: 4px 16px 4px 52px;
  font-size: 11px;
  color: #a1a1aa;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-campaign:hover { background: var(--bg-sidebar-hover); color: #fff; }
.tree-campaign.active { background: var(--accent); color: #fff; }
.tree-collapsed > .tree-week, .tree-collapsed > .tree-campaign { display: none; }
.tree-week.tree-collapsed + .tree-campaigns { display: none; }
.tree-arrow { font-size: 10px; }

/* MAIN */
.main {
  padding: 24px 32px;
  max-width: 1400px;
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
  margin-left: auto;
  margin-right: auto;
}
.main-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  gap: 32px;
  flex-wrap: wrap;
}
.main-header .header-left { min-width: 0 }
.main-header h2 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.025em;
}
.main-header p {
  color: var(--text-secondary);
  margin-top: 4px;
  font-size: 12.5px;
}
.header-stats {
  display: flex;
  gap: 28px;
  align-items: center;
  flex-wrap: wrap;
}
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat-lbl {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.stat.live .stat-lbl { color: var(--info); }
.stat.hot .stat-lbl { color: var(--warning); }
.stat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  display: inline-block;
}
.stat.live .stat-dot { animation: dot-pulse-strong 1.4s ease-in-out infinite; }
.stat.hot .stat-dot { animation: dot-pulse-strong 1.8s ease-in-out infinite; }
.stat-v {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--text-primary);
}
.stat.live .stat-v { color: var(--info); }
.stat.hot .stat-v { color: var(--warning); }

/* 펄싱 강화 — glow + 큰 scale + opacity 폭 */
@keyframes dot-pulse-strong {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
    box-shadow: 0 0 0 0 currentColor;
  }
  50% {
    transform: scale(1.6);
    opacity: 0.6;
    box-shadow: 0 0 10px 2px currentColor;
  }
}

/* KPI cards — Newspaper Editorial v6.1
   강조 우선순위: 진행 중(hero) > 이번 주 예정(컬러) > 누적·완료(일반) */
.kpi-grid {
  display: grid;
  grid-template-columns: 1.4fr 1.2fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}
.kpi-card {
  background: var(--bg-card);
  padding: 20px 22px;
  border-radius: 14px;
  border: 1px solid var(--border);
  position: relative;
  transition: transform 0.2s, border-color 0.2s;
  cursor: default;
}
.kpi-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
}

/* 진행 중 = 검은 hero */
.kpi-card.kpi-active {
  background: var(--bg-sidebar);
  color: #fff;
  border-color: var(--bg-sidebar);
}
.kpi-card.kpi-active:hover {
  background: var(--bg-sidebar-hover);
  border-color: var(--bg-sidebar-hover);
}
.kpi-card.kpi-active .label { color: #67e8f9; }
.kpi-card.kpi-active .value { color: #fff; font-size: 34px; }
.kpi-card.kpi-active .sub { color: var(--text-muted); }

/* 이번 주 예정 = 옅은 노란 강조 */
.kpi-card.kpi-upcoming {
  background: #fffbeb;
  border-color: #fde68a;
}
.kpi-card.kpi-upcoming:hover {
  border-color: #fcd34d;
}
.kpi-card.kpi-upcoming .label { color: #92400e; }
.kpi-card.kpi-upcoming .value { color: var(--warning); font-size: 30px; }

.kpi-card .label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.kpi-card .value {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.025em;
  line-height: 1;
  margin-top: 12px;
}
.kpi-card .sub {
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-top: 10px;
  font-weight: 500;
}
.kpi-card .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.kpi-card.kpi-active .dot { background: #67e8f9; animation: pulse-soft 1.6s ease-in-out infinite; }
.kpi-card.kpi-upcoming .dot { background: var(--warning); animation: pulse-soft 2.2s ease-in-out infinite; }
.kpi-card.kpi-total .dot { background: var(--accent); }
.kpi-card.kpi-done .dot { background: var(--success); }

@keyframes pulse-soft {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(1.35); }
}

/* Section */
.section {
  margin-bottom: 32px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}
.section-header h3 {
  font-size: 16px;
  font-weight: 600;
}
.section-header .hint {
  font-size: 12px;
  color: var(--text-secondary);
}

/* Card news — Newspaper Editorial v5 */
.card-strip {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 0 10px;
  scroll-snap-type: x mandatory;
}
.card-strip::-webkit-scrollbar { height: 6px; }
.card-strip::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
.news-card {
  flex: 0 0 300px;
  background: var(--bg-card);

  border-radius: 14px;

  flex-direction: column;
  min-height: 200px;

}
.news-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
.news-card.featured { flex: 0 0 380px; }
.news-card.featured.dark {
  background: var(--bg-sidebar);
  color: #fff;
  border-color: var(--bg-sidebar);
}
.news-card.featured.dark:hover {
  background: var(--bg-sidebar-hover);
  border-color: var(--bg-sidebar-hover);
}
.news-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  min-height: 22px;
}
.news-status {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.news-status::before {

  height: 6px;
  border-radius: 50%;
  background: currentColor;

}
.news-card.featured.dark .news-status { color: #fbbf24; }

}
.news-card.live .news-status { color: var(--info); }

  animation: dot-pulse-strong 1.4s ease-in-out infinite;

.news-card.upcoming .news-status { color: var(--warning); }
.news-card.upcoming .news-status::before {
  width: 8px; height: 8px;
  animation: dot-pulse-strong 1.8s ease-in-out infinite;
}
.news-countdown {
  font-size: 11px;

}

  background: rgba(251,191,36,0.15);
  color: #fbbf24;
}
.news-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.25;
  margin-bottom: 6px;
}
.news-card.featured .news-title {
  font-size: 24px;
  letter-spacing: -0.035em;
  line-height: 1.15;
}
.news-tagline {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: auto;
}
.news-card.featured.dark .news-tagline { color: var(--text-muted); }
.news-foot {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid #f0f0f2;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 11.5px;
  color: var(--text-secondary);
}
.news-card.featured.dark .news-foot {
  border-top-color: rgba(255,255,255,0.1);
  color: var(--text-muted);
}
.news-foot .item { display: flex; align-items: center; gap: 5px; }
.news-foot .item::before {
  content: '';
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--border-strong);
}
.news-foot .item:first-child::before { display: none; }
.news-foot strong { color: var(--text-primary); font-weight: 700; }
.news-card.featured.dark .news-foot strong { color: #fff; }
.empty-strip {
  background: var(--bg-card);
  padding: 24px;
  border-radius: var(--radius);
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

/* Calendar */
.cal-view-toggle {
  display: inline-flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px;
}
.cal-toggle-btn {
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  background: transparent;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-secondary);
}
.cal-toggle-btn.active {
  background: var(--bg-card);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.cal-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cal-nav-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  color: var(--text-primary);
  line-height: 1;
}
.cal-nav-btn:hover { border-color: var(--text-primary); }
.cal-period-label {
  font-size: 14px;
  font-weight: 600;
  min-width: 180px;
  text-align: center;
}
.cal-today-btn {
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-secondary);
  margin-left: 4px;
}
.cal-today-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }

.calendar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.cal-weekday {
  padding: 8px 0;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}
.cal-weekday.sun { color: #dc2626; }
.cal-weekday.sat { color: #2563eb; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
}
.cal-grid.month { grid-auto-rows: minmax(96px, auto); }
.cal-grid.week { grid-auto-rows: minmax(180px, auto); }
.cal-day {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 8px;
  position: relative;
  cursor: pointer;
  transition: background 0.12s;
  overflow: hidden;
}
.cal-day:hover { background: #fafafa; }
.cal-day:nth-child(7n) { border-right: none; }
.cal-day.other-month { background: #fafafa; opacity: 0.55; }
.cal-day.today { background: #eff6ff; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-day-num {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.cal-day-num.sun { color: #dc2626; }
.cal-day-num.sat { color: #2563eb; }
.cal-event {
  font-size: 10px;
  padding: 2px 6px;
  margin-bottom: 2px;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  border-left: 2px solid var(--accent);
  transition: filter 0.12s;
}
.cal-event:hover { filter: brightness(0.92); }
.cal-event.medium-인앱메시지 {
  background: #ecfeff; color: #0891b2; border-left-color: #0891b2;
}
.cal-event.medium-알림톡 {
  background: #fef3c7; color: #b45309; border-left-color: #b45309;
}
.cal-event.medium-LMS {
  background: #fce7f3; color: #be185d; border-left-color: #be185d;
}
.cal-event.medium-문자 {
  background: #fce7f3; color: #be185d; border-left-color: #be185d;
}
.cal-event.medium-쿠폰 {
  background: #f3e8ff; color: #7c3aed; border-left-color: #7c3aed;
}
.cal-event.dim { opacity: 0.3; }
.cal-event-more {
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  margin-top: 2px;
}

/* Week view detail */
.cal-grid.week .cal-day {
  min-height: 200px;
}
.cal-grid.week .cal-event {
  padding: 5px 8px;
  margin-bottom: 4px;
  font-size: 11px;
  border-radius: 6px;
}

/* Grid controls (year filter + search) */
.grid-controls {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 0 1 320px;
}
.search-input {
  width: 100%;
  padding: 6px 30px 6px 12px;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s;
  background: var(--bg-card);
}
.search-input:focus { border-color: var(--text-primary); }
.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-secondary);
  border: none;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.search-clear:hover { background: var(--border-strong); color: var(--text-primary); }
.search-clear.visible { display: flex; }

/* Lightbox */
.lightbox-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 200;
  cursor: zoom-out;
  padding: 24px;
}
.lightbox-overlay.open { display: flex; flex-direction: column; }
.lightbox-stage {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  touch-action: none;
}
.lightbox-stage img {
  max-width: 92vw;
  max-height: 86vh;
  object-fit: contain;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transform-origin: center center;
  transition: transform 0.08s ease-out;
  cursor: zoom-in;
  user-select: none;
}
.lightbox-toolbar {
  position: fixed;
  top: 16px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(20,20,22,0.72);
  padding: 6px 8px;
  border-radius: 999px;
  z-index: 210;
  backdrop-filter: blur(6px);
}
.lightbox-toolbar button {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.lightbox-toolbar button:hover { background: rgba(255,255,255,0.24); }
.lightbox-toolbar #lb-zoom-label {
  color: #fff;
  font-size: 12px;
  min-width: 42px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.lightbox-toolbar .lightbox-close { font-size: 20px; margin-left: 4px; }
.push-preview-img {
  cursor: zoom-in;
  transition: opacity 0.15s, transform 0.15s;
}
.push-preview-img:hover { opacity: 0.92; transform: scale(1.01); }
.empty-result {
  background: var(--bg-card);
  padding: 28px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  border-radius: var(--radius);
  border: 1px dashed var(--border);
}
.week-cell.dim {
  opacity: 0.35;
  background: var(--bg);
}
.week-cell.dim .week-count { color: var(--text-muted); font-weight: 400; }
.week-cell.match {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.week-cell.match .week-count { color: var(--accent); }
.week-cell.selected.match { box-shadow: 0 0 0 1px var(--text-primary); }
.medium-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.medium-pill {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.medium-pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
/* 지운 카드(삭제 보관) — CRM 요청 삭제·반려로 옮겨진 카드. 사유·삭제자와 함께 본다 */
#deleted-toggle { margin-left: 4px; }
.deleted-list { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); margin-bottom: 16px; }
.deleted-list .dl-row { display: grid; grid-template-columns: minmax(0,1.6fr) 90px minmax(0,2fr) 130px; gap: 10px; padding: 9px 14px; font-size: 12px; border-bottom: 1px solid var(--border); align-items: baseline; }
.deleted-list .dl-row:last-child { border-bottom: 0; }
.deleted-list .dl-head { color: var(--text-secondary); font-size: 11px; font-weight: 500; }
.deleted-list .dl-name { font-weight: 600; color: var(--text-primary); overflow-wrap: anywhere; }
.deleted-list .dl-sub { color: var(--text-secondary); }
.deleted-list .dl-name, .deleted-list .dl-meta { display: block; }
.deleted-list .dl-empty { padding: 14px; font-size: 12px; color: var(--text-secondary); }
@media (max-width: 640px) { .deleted-list .dl-row { grid-template-columns: 1fr; gap: 2px; } .deleted-list .dl-head { display: none; } }
.medium-pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
/* Year filter pills */
.year-filter {
  display: flex;
  gap: 6px;
  margin-bottom: 0;
}
.year-pill {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.year-pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
.year-pill.active {
  background: var(--text-primary);
  color: #fff;
  border-color: var(--text-primary);
}

/* Week grid - compact */
.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 6px;
}
.week-cell {
  background: var(--bg-card);
  padding: 10px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.12s;
  text-align: center;
  position: relative;
}
.week-cell:hover {
  border-color: var(--text-primary);
}
.week-cell.selected {
  background: var(--text-primary);
  border-color: var(--text-primary);
}
.week-cell.selected .week-label { color: rgba(255,255,255,0.7); }
.week-cell.selected .week-count { color: #fff; }
.week-cell .week-label {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 4px;
}
.week-cell .week-count {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1;
}

/* Week detail */
.week-detail {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 14px;
  box-shadow: var(--shadow);
  display: none;
}
.week-detail.open { display: block; }
.week-detail h4 {
  font-size: 15px;
  margin-bottom: 12px;
}
/* v8 톤 통일 — campaign-list */
.campaign-list { display: flex; flex-direction: column; gap: 10px; }
.campaign-item {
  padding: 16px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  transition: border-color 0.15s, transform 0.15s;
}
.campaign-item:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.campaign-item .info { flex: 1; min-width: 0 }
.campaign-item .name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin-bottom: 4px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.campaign-item .meta {
  font-size: 11.5px;
  color: var(--text-secondary);
  font-weight: 500;
  letter-spacing: -0.005em;
}
.status-badge {
  font-size: 10.5px;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 700;
  letter-spacing: 0.04em;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.status-badge::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.status-완료 { background: #f0fdf4; color: var(--success) }
/* 발송일이 지났는데 카드가 아직 '발송예정' — 나갔는지 확인이 필요한 상태 */
.status-확인필요 { background: #fef2f2; color: var(--danger, #dc2626) }
.status-확인필요::before { animation: dot-pulse-strong 1.6s ease-in-out infinite }
.status-진행중 { background: #ecfeff; color: var(--info) }
.status-진행중::before { animation: dot-pulse-strong 1.6s ease-in-out infinite }
.status-예정 { background: #fffbeb; color: var(--warning) }
.status-예정::before { animation: dot-pulse-strong 2s ease-in-out infinite }
.status-기획중 { background: #f3e8ff; color: #7c3aed }
.status-기획중::before { animation: dot-pulse-strong 1.7s ease-in-out infinite }
.status-폐기 { background: #f4f4f5; color: var(--text-secondary) }
.status-폐기::before { display: none }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px 32px;
  position: relative;
}
.modal-close {
  position: absolute;
  right: 16px;
  top: 16px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-secondary);
}
.modal h3 {
  font-size: 20px;
  margin-bottom: 6px;
  padding-right: 30px;
}
.modal .modal-meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 18px;
}
.tabs {
  display: flex;
  gap: 6px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 18px;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.tab-content h4 {
  font-size: 14px;
  margin-bottom: 8px;
  margin-top: 16px;
}
.tab-content h4:first-child { margin-top: 0; }
.tab-content p, .tab-content li {
  font-size: 13px;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.tab-content ul, .tab-content ol { padding-left: 22px; }
.tab-content code {
  background: #f3f4f6;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 12px;
  font-family: "JetBrains Mono", Consolas, monospace;
}
.tab-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 12px;
}
.tab-content th, .tab-content td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
}
.tab-content th { background: #f9fafb; font-weight: 600; }
.tab-content .placeholder {
  background: #fafbff;
  border: 1px dashed var(--border);
  padding: 16px;
  border-radius: 8px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
}

/* Mobile */
.menu-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 50;
  background: var(--bg-sidebar);
  color: #fff;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
}
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: -260px;
    width: 260px;
    z-index: 40;
    transition: left 0.25s;
  }
  .sidebar.open { left: 0; }
  .menu-toggle { display: flex; align-items: center; justify-content: center; }
  /* 좁은 화면에서 사이드바는 서랍이라 접기 개념이 없다. CRM 요청 화면이 desktop 용으로 거는
     접기 상태(body.sidebar-collapsed)가 여기까지 새면 ☰ 와 ≡ 가 겹쳐 뜨고, 열기 버튼 자리를
     비우려던 제목 들여쓰기 44px 가 남아 제목만 혼자 밀려 보인다. 서랍 동작만 남긴다. */
  body.sidebar-collapsed { grid-template-columns: 1fr; }
  body.sidebar-collapsed .sidebar { transform: none; }
  body.sidebar-collapsed .sidebar-expand-btn { display: none; }
  body.sidebar-collapsed .main-header .header-left { padding-left: 0; }
  .main { padding: 60px 16px 24px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .week-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .modal { padding: 20px 18px; max-height: 95vh; }
  .news-card { flex: 0 0 240px; }
}
@media (max-width: 480px) {
  .main-header h2 { font-size: 19px; }
  .kpi-card .value { font-size: 22px; }
}

/* ═══════════════════════════════════════════════════
   v8 — α Bento + KPI 2x2 + 4 Category mini cards
   ═══════════════════════════════════════════════════ */

/* α 메인 (좌 hero + 우 KPI 2x2) */
.A-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; margin-bottom: 12px }
.A-hero {
  background: var(--bg-sidebar); color: white; border-radius: 16px; padding: 26px 28px;
  display: flex; flex-direction: column; min-height: 300px; position: relative; overflow: hidden;
  cursor: pointer; transition: background 0.15s;
}
.A-hero:hover { background: var(--bg-sidebar-hover) }
.A-hero::after {
  content: ''; position: absolute; top: -40%; right: -10%; width: 60%; height: 80%;
  background: radial-gradient(circle, rgba(251,191,36,0.16) 0%, transparent 60%); pointer-events: none;
}
.A-hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; position: relative }
.A-hero-top .status-tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: #fbbf24; display: inline-flex; align-items: center; gap: 8px;
}
.A-hero-top .status-tag::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor;
  animation: dot-pulse-strong 1.4s ease-in-out infinite;
}
.A-hero-top .countdown {
  background: rgba(251,191,36,0.18); color: #fbbf24; font-size: 12px; padding: 5px 12px;
  font-weight: 700; border-radius: 6px; letter-spacing: 0.04em;
}
.A-hero h1 {
  font-size: 32px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.12;
  margin-bottom: 10px; position: relative; font-family: 'Pretendard Variable';
}
.A-hero .lede {
  font-size: 13.5px; color: var(--text-muted); line-height: 1.55; max-width: 90%;
  margin-bottom: auto; position: relative; font-weight: 400;
}
.A-hero-foot {
  margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12px; color: var(--text-muted); position: relative;
}
.A-hero-foot .it strong { color: white; font-weight: 700; display: block; font-size: 15px; margin-bottom: 2px; letter-spacing: -0.015em }

/* 우측 KPI 2x2 (C안 Inline Baseline) */
.A-kpi-2x2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr; gap: 10px }
.A-kpi {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 22px 20px; display: flex; flex-direction: column; justify-content: space-between;
  transition: border-color 0.15s; min-height: 140px; min-width: 0;
}
.A-kpi:hover { border-color: var(--border-strong) }
.A-kpi .l { font-size: 15px; font-weight: 700; letter-spacing: -0.015em; display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; white-space: nowrap }
.A-kpi .l::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.A-kpi.cum .l { color: var(--text-primary) }
.A-kpi.cum .l::before { background: #71717a }
.A-kpi.done .l { color: var(--success) }
.A-kpi.live .l { color: var(--info) }
.A-kpi.live .l::before { animation: dot-pulse-strong 1.4s ease-in-out infinite }
.A-kpi.next .l { color: var(--warning) }
.A-kpi.next .l::before { animation: dot-pulse-strong 1.8s ease-in-out infinite }
.A-kpi .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; margin-top: auto }
.A-kpi .sub { font-size: 11px; color: var(--text-secondary); font-weight: 500; letter-spacing: -0.005em }
.A-kpi .v {
  font-size: 44px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95;
  font-family: 'Inter', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
  font-feature-settings: "ss01" 1, "tnum" 1;
  font-variant-numeric: tabular-nums;
}
.A-kpi .v .unit, .A-kpi .v span {
  font-family: 'Inter', 'Pretendard Variable', sans-serif;
}
.A-kpi.cum .v { color: var(--text-primary) }
.A-kpi.done .v { color: var(--success) }
.A-kpi.live .v { color: var(--info) }
.A-kpi.next .v { color: var(--warning) }
.A-kpi .v .unit { font-size: 13px; font-weight: 500; margin-left: 3px; letter-spacing: -0.01em; opacity: 0.55; font-family: 'Pretendard Variable', -apple-system, sans-serif }

/* 하단 4 카테고리 미니 카드 */
/* 격자 폭 균일 최우선: minmax(0,·)로 트랙 자동 최소값을 0으로 고정해
   긴 캠페인명이 특정 칸을 밀어내고 다른 칸을 찌그러뜨리는 것을 막는다.
   auto-fit이라 분할 화면처럼 좁아지면 뷰포트가 아닌 실제 컨테이너 폭 기준으로 칸 수가 줄고,
   남는 칸은 접혀 항상 같은 폭으로 재분배된다. */
.A-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 28px }
.A-mini {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 20px; min-height: 168px; box-sizing: border-box; cursor: default; transition: border-color 0.15s;
  min-width: 0; overflow: hidden;
}
.A-mini:hover { border-color: var(--border-strong) }
.A-mini .head {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
}
.A-mini .head .name {
  font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap; flex-shrink: 0;  /* 한글은 글자 단위로 끊기므로 '예/정' 세로 분해 방지 */
}
.A-mini .head .name::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.A-mini.live .head .name { color: var(--info) }
.A-mini.live .head .name::before { animation: dot-pulse-strong 1.4s ease-in-out infinite }
.A-mini.next .head .name { color: var(--warning) }
.A-mini.next .head .name::before { animation: dot-pulse-strong 1.8s ease-in-out infinite }
.A-mini.plan .head .name { color: #7c3aed }
.A-mini.plan .head .name::before { animation: dot-pulse-strong 1.7s ease-in-out infinite }
.A-mini.done .head .name { color: var(--text-secondary) }
.A-mini .head .cnt { font-size: 15px; font-weight: 700; color: var(--text-primary); flex-shrink: 0 }
.A-mini .head .meta { font-size: 11px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0 }
.A-mini .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; font-size: 12.5px; gap: 8px; cursor: pointer; min-width: 0;
}
.A-mini .row:hover .n { color: var(--accent) }
.A-mini .row .n { flex: 1 1 0; min-width: 0; font-weight: 500; letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.15s }
.A-mini .row .b {
  font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
  flex-shrink: 0; letter-spacing: 0.04em;
}
.A-mini.live .row .b { background: #ecfeff; color: var(--info) }
.A-mini.next .row .b { background: #fffbeb; color: var(--warning) }
.A-mini.plan .row .b { background: #f3e8ff; color: #7c3aed }
.A-mini.done .row .b { background: #f4f4f5; color: var(--text-secondary) }
.A-mini .empty { font-size: 12px; color: var(--text-muted); padding: 8px 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
/* 목록이 5건을 넘으면 카드가 혼자 길어지지 않게 5행 높이로 고정하고 안쪽만 스크롤.
   스크롤바는 숨기고 잘리는 쪽 끝을 흐리게 처리해 "더 있다"를 알린다(넘치지 않으면 마스크 없음). */
.A-mini .rows { max-height: 160px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; overscroll-behavior: contain }
.A-mini .rows::-webkit-scrollbar { display: none }
.A-mini .rows.fade-b { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, #000 0, #000 78%, transparent 100%) }
.A-mini .rows.fade-t { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22%); mask-image: linear-gradient(180deg, transparent 0, #000 22%) }
.A-mini .rows.fade-t.fade-b { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%) }

/* v8 모바일 반응형 */
@media (max-width: 1024px) {
  .A-grid { grid-template-columns: minmax(0, 1fr); gap: 12px }
  .A-hero { min-height: 240px }
  /* 칸 수는 auto-fit이 컨테이너 폭 기준으로 알아서 줄인다 — 뷰포트 기준으로 강제하지 않는다 */
  .A-row { gap: 10px }
}
@media (max-width: 640px) {
  .A-hero { padding: 22px 22px; min-height: 200px }
  .A-hero h1 { font-size: 26px }
  .A-hero-foot { gap: 6px 16px; font-size: 11.5px }
  .A-hero-foot .it strong { font-size: 14px }
  .A-kpi-2x2 { gap: 8px }
  .A-kpi { padding: 16px 18px; min-height: 110px }
  .A-kpi .l { font-size: 13.5px }
  .A-kpi .v { font-size: 34px }
  .A-row { gap: 10px; margin-bottom: 20px }
  .A-mini { padding: 16px 18px }
}
@media (max-width: 380px) {
  .A-hero h1 { font-size: 22px }
  .A-kpi .v { font-size: 30px }
  .A-kpi .l { font-size: 13px }
}

/* 분할 화면 대응 — 칸 수는 컨테이너 실폭 기준.
   사이드바가 있어 뷰포트 미디어쿼리는 실제 콘텐츠 폭과 어긋나므로 @container로 판정한다.
   모든 단계에서 칸 폭은 minmax(0,1fr)로 균일. 4 → 2 → 1로만 떨어지고 3+1 같은 어긋난 배치는 만들지 않는다.
   (위 auto-fit 선언은 @container 미지원 브라우저용 폴백) */
.A-cq { container-type: inline-size }
@container (min-width: 960px) {
  .A-row { grid-template-columns: repeat(4, minmax(0, 1fr)) }
}
@container (max-width: 959.98px) {
  .A-grid { grid-template-columns: minmax(0, 1fr) }
  .A-row { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@container (max-width: 460px) {
  .A-row { grid-template-columns: minmax(0, 1fr) }
}

/* ─────────────────────────────────────────────────────────────
   v4 Analysis Panel — 가독성 업데이트
   ───────────────────────────────────────────────────────────── */

/* Big Numbers (§1 상단 핵심 지표 강조) */
.big-num-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin: 4px 0 18px;
}
.big-num {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-color 0.15s, background 0.15s;
}
.big-num:hover { border-color: var(--border-strong); }
.big-num .bn-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.big-num .bn-value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.1;
}
.big-num .bn-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}
.big-num.primary {
  background: var(--accent-soft);
  border-color: #bfdbfe;
}
.big-num.primary .bn-value { color: var(--accent); }
.big-num.primary .bn-label { color: var(--accent); opacity: 0.85; }

/* Significance badge (★ 대체) */
.signif-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--success-soft);
  color: var(--success);
  margin-left: 6px;
  letter-spacing: 0.02em;
  vertical-align: middle;
  line-height: 1.5;
}

/* %p 차이 색상 시그널 */
.pp-pos { color: var(--success); font-weight: 600 }
.pp-neg { color: var(--danger); font-weight: 600 }
.pp-zero { color: var(--text-secondary) }
.pp-signif { background: var(--success-soft); padding: 2px 8px; border-radius: 6px }

/* ===== Analysis v2 — 발송 메트릭 카드 ===== */
.an-send-row { display:flex; align-items:stretch; gap:0; margin:12px 0 18px; }
.an-send-card { flex:1; background:#f9fafb; border-radius:10px; padding:12px 14px; min-width:0; }
.an-send-arr { display:flex; align-items:center; padding:0 8px; color:#c7c7cc; font-size:16px; flex-shrink:0; }
.sc-num { font-size:20px; font-weight:700; color:#1d1d1f; line-height:1; margin-bottom:2px; }
.sc-label { font-size:10px; font-weight:700; color:#86868b; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
.sc-sub { font-size:13px; font-weight:600; color:#3a3a3c; margin-bottom:4px; }
.sc-bar { height:5px; border-radius:3px; background:#e5e5ea; overflow:hidden; display:flex; margin:8px 0 6px; }
.sc-bar-ios { height:100%; background:#5856d6; }
.sc-bar-aos { height:100%; background:#34c759; }
.sc-os-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.os-ios { font-size:11px; color:#5856d6; font-weight:600; }
.os-ios::before { content:'●'; margin-right:3px; font-size:9px; }
.os-aos { font-size:11px; color:#2ca846; font-weight:600; }
.os-aos::before { content:'●'; margin-right:3px; font-size:9px; }

/* ===== Analysis v2 — 퍼널 차트 ===== */
.fn-chart { margin:12px 0 18px; }
.fn-row { display:flex; align-items:center; gap:10px; margin:4px 0; }
.fn-label { width:116px; font-size:11.5px; color:#3a3a3c; text-align:right; flex-shrink:0; line-height:1.3; }
.fn-bar-wrap { flex:1; background:#f0f0f2; border-radius:4px; height:20px; overflow:hidden; }
.fn-bar { height:100%; border-radius:4px; transition:width .5s cubic-bezier(.4,0,.2,1); }
.fn-bar-entry { background:#d1d1d6; }
.fn-bar-tg { background:#0071e3; }
.fn-nums { width:120px; font-size:12px; flex-shrink:0; }
.fn-abs { font-weight:600; color:#1d1d1f; }
.fn-rel { color:#86868b; margin-left:5px; }
.fn-sig { color:#ff9500; margin-left:3px; font-size:10px; }
.fn-connector { border-left:1px dashed #d1d1d6; height:6px; margin-left:calc(116px + 10px); margin-top:-2px; margin-bottom:-2px; }

/* ===== Analysis v2 — 비교표 ===== */
.an-comp-table { width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0 18px; }
.an-comp-table th { background:#f5f5f7; font-weight:600; padding:7px 10px; border:1px solid #e5e5ea; white-space:nowrap; }
.an-comp-table td { padding:6px 10px; border:1px solid #e5e5ea; vertical-align:middle; }
.an-comp-table td small { color:#86868b; font-size:11px; margin-left:3px; }
.an-report-link { margin:18px 0 4px; }
.an-report-link a { color:#0071e3; font-size:13px; }

/* Analysis section h4 — 컴팩트 (§ 마크·가로선 제거) */
.tab-content h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  margin: 22px 0 10px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.tab-content h4:first-of-type { margin-top: 0 }
.tab-content h4 .h4-sub {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0;
}

/* Analysis tables — padding·여백 확대 */
.tab-content table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 4px;
  background: var(--bg-card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.tab-content table th {
  padding: 10px 14px;
  text-align: left;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 11.5px;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.tab-content table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  color: var(--text-primary);
}
.tab-content table tr:last-child td { border-bottom: none }
.tab-content table tbody tr:hover { background: #fafafa }
/* 딥링크 권역 표 — 내용 너비 맞춤 + 셀 전체 테두리(또렷) + 컴팩트 */
.tab-content table.dl-table { width: auto; font-size: 12.5px; border: 1px solid #9aa0a6; border-radius: 0; overflow: visible; }
.tab-content table.dl-table th {
  padding: 5px 12px; border: 1px solid #9aa0a6;
  text-transform: none; letter-spacing: 0; font-size: 11px;
}
.tab-content table.dl-table td {
  padding: 5px 12px; border: 1px solid #9aa0a6; white-space: nowrap;
}
.tab-content table.dl-table tr:last-child td { border-bottom: 1px solid #9aa0a6 }

.tab-content sub {
  display: block;
  color: var(--text-muted);
  font-size: 11.5px;
  margin-top: 8px;
}
.tab-content .placeholder {
  background: var(--bg);
  border: 1px dashed var(--border);
  padding: 16px 18px;
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.6;
}
.tab-content .placeholder small {
  color: var(--text-muted);
  display: block;
  margin-top: 4px;
}
.tab-content .footer-note {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11.5px;
  line-height: 1.7;
}

/* (v4 KPI 그라데이션 제거됨 — v6에서 hero/일반 카드 디자인으로 교체) */

/* ===== 분석 탭 — T1 풀 그리드 (실행 탭 딥링크 표 양식) ===== */
#tab-analysis table { border: 0; border-radius: 0; font-size: 12.5px; display: block; width: fit-content; overflow-x: auto; max-width: 100%; }   /* 박스 테두리 없음 — 외곽선은 셀 모서리 색으로만(스크롤 시 박스 테두리와 셀 테두리 겹침 방지) */
#tab-analysis table th, #tab-analysis table td {
  border: 1px solid #1a1a1a; padding: 6px 12px; text-align: right;   /* 전체 선(외곽·안쪽) 1px 선명한 검정 통일 */
  white-space: nowrap; color: var(--text-primary); text-transform: none; letter-spacing: -0.01em; background: none;
}
#tab-analysis table td:first-child { text-align: left; }
#tab-analysis table td.rtc { color: #71717a; }
#tab-analysis table td.cnt, #tab-analysis table th.cnt, #tab-analysis table td.rtc, #tab-analysis table th.rtc { min-width: 86px; }   /* 유저수·비율 동일 폭 */
#tab-analysis table td.cnt.muted { color: #a1a1aa; }   /* 고유 유저 아님(간접 오픈 등) 회색 */
#tab-analysis table thead th { background: #f3f5f7; color: #3a3f45; font-weight: 700; font-size: 12.5px; text-transform: none; letter-spacing: 0; text-align: center; }
#tab-analysis table tbody tr:hover { background: none; }
#tab-analysis table td.rt { color: #71717a; }
#tab-analysis table td .rt { margin-left: 4px; color: #71717a; }
#tab-analysis table td.sub { padding-left: 22px; }
#tab-analysis .brc { color: #a1a1aa; margin-right: 5px; }
#tab-analysis .bz { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; color: #8a8f98; margin-left: 6px; letter-spacing: 0; }
#tab-analysis .subnote { display: block; color: var(--text-muted); font-size: 11px; margin-top: 8px; line-height: 1.7; }
#tab-analysis h4 .h4cap { font-size: 11px; font-weight: 500; color: var(--text-muted); }
#tab-analysis .pp-up { color: #dc2626; font-weight: 600; }    /* + 빨강 (한국식) */
#tab-analysis .pp-down { color: #2563eb; font-weight: 600; }  /* − 파랑 (한국식) */
#tab-analysis .pp-flat { color: var(--text-primary); }        /* 비유의 = 색 없음 */
#tab-analysis .signif-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: #f1f3f5; color: #71717a; margin-left: 6px; vertical-align: middle; }
/* 분석 헤더 — 전환 기준 스탯 + 분석 진행 스테퍼 (플랫, 토스 스타일) */
#tab-analysis .an-head { display: flex; align-items: stretch; gap: 0; background: #f9fafb; border: 1px solid #f2f4f6; border-radius: 16px; padding: 14px 22px; margin: 0 0 18px; flex-wrap: nowrap; overflow-x: auto; }
#tab-analysis .an-head::-webkit-scrollbar { height: 6px; }
#tab-analysis .an-head::-webkit-scrollbar-thumb { background: #d1d6db; border-radius: 3px; }
#tab-analysis .ac-stat { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 24px; border-right: 1px solid #e5e8eb; min-width: 92px; cursor: default; }
#tab-analysis .ac-stat .acs-label { font-size: 11px; font-weight: 600; color: #8b95a1; }
#tab-analysis .ac-stat .acs-val { font-size: 21px; font-weight: 800; color: #191f28; line-height: 1.15; white-space: nowrap; letter-spacing: -.02em; }
#tab-analysis .ac-stat .acs-time { font-size: 12.5px; font-weight: 600; color: #4e5968; white-space: nowrap; }
#tab-analysis .ac-stat .acs-src { font-size: 11px; font-weight: 500; color: #8b95a1; }
#tab-analysis .ac-steps { flex: 1; display: flex; align-items: flex-start; padding: 4px 0 0 26px; min-width: max-content; }
#tab-analysis .acstep { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; }
#tab-analysis .acstep .dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; position: relative; box-sizing: border-box; }
#tab-analysis .acstep.done .dot { background: #3182f6; color: #fff; }
#tab-analysis .acstep.fin .dot { background: #16a34a; color: #fff; }
#tab-analysis .acstep.todo .dot { background: #fff; border: 2px solid #d1d6db; }
#tab-analysis .acstep.cur .dot::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(49, 130, 246, .5); animation: acpulse 1.6s ease-out infinite; }
#tab-analysis .acstep .s-name { font-size: 11.5px; font-weight: 700; color: #333d4b; white-space: nowrap; }
#tab-analysis .acstep.todo .s-name { color: #8b95a1; }
#tab-analysis .acstep .s-date { font-size: 10.5px; color: #8b95a1; white-space: nowrap; }
#tab-analysis .acline { flex: 1; height: 2px; background: #e5e8eb; margin: 9px 8px 0; border-radius: 2px; min-width: 22px; }
#tab-analysis .acline.done { background: #3182f6; }

    <!-- 칩은 자기 탭에서만 보인다(data-vt). 탭 전환 시 views_ext.js 가 부모 data-vt 를 바꾼다. -->

  <div id="view-crm">
  <!-- 이번 주 추천 (주간 캠페인 추천 — 표 리스트, 클릭 시 기획중) -->
  <section id="weekly-reco" style="display:none;background:#fff;border:1px solid #e6e8ef;border-radius:14px;padding:16px 18px;margin:12px 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div id="wr-title" style="font-size:16px;font-weight:700;color:#1e293b;cursor:pointer;user-select:none">📅 이번 주 추천</div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="wr-reject-all" type="button" title="미결정 후보를 모두 비채택으로 저장" style="display:none;border:1px solid #fecaca;background:#fff;color:#dc2626;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;line-height:1.4">✕ 남은 후보 모두 비채택</button>
        <a id="wr-doc" href="#" target="_blank" rel="noopener" style="font-size:13px;color:#6366f1;text-decoration:none">📄 추천 근거 문서</a>
      </div>
    </div>
    <div id="wr-sub" style="font-size:12px;color:#94a3b8;margin:2px 0 10px"></div>
    <div id="wr-body" style="overflow-x:auto"></div>
    <div id="wr-cal" style="margin-top:12px;display:none"></div>
  </section>
  <script>
  (function(){
    const tierColor={A:'#059669',B:'#d97706',C:'#64748b','정규':'#7c3aed'};
    let RECO=null;
    let collapsed=false;
    function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function sc(v){return v==='상'?'#059669':(v==='중'?'#d97706':(v==='하'?'#dc2626':'#94a3b8'));}
    function axc(v,t){return '<td style="text-align:center;padding:7px 9px;color:'+sc(v)+';font-weight:600"'+(t?(' title="'+String(t).replace(/"/g,"&quot;")+'"'):'')+'>'+(v||'-')+'</td>';}
    function decBtn(id,act,active){
      const on=act==='adopted'?{bg:'#2563eb',bd:'#2563eb'}:{bg:'#dc2626',bd:'#dc2626'};
      const sym=act==='adopted'?'✓':'✕';
      const style='border:1px solid '+(active?on.bd:'#cbd5e1')+';background:'+(active?on.bg:'#fff')+';color:'+(active?'#fff':'#94a3b8')+';border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.3';
      return '<button data-id="'+id+'" data-act="'+act+'" class="wr-dec" style="'+style+'" title="'+(act==='adopted'?'채택':'비채택')+'">'+sym+'</button>';
    }
    function _ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    function dateSelect(c){
      const days=weekDates();const dow=['월','화','수','목','금','토','일'];
      let opts='';days.forEach(function(d,i){var k=_ymd(d);var sel=(c.send_date===k)?' selected':'';opts+='<option value="'+k+'"'+sel+'>'+(d.getMonth()+1)+'/'+d.getDate()+' '+dow[i]+'</option>';});
      return '<select class="wr-date" data-id="'+c.id+'" style="font-size:12px;padding:2px 4px;border:1px solid #cbd5e1;border-radius:5px;cursor:pointer">'+opts+'</select>';
    }
    function audSelect(c){
      const a=c.audience||'전체';
      return '<select class="wr-aud" data-id="'+c.id+'" style="font-size:12px;padding:2px 4px;border:1px solid #cbd5e1;border-radius:5px;cursor:pointer">'+
        '<option value="전체"'+(a==='전체'?' selected':'')+'>전체</option>'+
        '<option value="타겟"'+(a==='타겟'?' selected':'')+'>타겟</option></select>';
    }
    function renderHeader(){
      const done=allDecided();
      const arrow=collapsed?'▸':'▾';
      const txt=done?('✅ W'+RECO.week+' 캠페인 채택 완료'):('📅 이번 주 추천 W'+RECO.week);
      document.getElementById('wr-title').innerHTML=txt+' <span style="font-size:12px;color:#94a3b8;font-weight:400">'+arrow+'</span>';
    }
    function applyCollapse(){
      document.getElementById('wr-sub').style.display=collapsed?'none':'';
      document.getElementById('wr-body').style.display=collapsed?'none':'';
      renderHeader();renderRejectAll();
    }
    function weekDates(){
      let mon;const m=((RECO&&RECO.period)||'').match(/(\d{4})-(\d{2})-(\d{2})/);
      if(m){mon=new Date(+m[1],+m[2]-1,+m[3]);}else{mon=new Date();}
      const days=[];for(var i=0;i<7;i++){var d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d);}
      return days;
    }
    function renderCal(){
      const cal=document.getElementById('wr-cal');
      const adopted=((RECO&&RECO.candidates)||[]).filter(function(c){return c.decision==='adopted';});
      if(!adopted.length){cal.style.display='none';cal.innerHTML='';return;}
      cal.style.display='block';
      const days=weekDates();const dow=['월','화','수','목','금','토','일'];
      const hols=(RECO&&RECO.holidays)||{};
      const cols=days.map(function(d,i){
        const key=_ymd(d);
        const hol=hols[key];const isHol=!!hol;
        const items=adopted.filter(function(c){return c.send_date===key;});
        const chips=items.map(function(c){
          // 칩 색상 = 하단 KPI 카드 상태색: 운영중=진행(파랑) / 발송·운영완료=완료(회색) / 그 외 채택=기획중(보라)
          var kc='#7c3aed';
          if(c.ongoing){ kc='#0891b2'; }  // 상시 운영중(종료 전)
          else if(c.executed){
            var _oneShot=['앱푸시','푸시','SMS','이메일'].indexOf(c.channel)>=0;
            var _end=c.end_date||c.send_date||'';
            var _T=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
            kc=(!_oneShot && _end && _end>=_T)?'#0891b2':'#71717a';
          } else if(c.scheduled){ kc='#d97706'; }
          var full=(c.title+(c.audience?(' · '+c.audience):'')).replace(/"/g,'&quot;');
          return '<div title="'+full+'" style="background:'+kc+';color:#fff;border-radius:6px;padding:3px 7px;font-size:10.5px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;box-shadow:0 1px 2px rgba(16,24,40,.12)">'+c.title+'</div>';
        }).join('');
        const dayColor=isHol?'#dc2626':'#334155';
        const holBadge=isHol?'<span style="background:#fee2e2;color:#dc2626;font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.5">'+hol+'</span>':'';
        return '<div style="flex:1;min-width:0;min-height:94px;border:1px solid '+(isHol?'#fecaca':'#eceef2')+';border-radius:11px;padding:8px 8px 10px;background:'+(isHol?'#fef6f6':'#fff')+';box-shadow:0 1px 2px rgba(16,24,40,.04)">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:17px">'+
            '<span style="font-size:12px;font-weight:700;color:'+dayColor+'">'+dow[i]+'</span>'+holBadge+
          '</div>'+
          '<div style="font-size:10px;color:#98a2b3;margin-top:1px">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>'+
          chips+'</div>';
      }).join('');
      cal.innerHTML='<div style="font-size:12.5px;color:#475467;margin-bottom:8px;font-weight:600;letter-spacing:-.01em">📅 채택 캠페인 주간 일정</div><div style="display:flex;gap:6px;align-items:stretch">'+cols+'</div>';
    }
    function injectReco(){
      try{
        if(typeof CAMPAIGNS==='undefined'||!Array.isArray(CAMPAIGNS))return;
        for(var i=CAMPAIGNS.length-1;i>=0;i--){if(CAMPAIGNS[i]&&CAMPAIGNS[i]._reco)CAMPAIGNS.splice(i,1);}
        // 추천↔캠페인 링크: 서버가 seriesKey 정규화 정확매칭으로 linkedCampaignId/scheduled/executed 세팅.
        // 링크가 있으면 실제 캠페인 카드가 대표 → 기획중 초안 중복 주입 무조건 차단.
        function _norm(s){return (s||'').replace(/\s+/g,'').toLowerCase();}
        // 서버 링크 정보가 전혀 없을 때만 쓰는 이름 폴백(날짜 정확일치 요구 완화 + seriesKey 부분일치 허용).
        function _alreadyRealCampaign(c){
          var t=_norm(c.title);
          var sk=_norm(c.series_key);
          if(!t && !sk) return false;
          return CAMPAIGNS.some(function(x){
            if(!x||x._reco) return false;
            var xn=_norm(x.name);
            var xsk=_norm(x.seriesKey);
            if(!xn && !xsk) return false;
            // seriesKey 부분일치(있으면 우선)
            if(sk && xsk && (xsk===sk||xsk.indexOf(sk)>=0||sk.indexOf(xsk)>=0)) return true;
            // 이름 부분일치(날짜 정확일치는 요구하지 않음)
            return !!xn && !!t && (xn===t||xn.indexOf(t)>=0||t.indexOf(xn)>=0);
          });
        }
        ((RECO&&RECO.candidates)||[]).forEach(function(c){
          if(c.decision!=='adopted') return;
          // 1) 서버 링크 신호가 하나라도 있으면 실제 캠페인 카드가 대표 → 중복 주입 무조건 차단
          var hasLink=(c.linkedCampaignId!=null && c.linkedCampaignId!=='')||c.scheduled===true||c.executed===true;
          if(hasLink) return;
          // 2) 링크 정보가 전혀 없을 때만 이름/seriesKey 폴백으로 중복 차단
          if(_alreadyRealCampaign(c)) return;
          var sd=c.send_date?new Date(c.send_date):new Date();
          CAMPAIGNS.push({id:'reco:'+c.id,name:c.title,status:'기획중',sendDate:c.send_date||'',endDate:c.send_date||'',sendDateObj:sd,year:RECO.year,week:RECO.week,type:c.kind||'',target:'',owner:'',medium:'',_reco:true});
        });
      }catch(e){}
    }
    function patchBoard(){
      if(typeof renderCategoryBoard==='function'&&!renderCategoryBoard._recoPatched){
        var _orig=renderCategoryBoard;
        renderCategoryBoard=function(){injectReco();return _orig.apply(this,arguments);};
        renderCategoryBoard._recoPatched=true;
      }
    }
    function syncPlanCard(){
      if(typeof renderCategoryBoard!=='function'){setTimeout(syncPlanCard,300);return;}
      patchBoard();injectReco();
      try{renderCategoryBoard();}catch(e){}
    }
    function allDecided(){
      const cs=(RECO&&RECO.candidates)||[];
      return cs.length>0&&cs.every(function(c){return c.decision==='adopted'||c.decision==='rejected';});
    }
    function pendingCands(){
      return ((RECO&&RECO.candidates)||[]).filter(function(c){return !(c.executed||c.scheduled)&&c.decision!=='adopted'&&c.decision!=='rejected';});
    }
    function renderRejectAll(){
      var b=document.getElementById('wr-reject-all'); if(!b)return;
      var n=pendingCands().length;
      b.style.display=(n>0&&!collapsed)?'':'none';
      b.textContent='✕ 남은 후보 '+n+'건 모두 비채택';
    }
    async function rejectAllPending(){
      var b=document.getElementById('wr-reject-all');
      var list=pendingCands(); if(!list.length)return;
      if(!confirm('미결정 후보 '+list.length+'건을 모두 비채택으로 저장할까요?\n(채택한 건과 세팅 완료 건은 그대로 둡니다)'))return;
      b.disabled=true; var fail=0;
      for(var i=0;i<list.length;i++){
        var c=list[i]; b.textContent='비채택 저장 중 '+(i+1)+'/'+list.length;
        try{
          const r=await fetch('/api/plan-candidate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,year:RECO.year,week:RECO.week,decision:'rejected'})});
          const j=await r.json();
          if(j&&j.ok){c.decision='rejected';c.planned=false;}else{fail++;}
        }catch(e){fail++;}
      }
      b.disabled=false;
      syncPlanCard();renderCal();if(allDecided()){collapsed=true;}renderTable();applyCollapse();
      if(fail){alert('비채택 저장 실패 '+fail+'건. 새로고침 후 다시 시도해 주세요.');}
    }
    function renderTable(){
      const th='padding:7px 9px;white-space:nowrap';
      const TODAY_STR=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); // KST 기준 오늘
      // 채널 — 톤다운된 색으로 구분(저채도)
      function chChip(ch){
        if(!ch) return '<span style="color:#cbd5e1">-</span>';
        var M={'앱푸시':{bg:'#eaf0fb',fg:'#3b5b92'},'푸시':{bg:'#eaf0fb',fg:'#3b5b92'},
          '인앱 메시지':{bg:'#e8f3f1',fg:'#3f7068'},'인앱':{bg:'#e8f3f1',fg:'#3f7068'},
          'SMS':{bg:'#f4efe5',fg:'#7a6a45'},'이메일':{bg:'#efe9f5',fg:'#5f5080'},
          '기획전':{bg:'#f4ece6',fg:'#7d5a44'}};
        var c=M[ch]||{bg:'#eef1f4',fg:'#5b6470'};
        return '<span style="display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:'+c.bg+';color:'+c.fg+';white-space:nowrap">'+ch+'</span>';
      }
      // 평가축 미니바(종합점수 호버 툴팁용)
      function tipBar(label,v){
        var n=(v==='상')?3:(v==='중')?2:(v==='하')?1:0;
        var segs='';
        for(var i=1;i<=3;i++){segs+='<span style="display:inline-block;width:15px;height:5px;border-radius:2px;margin-left:3px;background:'+(i<=n?'#2563eb':'#e5e7eb')+'"></span>';}
        return '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:3px 0"><span style="color:#475569">'+label+'</span><span style="display:inline-flex;align-items:center"><span style="color:#94a3b8;font-size:10px;margin-right:3px;min-width:12px;text-align:right">'+(v||'-')+'</span>'+segs+'</span></div>';
      }
      function axisTip(c){
        return '<div style="font-size:11.5px;min-width:158px;max-width:230px">'+
          '<div style="font-weight:700;color:#1e293b;margin-bottom:5px;border-bottom:1px solid #eef2f6;padding-bottom:5px">평가 5축</div>'+
          (c.axis_summary?'<div style="color:#334155;font-size:11px;margin-bottom:6px;white-space:normal;line-height:1.4">'+esc(c.axis_summary)+'</div>':'')+
          tipBar('모수',c.reach)+tipBar('검색',c.demand)+tipBar('랜딩',c.landing)+tipBar('제휴',c.partner)+tipBar('반복',c.repeat)+
          (c.repeat_evidence?'<div style="color:#98a2b3;font-size:10px;margin-top:5px;border-top:1px solid #eef2f6;padding-top:5px;white-space:normal">'+esc(c.repeat_evidence)+'</div>':'')+
          '</div>';
      }
      // 종합점수 — 원형 게이지 링(점수/15 비율). 호버 시 평가축 툴팁
      function scoreBadge(c){
        var has=(c.composite!=null);
        var v=has?c.composite:'-';
        var pct=has?Math.max(0,Math.min(100,Math.round(c.composite/15*100))):0;
        return '<span class="wr-score" data-id="'+c.id+'" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;vertical-align:middle;cursor:default;background:conic-gradient(#2563eb '+pct+'%, #eaecf0 0);transition:transform .12s,box-shadow .12s">'+
          '<span style="position:absolute;inset:3px;background:#fff;border-radius:50%"></span>'+
          '<b style="position:relative;font-size:11.5px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;letter-spacing:-.02em">'+v+'</b></span>';
      }
      // 실행 상태 문구(채널별): 푸시·SMS·이메일=발송완료 / 인앱·기획전=운영중·운영완료. 색은 운영중만 강조
      function execStatus(c){
        if(c.ongoing) return {lbl:'운영중',bg:'#ecfeff',fg:'#0891b2'};  // 상시(종료 전)
        var oneShot=['앱푸시','푸시','SMS','이메일'].indexOf(c.channel)>=0;
        if(oneShot) return {lbl:'발송완료',bg:'#f1f5f9',fg:'#64748b'};
        var end=c.end_date||c.send_date||'';
        if(end && end>=TODAY_STR) return {lbl:'운영중',bg:'#ecfeff',fg:'#0891b2'};
        return {lbl:'운영완료',bg:'#f1f5f9',fg:'#64748b'};
      }
      // 잠금 대상: 발송완료·운영(executed) + 예정(scheduled, 세팅 완료)
      function lk(c){return !!(c.executed||c.scheduled);}
      // 정렬: 잠금(완료·운영·예정) 상단·날짜 오름차순 → 그 외 종합점수 내림차순
      var list=RECO.candidates.slice().sort(function(a,b){
        var ax=lk(a)?0:1, bx=lk(b)?0:1;
        if(ax!==bx) return ax-bx;
        if(lk(a)&&lk(b)) return (a.send_date||'').localeCompare(b.send_date||'');
        return (b.composite||0)-(a.composite||0);
      });
      var axisTipMap={};
      const rows=list.map(function(c){
        axisTipMap[c.id]=axisTip(c);
        const locked=lk(c);
        const kb=c.kind?('<span style="font-size:10px;color:#64748b;background:#f1f5f9;border-radius:4px;padding:1px 6px;margin-right:5px">'+c.kind+'</span>'):'';
        const planSub=(locked&&c.planned_title&&c.planned_title!==c.title)?'<div style="font-size:10px;color:#98a2b3;margin-top:2px">← 기존 기획: '+c.planned_title+'</div>':'';
        var statusCell;
        if(locked){ var st=c.executed?execStatus(c):{lbl:'예정',bg:'#fffbeb',fg:'#d97706'}; statusCell='<span title="세팅 완료 — 수정 잠금" style="display:inline-block;font-size:11px;font-weight:700;color:'+st.fg+';background:'+st.bg+';border-radius:6px;padding:3px 10px;white-space:nowrap">'+st.lbl+'</span>'; }
        else { statusCell='<div style="display:flex;gap:4px;justify-content:center">'+decBtn(c.id,'adopted',c.decision==='adopted')+decBtn(c.id,'rejected',c.decision==='rejected')+'</div>'; }
        const dateCell=locked?('<span style="color:#475569">'+(c.send_date||'')+'</span>'):dateSelect(c);
        const audCell=locked?('<span style="color:#475569">'+(c.audience||'')+'</span>'):audSelect(c);
        const rowBg=locked?' style="background:#fafbfc"':'';
        return '<tr'+rowBg+'>'+
          '<td style="text-align:center;padding:7px 9px">'+scoreBadge(c)+'</td>'+
          '<td style="text-align:left;white-space:nowrap;padding:7px 9px">'+kb+'<span style="font-weight:600">'+c.title+'</span>'+planSub+'</td>'+
          '<td style="text-align:center;white-space:nowrap;padding:7px 9px">'+chChip(c.channel)+'</td>'+
          '<td style="text-align:center;white-space:nowrap;padding:7px 9px" title="예매 '+(c.yemae||'')+'">'+dateCell+'</td>'+
          '<td style="text-align:center;white-space:nowrap;padding:7px 9px">'+audCell+'</td>'+
          '<td style="text-align:center;padding:7px 9px">'+statusCell+'</td>'+
          '<td class="wr-reason" data-id="'+c.id+'" title="클릭해 판단 근거 입력/수정" style="text-align:left;white-space:nowrap;padding:7px 9px;cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis">'+(c.reason?'<span style="color:#475569">'+esc(c.reason)+'</span>':'<span style="color:#cbd5e1">+ 근거 입력</span>')+'</td></tr>';
      }).join('');
      document.getElementById('wr-body').innerHTML=
        '<table style="border-collapse:collapse;width:100%;font-size:13px">'+
        '<thead><tr style="background:#eef2ff;color:#3730a3">'+
        '<th style="'+th+'">종합점수</th><th style="'+th+';text-align:left">후보</th>'+
        '<th style="'+th+'">채널</th>'+
        '<th style="'+th+'">발송일</th><th style="'+th+'">대상</th>'+
        '<th style="'+th+'">상태</th><th style="'+th+';text-align:left">판단 근거</th>'+
        '</tr></thead><tbody>'+rows+'</tbody></table>';
      // 종합점수 호버 → 평가 5축 툴팁 (position:fixed, 클리핑 방지)
      var _tip=document.getElementById('wr-score-tip');
      if(!_tip){ _tip=document.createElement('div'); _tip.id='wr-score-tip'; _tip.style.cssText='position:fixed;z-index:9999;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 28px rgba(16,24,40,.16);padding:10px 12px;display:none;pointer-events:none'; document.body.appendChild(_tip); }
      document.querySelectorAll('.wr-score').forEach(function(el){
        el.addEventListener('mouseenter',function(){
          var id=el.getAttribute('data-id'); _tip.innerHTML=axisTipMap[id]||''; _tip.style.display='block';
          var r=el.getBoundingClientRect(), tw=_tip.offsetWidth, thh=_tip.offsetHeight;
          var left=r.left+r.width/2-tw/2; if(left<8)left=8; if(left+tw>window.innerWidth-8)left=window.innerWidth-8-tw;
          var top=r.top-thh-8; if(top<8)top=r.bottom+8;
          _tip.style.left=left+'px'; _tip.style.top=top+'px';
          el.style.transform='scale(1.08)'; el.style.boxShadow='0 2px 9px rgba(37,99,235,.28)';
        });
        el.addEventListener('mouseleave',function(){ _tip.style.display='none'; el.style.transform='none'; el.style.boxShadow='none'; });
      });
      document.querySelectorAll('.wr-dec').forEach(function(b){
        b.addEventListener('click',async function(){
          const id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
          const cand=RECO.candidates.find(function(x){return x.id===id;});
          if(!cand)return;
          const next=(cand.decision===act)?null:act;
          b.parentNode.querySelectorAll('button').forEach(function(x){x.disabled=true;});
          try{
            const r=await fetch('/api/plan-candidate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,year:RECO.year,week:RECO.week,decision:next})});
            const j=await r.json();
            if(j&&j.ok){cand.decision=next;cand.planned=(next==='adopted');syncPlanCard();renderCal();if(allDecided()){collapsed=true;}renderTable();applyCollapse();if(next){openReasonModal(id);}}
          }catch(e){}
          b.parentNode.querySelectorAll('button').forEach(function(x){x.disabled=false;});
        });
      });
      document.querySelectorAll('.wr-date').forEach(function(s){
        s.addEventListener('change',async function(){
          const id=s.getAttribute('data-id');const val=s.value;
          const cand=RECO.candidates.find(function(x){return x.id===id;});
          s.disabled=true;
          try{const r=await fetch('/api/reco-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,year:RECO.year,week:RECO.week,send_date:val})});const j=await r.json();if(j&&j.ok&&cand){cand.send_date=val;syncPlanCard();renderCal();}}catch(e){}
          s.disabled=false;
        });
      });
      document.querySelectorAll('.wr-aud').forEach(function(s){
        s.addEventListener('change',async function(){
          const id=s.getAttribute('data-id');const val=s.value;
          const cand=RECO.candidates.find(function(x){return x.id===id;});
          s.disabled=true;
          try{const r=await fetch('/api/reco-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,year:RECO.year,week:RECO.week,audience:val})});const j=await r.json();if(j&&j.ok&&cand){cand.audience=val;}}catch(e){}
          s.disabled=false;
        });
      });
      document.querySelectorAll('.wr-reason').forEach(function(el){
        el.addEventListener('click',function(){openReasonModal(el.getAttribute('data-id'));});
      });
    }
    function openReasonModal(cid){
      var cand=((RECO&&RECO.candidates)||[]).find(function(x){return x.id===cid;});
      if(!cand)return;
      var m=document.getElementById('wr-reason-modal');
      if(!m){
        m=document.createElement('div'); m.id='wr-reason-modal';
        m.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px';
        m.innerHTML='<div style="background:#fff;border-radius:14px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(16,24,40,.25);padding:20px 22px">'+
          '<div id="wrm-title" style="font-size:15px;font-weight:700;color:#1e293b;margin-bottom:3px"></div>'+
          '<div id="wrm-sub" style="font-size:12px;color:#94a3b8;margin-bottom:12px"></div>'+
          '<textarea id="wrm-text" rows="4" placeholder="이 결정의 판단 근거를 적어주세요 (예: 잠실 주차 수요 급증·제휴 수익 기대 / 거리응원이라 주차 수요 약함)" style="width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;line-height:1.5;resize:vertical;outline:none"></textarea>'+
          '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">'+
            '<button id="wrm-cancel" type="button" style="border:1px solid #e2e8f0;background:#fff;color:#64748b;border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer">취소</button>'+
            '<button id="wrm-save" type="button" style="border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:8px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer">저장</button>'+
          '</div></div>';
        document.body.appendChild(m);
        m.addEventListener('click',function(e){if(e.target===m)m.style.display='none';});
        document.getElementById('wrm-cancel').addEventListener('click',function(){m.style.display='none';});
        document.getElementById('wrm-save').addEventListener('click',saveReasonFromModal);
        document.getElementById('wrm-text').addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveReasonFromModal();});
      }
      m.setAttribute('data-id',cid);
      var dec=cand.decision==='adopted'?'채택':(cand.decision==='rejected'?'비채택':'미결정');
      document.getElementById('wrm-title').textContent='판단 근거 — '+cand.title;
      document.getElementById('wrm-sub').textContent='결정: '+dec+'  ·  저장하면 새로고침해도 유지됩니다';
      var ta=document.getElementById('wrm-text'); ta.value=cand.reason||'';
      m.style.display='flex';
      setTimeout(function(){ta.focus();},30);
    }
    function saveReasonFromModal(){
      var m=document.getElementById('wr-reason-modal'); if(!m)return;
      var cid=m.getAttribute('data-id');
      var cand=((RECO&&RECO.candidates)||[]).find(function(x){return x.id===cid;});
      var val=document.getElementById('wrm-text').value;
      var btn=document.getElementById('wrm-save'); btn.disabled=true; btn.textContent='저장 중...';
      fetch('/api/reco-reason',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:cid,year:RECO.year,week:RECO.week,reason:val})})
        .then(function(r){return r.json();}).then(function(j){if(j&&j.ok&&cand){cand.reason=(val||'').trim();renderTable();}})
        .catch(function(){})
        .then(function(){m.style.display='none';btn.disabled=false;btn.textContent='저장';});
    }
    async function loadWeeklyReco(){
      const root=document.getElementById('weekly-reco');
      try{const r=await fetch('/api/weekly-reco',{cache:'no-store'});RECO=await r.json();}catch(e){return;}
      if(!RECO||RECO.empty||!(RECO.candidates||[]).length){return;}
      patchBoard();syncPlanCard();
      root.style.display='block';
      document.getElementById('wr-sub').textContent=(RECO.period||'')+' · 점수 호버 시 평가 5축 · 근거 셀 클릭 시 판단 근거 수정 · 세팅 완료 건 잠금';
      const doc=document.getElementById('wr-doc');if(RECO.doc_url){doc.href=RECO.doc_url;}else{doc.style.display='none';}
      const titleEl=document.getElementById('wr-title');
      if(!titleEl._bound){titleEl.addEventListener('click',function(){collapsed=!collapsed;applyCollapse();});titleEl._bound=true;}
      const rjEl=document.getElementById('wr-reject-all');
      if(!rjEl._bound){rjEl.addEventListener('click',rejectAllPending);rjEl._bound=true;}
      collapsed=allDecided();
      renderTable();renderCal();applyCollapse();
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadWeeklyReco);else loadWeeklyReco();
  })();
  </script>
